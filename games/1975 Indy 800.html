<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Indy 800</title>
<style>
  body { background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Courier New', monospace; padding: 20px; margin: 0; color: #ddd; }
  #hud { display: flex; gap: 24px; font-size: 16px; font-weight: bold; margin-bottom: 12px; letter-spacing: 1px; }
  #hud span { padding: 4px 10px; border-radius: 4px; }
  #timer { color: #ffdd55; font-size: 20px; }
  canvas { background: #000; border: 3px solid #444; border-radius: 6px; display: block; }
  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 32px;
    font-weight: bold;
    text-align: center;
    z-index: 100;
    padding: 20px;
  }
  #overlay.show { display: flex; }
  #overlay > div {
    max-height: 90vh;
    overflow-y: auto;
    max-width: 400px;
  }
  #champPanel {
    color: #ffdd55;
    font-size: 16px;
    line-height: 1.6;
    text-align: left;
    padding: 20px;
    background: rgba(20, 20, 32, 0.9);
    border-radius: 12px;
    border: 2px solid #2a2a4a;
  }
  #trackGap {
    flex: 0 0 40px;
        min-width: 40px;
  }
  #racePanel {
    color: #fff;
    font-size: 16px;
    line-height: 1.6;
    text-align: left;
    padding: 20px;
    background: rgba(20, 20, 32, 0.9);
    border-radius: 12px;
    border: 2px solid #2a2a4a;
    max-width: 400px;
  }
  #racePanel small {
    display: block;
    font-size: 13px;
    margin-top: 12px;
    color: #88ff88;
    font-weight: normal;
    text-align: center;
  }
  .wrap { position: relative; }
    .game-layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  #sidebar {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 200px;
    font-size: 14px;
    font-weight: bold;
  }
  #timer {
    color: #ffdd55;
    font-size: 28px;
    text-align: center;
    padding: 8px;
    background: #1a1a30;
    border-radius: 6px;
    letter-spacing: 1px;
  }
    #scoresRow {
    display: flex;
    flex-direction: row;
    gap: 8px;
    align-items: flex-start;
  }
  #raceScores, #champScores {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }
  #raceScores span, #champScores span {
    padding: 4px 10px;
    border-radius: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .section-label {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #667799;
    padding: 4px 6px 2px;
    font-weight: bold;
  }
    #overlay {
    font-size: 20px;
    line-height: 1.5;
  }
  #overlay div {
    max-height: 80vh;
    overflow-y: auto;
  }
</style>
</head>
<body>

<div class="game-layout">
  <div id="overlay">
    <div id="champPanel"></div>
    <div id="trackGap"></div>
    <div id="racePanel">
      <div id="overlayText"></div>
      <small>Press R to restart</small>
    </div>
  </div>
  <div class="wrap">
    <canvas id="game"></canvas>
  </div>
  <div id="sidebar">
        <select id="trackSelect" style="background:#1a1a30; color:#88bbff; border:1px solid #3a3a6a; border-radius:6px; padding:6px; font-family:inherit; font-size:14px; font-weight:bold;">
        <option value="indy800" selected>Indy 800</option>
        <option value="chicane800">Chicane 800</option>
        <option value="cross800">Cross 800</option>
        <option value="oval800">Oval 800</option>
        <option value="fish800">Fish 800</option>
    </select>
    </select>
    <select id="raceMode" style="background:#1a1a30; color:#88ff88; border:1px solid #3a3a6a; border-radius:6px; padding:6px; font-family:inherit; font-size:14px; font-weight:bold;">
        <option value="single" selected>Single Race</option>
        <option value="championship">Championship (5 races)</option>
    </select>
    <select id="raceLength" style="background:#1a1a30; color:#ffdd55; border:1px solid #3a3a6a; border-radius:6px; padding:6px; font-family:inherit; font-size:14px; font-weight:bold;">
        <option value="30">30s Sprint</option>
        <option value="60">60s</option>
        <option value="90" selected>90s Standard</option>
        <option value="120">120s</option>
        <option value="180">180s Endurance</option>
        <option value="360">360s Super Endurance</option>
    </select>
     <div id="timer">90.0</div>
    <div id="scoresRow">
      <div id="raceScores"></div>
      <div id="champScores"></div>
    </div>
</div>
</div>

<script>
(function () {
	
	  // ---------- AUDIO ----------
  let audioCtx = null;

  function initAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { /* silent fail */ }
  }



  function playBeep(freq, duration, volume) {
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(volume || 0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration);
    } catch (e) {}
  }

  function playCrash() {
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      // Noise burst
      const bufferSize = audioCtx.sampleRate * 0.2;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.15));
      }
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      const gain = audioCtx.createGain();
      gain.gain.value = 0.2;
      source.connect(gain);
      gain.connect(audioCtx.destination);
      source.start(now);
      
      // Low thud
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(120, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
      oscGain.gain.setValueAtTime(0.15, now);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    } catch (e) {}
  }

  // Skid — short filtered noise burst, volume scales with slip amount
  let skidNodes = null;
  function playSkid(slipAmount) {
    if (!audioCtx || slipAmount <= 0) return;
    try {
      const now = audioCtx.currentTime;
      // Volume: ~0.005 at threshold, ~0.04 at full slip
      const vol = Math.min(0.1, slipAmount * 0.04);
      const dur = 0.15;
      const bufferSize = audioCtx.sampleRate * dur;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        const env = 1 - i / bufferSize;
        data[i] = (Math.random() * 2 - 1) * env * env;
      }
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1800;   // high, whiny — tyre-like
      filter.Q.value = 2.5;
      const gain = audioCtx.createGain();
      gain.gain.value = vol;
      source.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      source.start(now);
    } catch (e) {}
  }
	
  // Countdown crowd cheer — swells in volume as the clock runs down
  let crowdNodes = null;

  function startFinalSiren() {
    if (!audioCtx || crowdNodes) return;
    try {
      const now = audioCtx.currentTime;

      // Outer gain: fixed, safe ceiling
      const master = audioCtx.createGain();
      master.gain.value = 1.0;
      master.connect(audioCtx.destination);

      // Swell gain: WE drive this every frame. Starts near silent.
      const swell = audioCtx.createGain();
      swell.gain.value = 0.01;
      swell.connect(master);

      // Base "roar" — filtered noise
      const noiseLen = audioCtx.sampleRate * 2;
      const noiseBuf = audioCtx.createBuffer(1, noiseLen, audioCtx.sampleRate);
      const nd = noiseBuf.getChannelData(0);
      for (let i = 0; i < noiseLen; i++) nd[i] = Math.random() * 2 - 1;
      const noiseSrc = audioCtx.createBufferSource();
      noiseSrc.buffer = noiseBuf;
      noiseSrc.loop = true;
      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.value = 700;
      noiseFilter.Q.value = 0.7;
      const noiseGain = audioCtx.createGain();
      noiseGain.gain.value = 0.9;
      noiseSrc.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(swell);
      noiseSrc.start(now);

      // Two detuned "voices" — the aaaoooh of the crowd
      const voiceA = audioCtx.createOscillator();
      const voiceB = audioCtx.createOscillator();
      voiceA.type = 'sawtooth';
      voiceB.type = 'sawtooth';
      voiceA.frequency.value = 220;
      voiceB.frequency.value = 331;
      const lfo = audioCtx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.9;
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 30;
      lfo.connect(lfoGain);
      lfoGain.connect(voiceA.frequency);
      lfoGain.connect(voiceB.frequency);

      const voiceFilter = audioCtx.createBiquadFilter();
      voiceFilter.type = 'lowpass';
      voiceFilter.frequency.value = 900;
      const voiceGain = audioCtx.createGain();
      voiceGain.gain.value = 0.03;
      voiceA.connect(voiceFilter);
      voiceB.connect(voiceFilter);
      voiceFilter.connect(voiceGain);
      voiceGain.connect(swell);
      voiceA.start(now);
      voiceB.start(now);
      lfo.start(now);

      crowdNodes = { master, swell, noiseSrc, voiceA, voiceB, lfo };
    } catch (e) { crowdNodes = null; }
  }

  function updateCrowdVolume(timeLeft) {
    if (!crowdNodes || !audioCtx) return;
    // 10s remaining -> 0.02 ; 0s remaining -> 0.35
    const t = Math.max(0, Math.min(1, (10 - timeLeft) / 10));
    const gain = 0.02 + t * t * 0.33;
    try {
      // Direct set, no ramping — guaranteed instant
      crowdNodes.swell.gain.value = gain;
    } catch (e) {}
  }

  function stopFinalSiren() {
    if (!crowdNodes || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      // Quick fade-out so it doesn't click
      crowdNodes.swell.gain.cancelScheduledValues(now);
      crowdNodes.swell.gain.setValueAtTime(crowdNodes.swell.gain.value, now);
      crowdNodes.swell.gain.linearRampToValueAtTime(0, now + 0.3);
      crowdNodes.noiseSrc.stop(now + 0.4);
      crowdNodes.voiceA.stop(now + 0.4);
      crowdNodes.voiceB.stop(now + 0.4);
      crowdNodes.lfo.stop(now + 0.4);
    } catch (e) {}
    crowdNodes = null;
  }
  
    // ---------- RACE-END FANFARE ----------
  function playFanfare() {
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      // Three-note rising fanfare: G5, B5, D6 (a bright major triad)
      const notes = [
        { freq: 784,   start: 0.00, dur: 0.18, vol: 0.10 },  // G5
        { freq: 988,   start: 0.20, dur: 0.18, vol: 0.10 },  // B5
        { freq: 1175,  start: 0.40, dur: 0.55, vol: 0.13 },  // D6 (held)
      ];
      for (const n of notes) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(n.freq, now + n.start);
        gain.gain.setValueAtTime(0.0001, now + n.start);
        gain.gain.exponentialRampToValueAtTime(n.vol, now + n.start + 0.02);
        gain.gain.setValueAtTime(n.vol, now + n.start + n.dur - 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + n.start + n.dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + n.start);
        osc.stop(now + n.start + n.dur + 0.05);
      }
      // Second layer on the held note — a fifth above, for "chord" feel
      const fifth = audioCtx.createOscillator();
      const fifthGain = audioCtx.createGain();
      fifth.type = 'triangle';
      fifth.frequency.setValueAtTime(1760, now + 0.40); // A6
      fifthGain.gain.setValueAtTime(0.0001, now + 0.40);
      fifthGain.gain.exponentialRampToValueAtTime(0.06, now + 0.42);
      fifthGain.gain.setValueAtTime(0.06, now + 0.90);
      fifthGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.95);
      fifth.connect(fifthGain);
      fifthGain.connect(audioCtx.destination);
      fifth.start(now + 0.40);
      fifth.stop(now + 1.0);
    } catch (e) {}
  }
	
  // ---------- TRACK DATA ----------
  const TRACKS = {

  ],
      zones: {
		          order: ['A', 'B', 'C'],
        // zone A: top straight, cars cross col 18 while between rows 3-8
        A: { axis: 'col', value: 18, dir: 'increasing', range: [2, 7] },

  const START = [

  // ---------- PARSE THE GRID ----------
  const COLS = 37, ROWS = 28;

  let wallGrid = Array.from({length: ROWS + 1}, () => Array(COLS + 1).fill(false));
  let pathPositions = {};
  let waypoints = [];

  function parseTrack(rows) {
    wallGrid = Array.from({length: ROWS + 1}, () => Array(COLS + 1).fill(false));
    pathPositions = {};

    for (const raw of rows) {
      const cells = raw.split('|').map(s => s.trim());
      const rowNum = parseInt(cells[2]);
      if (isNaN(rowNum) || rowNum < 2 || rowNum > 28) continue;
      for (let c = 2; c <= COLS + 1; c++) {
        const v = cells[c + 1] || '';
        if (v === '-') {
          wallGrid[rowNum][c] = true;
        } else if (/^p\d+$/i.test(v)) {
          const n = parseInt(v.substring(1));
          if (!pathPositions[n]) pathPositions[n] = [];
          pathPositions[n].push({ r: rowNum, c: c });
        }
      }
    }

    // Build ordered waypoint list p1..p101. Each pN appears as a band of cells;
    // take the band centre so the waypoint sits mid-lane.
    waypoints = [];
    const maxPath = Math.max(...Object.keys(pathPositions).map(Number));
    for (let n = 1; n <= maxPath; n++) {
      const cells = pathPositions[n];
      if (!cells || cells.length === 0) continue;
      const rs = cells.map(p => p.r).sort((a, b) => a - b);
      const cs = cells.map(p => p.c).sort((a, b) => a - b);
      const mid = arr => (arr[0] + arr[arr.length - 1]) / 2;
      waypoints.push({ r: mid(rs) - 0.5, c: mid(cs) - 0.5 });
    }
  }

  // Active track config (set by loadTrack)

  // ---------- CONFIG ----------

    '#40c040',  // Alain — green

    parseTrack(t.rows);

    for (const s of START) s.angle = t.startAngle;
    for (let i = 0; i < cars.length; i++) {
      const s = START[i];

      cars[i].x = s.col - 0.5;
      cars[i].y = s.row - 0.5;

  const trackCanvas = document.createElement('canvas');

  function buildStaticTrack() {
    tctx.fillStyle = '#0a0a14';
    tctx.fillRect(0, 0, W, H);

    // Faint grid background
    tctx.strokeStyle = 'rgba(40, 50, 80, 0.3)';
    tctx.lineWidth = 1;
    for (let r = 0; r <= ROWS; r++) {
      tctx.beginPath();
      tctx.moveTo(0, r * CELL);
      tctx.lineTo(W, r * CELL);
      tctx.stroke();
    }
    for (let c = 0; c <= COLS; c++) {
      tctx.beginPath();
      tctx.moveTo(c * CELL, 0);
      tctx.lineTo(c * CELL, H);
      tctx.stroke();
    }
    // Dark road surface
    tctx.fillStyle = '#141420';
    tctx.fillRect(0, 0, W, H);

    // Draw all cells
    for (let r = 1; r <= ROWS; r++) {
      for (let c = 1; c <= COLS; c++) {
                if (wallGrid[r] && wallGrid[r][c]) {

          tctx.shadowBlur = 6;
          tctx.fillStyle = '#d0f0b0';
          tctx.fillRect((c-1)*CELL + 4, (r-1)*CELL + 4, CELL - 8, CELL - 8);

        }

  }

  // ---------- STATE ----------
  let cars = [];
  let keys = {};
  let raceMode = 'single';           // 'single' or 'championship'

  let championshipPoints = {};       // { Player: 0, Max: 0, ... } — accumulates
  const CHAMPIONSHIP_TRACKS = ['indy800', 'chicane800', 'cross800', 'oval800', 'fish800'];
  let timeLeft = RACE_TIME;
  let gameState = 'menu';
  let menuActive = true;
  let lastTime = 0;
  let accumulator = 0;
  let countdownTimer = 180;
  const FIXED_DT = 1 / 60;

   function makeCar(idx, isAI, slot) {
    const s = START[slot !== undefined ? slot : idx];
    const baseSpeeds = [5.1, 4.7, 5.2, 4.8, 4.9, 5.1, 4.8, 5.3];
    const frequencies = [1, Math.PI / 3, Math.PI / 5, Math.PI / 4,
                         Math.PI / 6, Math.PI / 7, Math.PI / 2, Math.PI / 2.5];
    
    return {

function checkZones(car, dt) {
  if (car.prevX === undefined) {
    car.prevX = car.x;
    car.prevY = car.y;
  }

  if (car.zoneACooldown > 0) car.zoneACooldown -= dt;
  if (car.zoneBCooldown > 0) car.zoneBCooldown -= dt;
  if (car.zoneCCooldown > 0) car.zoneCCooldown -= dt;

  const row = Math.round(car.y + 0.5);
  const col = Math.round(car.x + 0.5);
  const prevRow = Math.round(car.prevY + 0.5);
  const prevCol = Math.round(car.prevX + 0.5);

  function crossed(z) {
    if (!z) return false;
    if (z.axis === 'col') {
      const hit = z.dir === 'increasing'
        ? (prevCol < z.value && col >= z.value)
        : (prevCol > z.value && col <= z.value);
      if (!hit) return false;
      return row >= z.range[0] && row <= z.range[1];
    } else {
      const hit = z.dir === 'increasing'
        ? (prevRow < z.value && row >= z.value)
        : (prevRow > z.value && row <= z.value);
      if (!hit) return false;
      return col >= z.range[0] && col <= z.range[1];
    }
  }

  // Each car tracks which zone it's expected to hit next via zonesThisLap:
  //   0 = next is order[0], 1 = next is order[1], 2 = next is order[2]
  // Score only when the car crosses the *expected* zone. After scoring, advance
  // to the next one. This prevents repeated scoring by bouncing on one line.
  const order = currentZones.order || ['A', 'B', 'C'];
  const expectedKey = order[car.zonesThisLap];
  const expectedZone = currentZones[expectedKey];
  const expectedCooldown = expectedKey === 'A' ? car.zoneACooldown
                        : expectedKey === 'B' ? car.zoneBCooldown
                        : car.zoneCCooldown;

  if (crossed(expectedZone) && expectedCooldown <= 0) {
    car.score += 2;
    car.lastScoreTime = performance.now();
    if (expectedKey === 'A') car.zoneACooldown = 2.0;
    else if (expectedKey === 'B') car.zoneBCooldown = 2.0;
    else car.zoneCCooldown = 2.0;

    // Advance to next zone in the lap order
    car.zonesThisLap = (car.zonesThisLap + 1) % order.length;

    const beepFreq = expectedKey === 'A' ? 880
                    : expectedKey === 'B' ? 1100
                    : 660;
    playBeep(beepFreq, 0.1, 0.06);
  }

  car.prevX = car.x;
  car.prevY = car.y;
}

  // ---------- PHYSICS ----------
  function updatePlayer(car, dt) {
    if (car.iframes > 0) car.iframes -= dt;

    if (car.spinTimer > 0) {
      car.spinTimer -= dt;
      tryMoveTo(car, car.x + car.spinVx * dt, car.y + car.spinVy * dt);
      const frontX = car.x + Math.cos(car.angle) * 0.4;
      const frontY = car.y + Math.sin(car.angle) * 0.4;
      const fcx = Math.floor(frontX) + 1;
      const fcy = Math.floor(frontY) + 1;
      if (fcy < 2 || fcy > 28 || fcx < 2 || fcx > 37 || (wallGrid[fcy] && wallGrid[fcy][fcx])) {
        car.spinVx = -car.spinVx * 0.6;
        car.spinVy = -car.spinVy * 0.6;
      }
      car.spinVx *= 0.94;
      car.spinVy *= 0.94;
      car.angle += 12 * dt;
      car.speed = 0;
      car.vx = 0; car.vy = 0;
      if (car.spinTimer <= 0) {
        car.iframes = 0.5;
        car.collisionCleared = false;
        car.spinVx = 0;
        car.spinVy = 0;
        car.speed = 1.5;
      }
      return;
    }

    let accel = 0, turn = 0;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) accel += 1;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) accel -= 1;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) turn -= 1;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) turn += 1;

    // --- Longitudinal force (throttle / brake) ---
    // These act along the FACING direction (engine pushes where car points).
    const facingX = Math.cos(car.angle);
    const facingY = Math.sin(car.angle);
    const forwardSpeed = car.vx * facingX + car.vy * facingY;  // signed

    if (accel > 0) {
      car.vx += facingX * ACCEL * dt;
      car.vy += facingY * ACCEL * dt;
    } else if (accel < 0) {
      // Brake: oppose current forward motion
      if (forwardSpeed > 0.1) {
        car.vx -= facingX * BRAKE * dt;
        car.vy -= facingY * BRAKE * dt;
      } else {
        // Already stopped or reversing — apply reverse thrust
        car.vx -= facingX * ACCEL * 0.5 * dt;
        car.vy -= facingY * ACCEL * 0.5 * dt;
      }
    }

    // --- Steering: rotate the FACING direction ---
    // Steering authority scales with speed (can't turn while stationary).
    const speedNow = Math.hypot(car.vx, car.vy);
    const steerAuthority = Math.min(1, speedNow / 1.5) * Math.sign(forwardSpeed || 1);
    car.angle += turn * TURN_RATE * dt * steerAuthority;

    // --- Grip: pull velocity toward the facing direction ---
    const newFacingX = Math.cos(car.angle);
    const newFacingY = Math.sin(car.angle);
    const newForwardSpeed = car.vx * newFacingX + car.vy * newFacingY;

    // Decompose velocity into forward + lateral components
    const fwdVx = newFacingX * newForwardSpeed;
    const fwdVy = newFacingY * newForwardSpeed;
    const latVx = car.vx - fwdVx;
    const latVy = car.vy - fwdVy;

    // Grip strength
    const GRIP_BASE = 12.0;
    const GRIP_AT_SPEED = 4.0;
    const gripBlend = Math.min(1, speedNow / 2.0);
    const grip = GRIP_BASE * (1 - gripBlend) + GRIP_AT_SPEED * gripBlend;

    // Apply grip: kill lateral component proportionally
    const lateralKill = Math.min(1, grip * dt);
    car.vx = fwdVx + latVx * (1 - lateralKill);
    car.vy = fwdVy + latVy * (1 - lateralKill);

    // Skid sound — fires when lateral velocity is significant at speed
    const latSpeed = Math.hypot(latVx, latVy);
    const slip = latSpeed - 0.8;
    if (slip > 0 && speedNow > 2.0) {
      car._skidCooldown = (car._skidCooldown || 0) - dt;
      if (car._skidCooldown <= 0) {
        playSkid(Math.min(1, slip / 2.0));
        car._skidCooldown = 0.08;
      }
    }

    // --- Friction (slow down when no throttle) ---
    if (accel === 0) {
      const fric = FRICTION * dt;
      const curSpeed = Math.hypot(car.vx, car.vy);
      if (curSpeed < fric) {
        car.vx = 0; car.vy = 0;
      } else {
        const scale = (curSpeed - fric) / curSpeed;
        car.vx *= scale;
        car.vy *= scale;
      }
    }

    // --- Speed cap ---
    const curSpeed = Math.hypot(car.vx, car.vy);
    if (curSpeed > MAX_SPEED) {
      car.vx *= MAX_SPEED / curSpeed;
      car.vy *= MAX_SPEED / curSpeed;
    }

    // Keep car.speed synced (other code reads it)
    car.speed = forwardSpeed;
  }

   function updateAI(car, dt) {
    if (car.iframes > 0) car.iframes -= dt;

     if (car.spinTimer > 0) {
      car.spinTimer -= dt;

      // Try to move with spin velocity — rejected if it would enter a wall
      tryMoveTo(car, car.x + car.spinVx * dt, car.y + car.spinVy * dt);

      // If the move was rejected (car is against a wall), bounce off it
      const frontX = car.x + Math.cos(car.angle) * 0.4;
      const frontY = car.y + Math.sin(car.angle) * 0.4;
      const fcx = Math.floor(frontX) + 1;
      const fcy = Math.floor(frontY) + 1;
      if (fcy < 2 || fcy > 28 || fcx < 2 || fcx > 37 || (wallGrid[fcy] && wallGrid[fcy][fcx])) {
        car.spinVx = -car.spinVx * 0.6;
        car.spinVy = -car.spinVy * 0.6;
      }

      car.spinVx *= 0.94;
      car.spinVy *= 0.94;
      car.angle += 12 * dt;
      car.speed = 0;

      if (car.spinTimer <= 0) {
        car.iframes = 0.5;
        car.collisionCleared = false;
        car.spinVx = 0;
        car.spinVy = 0;
        car.speed = 1.5;
      }
      return;
    }
    
        let wp = waypoints[car.wpIndex];
    let nextWp = waypoints[(car.wpIndex + 1) % waypoints.length];

    let dx = wp.c - car.x;
    let dy = wp.r - car.y;
    let dist = Math.hypot(dx, dy);

    // Advance when close to the current waypoint, OR when we've driven past it
    const _nxt = waypoints[(car.wpIndex + 1) % waypoints.length];
    const passed = dist < 3.0 &&
      ((car.x - wp.c) * (_nxt.c - wp.c) + (car.y - wp.r) * (_nxt.r - wp.r)) > 0;
    if (dist < 1.8 || passed) {
      car.wpIndex = (car.wpIndex + 1) % waypoints.length;
    }

    if (car.reverseTimer > 0) {
      car.reverseTimer -= dt;
      car.speed = -2.5;
      const targetAngle = Math.atan2(waypoints[car.wpIndex].r - car.y, waypoints[car.wpIndex].c - car.x);
      let diff = targetAngle - car.angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      car.angle -= Math.max(-AI_TURN_RATE * dt, Math.min(AI_TURN_RATE * dt, diff));
      return;
    }

    if (car.forwardTimer > 0) {
      car.forwardTimer -= dt;
      car.speed = 1.5;
      const targetAngle = Math.atan2(waypoints[car.wpIndex].r - car.y, waypoints[car.wpIndex].c - car.x);
      let diff = targetAngle - car.angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
          // If moving fast, we can't turn as sharply (wider radius)
    const speedTurnFactor = Math.max(0.4, 1.0 - (car.speed / 8.0));
    const maxTurnThisFrame = AI_TURN_RATE * dt * speedTurnFactor;
    car.angle += Math.max(-maxTurnThisFrame, Math.min(maxTurnThisFrame, diff));
      return;
    }

    const lookAhead = Math.min(1, 2.5 / (dist + 0.5));
    let aimX = wp.c + (nextWp.c - wp.c) * lookAhead;
    let aimY = wp.r + (nextWp.r - wp.r) * lookAhead;
    if (car.laneOffset) {
      const trackAngle = Math.atan2(nextWp.r - wp.r, nextWp.c - wp.c);
      const perpAngle = trackAngle + Math.PI / 2;
      aimX += Math.cos(perpAngle) * car.laneOffset;
      aimY += Math.sin(perpAngle) * car.laneOffset;
    }
    const targetAngle = Math.atan2(aimY - car.y, aimX - car.x);
    let diff = targetAngle - car.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    car.angle += Math.max(-AI_TURN_RATE * dt, Math.min(AI_TURN_RATE * dt, diff));

    car.speedTimer += dt;
        if (car.wallCollisionCleared === false) {
      // Just hit a wall — don't accelerate into it this frame
      car.speed *= 0.9;  // let friction slow us down
      return;
    }
    const speedWave = Math.sin(car.speedTimer * car.speedFrequency);
    let currentMaxSpeed = car.baseSpeed;
    if (car.isAI) currentMaxSpeed += speedWave * car.speedVariance;
    const turnSharp = Math.abs(diff);
    const targetSpeed = currentMaxSpeed * (1 - Math.min(0.6, turnSharp * 0.55));
    if (car.speed < targetSpeed) car.speed += ACCEL * dt;
    else car.speed -= FRICTION * 1.5 * dt;
    car.speed = Math.min(car.speed, currentMaxSpeed);

    const moved = Math.hypot(car.x - car.lastX, car.y - car.lastY);
    car.lastX = car.x;
    car.lastY = car.y;
    if (moved < 0.02) car.stuckTimer += dt;
    else car.stuckTimer = 0;

        if (car.stuckTimer > 0.5) {
      // Car is stuck. Rotate to face the most open direction, then drive forward.
      car.stuckTimer = 0;

      // Sample 12 directions around the car. For each, measure how open the
      // path is over the next 2 cells. Pick the direction with the most
      // clear space. Prefer directions roughly away from current heading
      // (avoids picking the wall we're already pressed against).
      let bestAngle = car.angle;
      let bestScore = -Infinity;
      const SAMPLES = 12;
      for (let k = 0; k < SAMPLES; k++) {
        const a = (k / SAMPLES) * Math.PI * 2;
        // Count clear cells in a 2-cell ray from the car
        let clear = 0;
        let blocked = false;
        for (let step = 0.6; step <= 2.0; step += 0.4) {
          const tx = car.x + Math.cos(a) * step;
          const ty = car.y + Math.sin(a) * step;
          const cc = Math.floor(tx) + 1;
          const cr = Math.floor(ty) + 1;
          if (cr < 2 || cr > 28 || cc < 2 || cc > 37) { blocked = true; break; }
          if (wallGrid[cr] && wallGrid[cr][cc]) { blocked = true; break; }
          clear++;
        }
        if (blocked) continue;
        // Prefer directions closer to current heading (car is facing a wall —
        // it needs to turn away, so any open direction is fine, but staying
        // roughly forward keeps the AI on-track)
        const angleToTarget = Math.atan2(
          waypoints[car.wpIndex].r - car.y,
          waypoints[car.wpIndex].c - car.x
        );
        let diffToTarget = angleToTarget - a;
        while (diffToTarget > Math.PI) diffToTarget -= Math.PI * 2;
        while (diffToTarget < -Math.PI) diffToTarget += Math.PI * 2;
        const towardTarget = 1 - Math.abs(diffToTarget) / Math.PI;  // 1 = facing target, 0 = opposite

        const score = clear + towardTarget * 3;
        if (score > bestScore) {
          bestScore = score;
          bestAngle = a;
        }
      }

      // Turn the car to face the best direction and drive forward into it
      car.angle = bestAngle;
      car.speed = 2.0;
      car.reverseTimer = 0;
      car.forwardTimer = 0;
      car.lastResortTimer += 0.5;
    } else {
      car.lastResortTimer = 0;
    }

    // Last resort: if stuck for 4+ seconds straight, teleport to nearest waypoint
    if (car.lastResortTimer >= 4.0) {
      car.lastResortTimer = 0;
      let bestIdx = 0;
      let bestDist = Infinity;
      for (let i = 0; i < waypoints.length; i++) {
        const d = Math.hypot(waypoints[i].c - car.x, waypoints[i].r - car.y);
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      }
      const target = waypoints[bestIdx];
      car.x = target.c - 0.5;
      car.y = target.r - 0.5;
      car.angle = Math.atan2(waypoints[(bestIdx + 1) % waypoints.length].r - target.r,
                             waypoints[(bestIdx + 1) % waypoints.length].c - target.c);
      car.speed = 2.0;
      car.wpIndex = bestIdx;
    }
  }

function tryMoveTo(car, newX, newY) {
  const R = CAR_RADIUS;
  // Check the car's body at the proposed position (front, rear, left, right)
  const checks = [
    { x: newX, y: newY },
    { x: newX + Math.cos(car.angle) * 0.4, y: newY + Math.sin(car.angle) * 0.4 },
    { x: newX - Math.cos(car.angle) * 0.4, y: newY - Math.sin(car.angle) * 0.4 },
    { x: newX + Math.sin(car.angle) * 0.3, y: newY - Math.cos(car.angle) * 0.3 },
    { x: newX - Math.sin(car.angle) * 0.3, y: newY + Math.cos(car.angle) * 0.3 }
  ];
  for (const p of checks) {
    const cc = Math.floor(p.x) + 1;
    const cr = Math.floor(p.y) + 1;
    if (cr < 2 || cr > 28 || cc < 2 || cc > 37) return false;
    if (wallGrid[cr] && wallGrid[cr][cc]) return false;
  }
  car.x = newX;
  car.y = newY;
  return true;
}

function applyMovement(car, dt) {
  // Use velocity vector (drift-friendly). AI cars still set car.speed and angle,
  // so reconstruct velocity for them (they don't drift).
  let dx, dy;
  if (car.isAI) {
    dx = Math.cos(car.angle) * car.speed * dt;
    dy = Math.sin(car.angle) * car.speed * dt;
  } else {
    dx = car.vx * dt;
    dy = car.vy * dt;
  }
  
  // Try full movement
  if (tryMoveTo(car, car.x + dx, car.y + dy)) {
    car.wallCollisionCleared = true;
    return;
  }

  // Wall collision detected
  if (car.wallCollisionCleared) {
    car.wallCollisionCleared = false;

    // Find which axis is blocked
    const canX = tryMoveTo(car, car.x + dx, car.y);
    const canY = tryMoveTo(car, car.x, car.y + dy);

    // Push out along the free axis, or backward if cornered
    let pushX = 0, pushY = 0;
    if (!canX && canY) {
      pushX = -Math.sign(dx) * 0.6;
    } else if (canX && !canY) {
      pushY = -Math.sign(dy) * 0.6;
    } else {
      pushX = -Math.cos(car.angle) * 0.6;
      pushY = -Math.sin(car.angle) * 0.6;
    }
    tryMoveTo(car, car.x + pushX, car.y + pushY);

    // Spin away from the wall
    const turnDir = Math.random() < 0.5 ? 1 : -1;
    if (car.isAI) {
      car.angle += turnDir * (Math.PI / 2 + Math.random() * Math.PI / 2);
    } else {
      // Player gets a smaller nudge, not a full spin
      car.angle += turnDir * (Math.PI / 6);
    }

    // Strong reverse impulse — the car visibly flies back
    car.speed = -3.0;
    // Kill velocity so drift doesn't carry through the wall
    car.vx = Math.cos(car.angle) * car.speed;
    car.vy = Math.sin(car.angle) * car.speed;
  }
}

function carCollisions() {
  for (let i = 0; i < cars.length; i++) {
    for (let j = i + 1; j < cars.length; j++) {
      const a = cars[i], b = cars[j];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      const minDist = CAR_RADIUS * 2;

      if (d < minDist && d > 0.001) {
        const overlap = minDist - d;
        const nx = dx / d;
        const ny = dy / d;

        // Try to push apart — but only if the target position is not a wall
        tryMoveTo(a, a.x - nx * overlap * 0.5, a.y - ny * overlap * 0.5);
        tryMoveTo(b, b.x + nx * overlap * 0.5, b.y + ny * overlap * 0.5);

        if (a.iframes > 0 || b.iframes > 0) continue;
        if (a.collisionCleared && b.collisionCleared) {
          a.spinTimer = 0.4;
          b.spinTimer = 0.4;
          a.spinVx = -nx * 8.0;
          a.spinVy = -ny * 8.0;
          b.spinVx = nx * 8.0;
          b.spinVy = ny * 8.0;
          a.speed = 0;
          b.speed = 0;
          a.vx = 0; a.vy = 0;
          b.vx = 0; b.vy = 0;
          a.collisionCleared = false;
          b.collisionCleared = false;
          playCrash();
        }
      } else {
        if (a.spinTimer <= 0 && b.spinTimer <= 0) {
          a.collisionCleared = true;
          b.collisionCleared = true;
        }
      }
    }
  }
}

function drawCars() {
  for (const car of cars) {
    ctx.save();
    ctx.translate(car.x * CELL, car.y * CELL);
    ctx.rotate(car.angle);

    const w = CELL * 0.85;
    const h = CELL * 0.5;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.roundRect(-w/2 + 2, -h/2 + 2, w, h, 2);
    ctx.fill();

    // Main body (rounded rectangle)
    ctx.fillStyle = car.color;
    ctx.beginPath();
    ctx.roundRect(-w/2, -h/2, w, h, 2);
    ctx.fill();

    // Slight nose taper (just a small trapezoid at the front)
    ctx.fillStyle = car.color;
    ctx.beginPath();
    ctx.moveTo(w/2 - 2, -h/2 + 1);
    ctx.lineTo(w/2 + 2, -h/4);
    ctx.lineTo(w/2 + 2, h/4);
    ctx.lineTo(w/2 - 2, h/2 - 1);
    ctx.closePath();
    ctx.fill();

    // Cockpit (dark, center-back)
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath();
    ctx.roundRect(-w * 0.15, -h * 0.3, w * 0.3, h * 0.6, 1);
    ctx.fill();

    // Windshield (light strip in front of cockpit)
    ctx.fillStyle = 'rgba(150, 200, 255, 0.5)';
    ctx.fillRect(w * 0.15, -h * 0.35, 2, h * 0.7);

    // Rear spoiler
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(-w/2 - 1, -h/2 + 1, 2, h - 2);

    // Wheels (now 4x3 for visibility)
    ctx.fillStyle = '#ccc';
    ctx.fillRect(-w * 0.3, -h/2 - 2, 4, 3);
    ctx.fillRect(-w * 0.3, h/2 - 1, 4, 3);
    ctx.fillRect(w * 0.25, -h/2 - 2, 4, 3);
    ctx.fillRect(w * 0.25, h/2 - 1, 4, 3);

    ctx.restore();
  }
}

        ctx.moveTo(z.value * CELL, z.range[0] * CELL);

      } else {

        ctx.moveTo(z.range[0] * CELL, z.value * CELL);
        ctx.lineTo(z.range[1] * CELL, z.value * CELL);

      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 20;
      ctx.fillText(displayText, 0, 0);
      ctx.restore();
    }
  }

function getRankedCars() {
  return [...cars].sort((a, b) => {
    if (b.score !== a.score) return b.score - a.score;
    // Earlier score time = higher rank
    return (a.lastScoreTime || 0) - (b.lastScoreTime || 0);
  });
}

      const champWinner = Object.entries(championshipPoints)
        .sort((a, b) => b[1] - a[1])[0];
      champPanel.innerHTML = `
        <div style="font-size:20px; margin-bottom:10px;">🏆 ${champWinner[0].toUpperCase()} WINS 🏆</div>
        <div style="font-size:13px; color:#888; margin-bottom:12px;">final championship standings</div>
        ${champRankingHTML}
      `;
    }

    // Right panel: race result
    if (championshipRace < 5) {
      text.innerHTML = `
        <div style="font-size:20px; margin-bottom:10px;">RACE ${championshipRace}</div>
        <div style="font-size:14px; color:#aaa; margin-bottom:12px;">${isTie ? '🤝 Tie' : '🏆 ' + winner.name + ' wins'}</div>
        <div style="font-size:16px; line-height:1.6;">${raceRankingHTML}</div>
      `;
      racePanelSmall.textContent = 'Press SPACE for next race';
    } else {
      text.innerHTML = `
        <div style="font-size:20px; margin-bottom:10px;">RACE 5</div>
        <div style="font-size:14px; color:#aaa; margin-bottom:12px;">${isTie ? '🤝 Tie' : '🏆 ' + winner.name + ' wins'}</div>
        <div style="font-size:16px; line-height:1.6;">${raceRankingHTML}</div>
      `;
      racePanelSmall.textContent = 'Press R to restart championship';
    }
  } else {
    // Single race — hide left panel, show single big result
    champPanel.innerHTML = '';
    champPanel.style.display = 'none';

    if (isTie) {
      text.innerHTML = `<div style="font-size:24px;">🤝 TIE!</div><div style="font-size:20px; line-height:1.6; margin-top:12px;">${raceRankingHTML}</div>`;
    } else {
      text.innerHTML = `<div style="font-size:24px;">🏆 ${winner.name} WINS! 🏆</div><div style="font-size:20px; line-height:1.6; margin-top:12px;">${raceRankingHTML}</div>`;
    }
    racePanelSmall.textContent = 'Press R to restart';
  }

  // Restore champPanel display for next time we hit championship mode
  if (raceMode === 'championship') {
    champPanel.style.display = '';
  }

  overlay.classList.add('show');
  draw();
  updateHUD();
}

  document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();

    if (e.key === ' ' && menuActive) {
      menuActive = false;
      // Starting from the menu — reset championship if in that mode
      if (document.getElementById('raceMode').value === 'championship') {
        championshipRace = 1;
        championshipPoints = {};
        cars.forEach(c => { championshipPoints[c.name] = 0; });
      }
      startGame();
      return;
    }

    // SPACE between championship races → next race
    if (e.key === ' ' && gameState === 'finished' && raceMode === 'championship' && championshipRace < 5) {
      championshipRace++;
      startGame();
      return;
    }

    // R → restart (single race, or restart entire championship)
    if ((e.key === 'r' || e.key === 'R') && gameState === 'finished') {
      if (raceMode === 'championship') {
        championshipRace = 1;
        championshipPoints = {};
        cars.forEach(c => { championshipPoints[c.name] = 0; });
      }
      startGame();
    }
  });
  document.addEventListener('keyup', e => {
    keys[e.key] = false;
  });

  // Init audio on first keypress (browsers require user interaction)
    // Track change → reload on next race (or immediately if we're between races)
  // Championship mode toggles the track dropdown
  document.addEventListener('change', e => {
    if (e.target && e.target.id === 'raceMode') {
      const trackSel = document.getElementById('trackSelect');
      trackSel.disabled = (e.target.value === 'championship');
      trackSel.style.opacity = trackSel.disabled ? '0.4' : '1';
    }
  });

  // Track dropdown change → reload on next race (or immediately if between races)
  document.addEventListener('change', e => {
    if (e.target && e.target.id === 'trackSelect') {
      loadTrack(e.target.value);
      if (gameState === 'finished' || gameState === 'menu') {
        startGame();
      }
    }
  });
  document.addEventListener('keydown', initAudio, { once: true });
  document.addEventListener('mousedown', initAudio, { once: true });

  loadTrack('indy800');
  startGame();
})();
</script>
</body>
</html>
