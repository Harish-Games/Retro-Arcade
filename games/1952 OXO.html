<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OXO (Noughts & Crosses)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        .game-wrapper {
            background: #12121f;
            padding: 30px 40px 35px;
            border-radius: 16px;
            border: 2px solid #2a2a5a;
            text-align: center;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border: 3px solid #2a2a5a;
            border-radius: 8px;
            background: #0b0b18;
            cursor: pointer;
            width: 450px;
            height: 450px;
        }
        .info {
            display: flex;
            justify-content: space-between;
            color: #aac0ff;
            font-size: 18px;
            font-weight: bold;
            margin-top: 16px;
            padding: 0 10px;
        }
        .info .status {
            color: #ffdd77;
        }
        .info .score {
            color: #66ff88;
        }
        .controls {
            color: #6688aa;
            font-size: 13px;
            margin-top: 12px;
            border-top: 1px solid #1a1a3a;
            padding-top: 12px;
        }
        .controls kbd {
            background: #1a1a3a;
            padding: 2px 10px;
            border-radius: 4px;
            border: 1px solid #3a3a6a;
            color: #cce;
        }
        .controls button {
            background: #1a1a3a;
            color: #cce;
            border: 1px solid #3a3a6a;
            border-radius: 4px;
            padding: 4px 14px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            cursor: pointer;
        }
        .controls button:hover {
            background: #2a2a5a;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="450" height="450"></canvas>
        <div class="info">
            <div class="status" id="statusDisplay">Your turn</div>
            <div class="score">🏆 <span id="scoreDisplay">0</span></div>
        </div>
        <div class="controls">
            <kbd>Click</kbd> to place &nbsp;|&nbsp; <button id="restartBtn">New Game</button>
            <br><span style="font-size:12px;color:#445566;">vs AI (unbeatable)</span>
        </div>
    </div>
    <script>
        // ----- SETUP -----
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusDisplay = document.getElementById('statusDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');

        const SIZE = 450;
        const CELL = SIZE / 3;
        const PADDING = 16;

        // ----- GAME STATE -----
        let board = [
            ['', '', ''],
            ['', '', ''],
            ['', '', ''],
        ];
        let currentPlayer = 'X'; // X always goes first
        let gameOver = false;
        let winner = '';
        let score = 0;
        let winCells = [];

        // ----- AUDIO (simple) -----
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBeep(freq, duration) {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.start(now);
                osc.stop(now + duration);
            } catch (e) { /* ignore */ }
        }

        // ----- WIN DETECTION -----
        function checkWin() {
            const lines = [
                // rows
                [
                    [0, 0],
                    [0, 1],
                    [0, 2]
                ],
                [
                    [1, 0],
                    [1, 1],
                    [1, 2]
                ],
                [
                    [2, 0],
                    [2, 1],
                    [2, 2]
                ],
                // columns
                [
                    [0, 0],
                    [1, 0],
                    [2, 0]
                ],
                [
                    [0, 1],
                    [1, 1],
                    [2, 1]
                ],
                [
                    [0, 2],
                    [1, 2],
                    [2, 2]
                ],
                // diagonals
                [
                    [0, 0],
                    [1, 1],
                    [2, 2]
                ],
                [
                    [0, 2],
                    [1, 1],
                    [2, 0]
                ],
            ];

            for (const line of lines) {
                const [a, b, c] = line;
                if (board[a[0]][a[1]] &&
                    board[a[0]][a[1]] === board[b[0]][b[1]] &&
                    board[a[0]][a[1]] === board[c[0]][c[1]]) {
                    return {
                        winner: board[a[0]][a[1]],
                        cells: line
                    };
                }
            }

            // Check draw
            let empty = 0;
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    if (board[r][c] === '') empty++;
                }
            }
            if (empty === 0) {
                return { winner: 'draw', cells: [] };
            }

            return null;
        }

        // ----- AI (minimax with alpha-beta) -----
        function minimax(board, depth, isMaximizing, alpha, beta) {
            const result = checkWin();
            if (result) {
                if (result.winner === 'X') return -10 + depth;
                if (result.winner === 'O') return 10 - depth;
                if (result.winner === 'draw') return 0;
            }

            if (isMaximizing) {
                let best = -Infinity;
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {
                        if (board[r][c] === '') {
                            board[r][c] = 'O';
                            const score = minimax(board, depth + 1, false, alpha, beta);
                            board[r][c] = '';
                            best = Math.max(best, score);
                            alpha = Math.max(alpha, best);
                            if (beta <= alpha) break;
                        }
                    }
                }
                return best;
            } else {
                let best = Infinity;
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {
                        if (board[r][c] === '') {
                            board[r][c] = 'X';
                            const score = minimax(board, depth + 1, true, alpha, beta);
                            board[r][c] = '';
                            best = Math.min(best, score);
                            beta = Math.min(beta, best);
                            if (beta <= alpha) break;
                        }
                    }
                }
                return best;
            }
        }

        function aiMove() {
            let bestScore = -Infinity;
            let bestMove = null;

            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    if (board[r][c] === '') {
                        board[r][c] = 'O';
                        const score = minimax(board, 0, false, -Infinity, Infinity);
                        board[r][c] = '';
                        if (score > bestScore) {
                            bestScore = score;
                            bestMove = { r, c };
                        }
                    }
                }
            }

            return bestMove;
        }

        // ----- GAME LOGIC -----
        function makeMove(r, c) {
            if (gameOver) return;
            if (board[r][c] !== '') return;
            if (currentPlayer === 'O') return; // AI's turn

            // Player move (X)
            board[r][c] = 'X';
            playBeep(600, 0.06);

            const result = checkWin();
            if (result) {
                if (result.winner === 'X') {
                    winner = 'X';
                    winCells = result.cells;
                    score += 10;
                    gameOver = true;
                    statusDisplay.textContent = 'You win! 🎉';
                    playBeep(880, 0.2);
                    updateUI();
                    draw();
                    return;
                } else if (result.winner === 'draw') {
                    winner = 'draw';
                    gameOver = true;
                    statusDisplay.textContent = 'Draw!';
                    playBeep(440, 0.2);
                    updateUI();
                    draw();
                    return;
                }
            }

            // Switch to AI
            currentPlayer = 'O';
            statusDisplay.textContent = 'AI thinking...';
            updateUI();
            draw();

            // AI move after a short delay
            setTimeout(() => {
                if (gameOver) return;
                const move = aiMove();
                if (!move) {
                    // No moves left – should be draw
                    const result = checkWin();
                    if (result && result.winner === 'draw') {
                        winner = 'draw';
                        gameOver = true;
                        statusDisplay.textContent = 'Draw!';
                        playBeep(440, 0.2);
                        updateUI();
                        draw();
                    }
                    return;
                }

                board[move.r][move.c] = 'O';
                playBeep(400, 0.08);

                const result2 = checkWin();
                if (result2) {
                    if (result2.winner === 'O') {
                        winner = 'O';
                        winCells = result2.cells;
                        gameOver = true;
                        statusDisplay.textContent = 'AI wins! 🤖';
                        playBeep(660, 0.3);
                        updateUI();
                        draw();
                        return;
                    } else if (result2.winner === 'draw') {
                        winner = 'draw';
                        gameOver = true;
                        statusDisplay.textContent = 'Draw!';
                        playBeep(440, 0.2);
                        updateUI();
                        draw();
                        return;
                    }
                }

                currentPlayer = 'X';
                statusDisplay.textContent = 'Your turn';
                updateUI();
                draw();
            }, 150);
        }

        // ----- RESET -----
        function resetGame() {
            board = [
                ['', '', ''],
                ['', '', ''],
                ['', '', ''],
            ];
            currentPlayer = 'X';
            gameOver = false;
            winner = '';
            winCells = [];
            statusDisplay.textContent = 'Your turn';
            updateUI();
            draw();
        }

        function updateUI() {
            scoreDisplay.textContent = score;
        }

        // ----- DRAW -----
        function draw() {
            ctx.clearRect(0, 0, SIZE, SIZE);

            // ---- Grid lines ----
            ctx.strokeStyle = '#2a2a5a';
            ctx.lineWidth = 2;
            for (let i = 1; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL, 10);
                ctx.lineTo(i * CELL, SIZE - 10);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(10, i * CELL);
                ctx.lineTo(SIZE - 10, i * CELL);
                ctx.stroke();
            }

            // ---- Draw X and O ----
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    const x = c * CELL + CELL / 2;
                    const y = r * CELL + CELL / 2;
                    const val = board[r][c];

                    if (val === 'X') {
                        const isWin = winCells.some(w => w[0] === r && w[1] === c);
                        ctx.strokeStyle = isWin ? '#66ff88' : '#66ddff';
                        ctx.lineWidth = isWin ? 4 : 3;
                        ctx.shadowColor = isWin ? '#66ff88' : '#66ddff';
                        ctx.shadowBlur = isWin ? 20 : 10;
                        const s = CELL / 2 - PADDING;
                        ctx.beginPath();
                        ctx.moveTo(x - s, y - s);
                        ctx.lineTo(x + s, y + s);
                        ctx.moveTo(x + s, y - s);
                        ctx.lineTo(x - s, y + s);
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    } else if (val === 'O') {
                        const isWin = winCells.some(w => w[0] === r && w[1] === c);
                        ctx.strokeStyle = isWin ? '#66ff88' : '#ff66aa';
                        ctx.lineWidth = isWin ? 4 : 3;
                        ctx.shadowColor = isWin ? '#66ff88' : '#ff66aa';
                        ctx.shadowBlur = isWin ? 20 : 10;
                        const s = CELL / 2 - PADDING;
                        ctx.beginPath();
                        ctx.arc(x, y, s, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                }
            }

            // ---- Win line overlay ----
            if (winCells.length === 3 && winner !== 'draw') {
                const [a, b, c] = winCells;
                const x1 = a[1] * CELL + CELL / 2;
                const y1 = a[0] * CELL + CELL / 2;
                const x2 = c[1] * CELL + CELL / 2;
                const y2 = c[0] * CELL + CELL / 2;
                ctx.strokeStyle = 'rgba(100,255,136,0.4)';
                ctx.lineWidth = 6;
                ctx.shadowColor = 'rgba(100,255,136,0.2)';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // ---- Hover indicator ----
            if (!gameOver && currentPlayer === 'X') {
                // We'll draw a subtle hover on the canvas via mousemove
                if (hoverCell) {
                    const { r, c } = hoverCell;
                    if (board[r][c] === '') {
                        ctx.fillStyle = 'rgba(102,221,255,0.08)';
                        ctx.fillRect(c * CELL + 2, r * CELL + 2, CELL - 4, CELL - 4);
                    }
                }
            }
        }

        // ----- MOUSE -----
        let hoverCell = null;

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;
            const c = Math.floor(mx / CELL);
            const r = Math.floor(my / CELL);
            if (r >= 0 && r < 3 && c >= 0 && c < 3) {
                hoverCell = { r, c };
            } else {
                hoverCell = null;
            }
            draw();
        });

        canvas.addEventListener('mouseleave', () => {
            hoverCell = null;
            draw();
        });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;
            const c = Math.floor(mx / CELL);
            const r = Math.floor(my / CELL);
            if (r >= 0 && r < 3 && c >= 0 && c < 3) {
                makeMove(r, c);
            }
            initAudio();
        });

        // ----- RESTART BUTTON -----
        document.getElementById('restartBtn').addEventListener('click', () => {
            resetGame();
            initAudio();
        });

        // ----- KEYBOARD -----
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                resetGame();
                e.preventDefault();
            }
        });

        // ----- START -----
        resetGame();
        draw();
    </script>
</body>
</html>
