<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gyruss (1983) – FIXED</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0515;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        .game-wrapper {
            background: #12101f;
            padding: 20px 30px 25px;
            border-radius: 16px;
            border: 2px solid #2a2a5a;
            box-shadow: 0 0 60px rgba(100, 50, 200, 0.1);
            position: relative;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border: 3px solid #2a2a5a;
            border-radius: 8px;
            background: #0a0a18;
            width: 700px;
            height: 700px;
        }
        .info {
            display: flex;
            justify-content: space-between;
            color: #aac0ff;
            font-size: 16px;
            font-weight: bold;
            margin-top: 14px;
            padding: 0 10px;
            letter-spacing: 1px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .info span {
            color: #ffcc77;
        }
        .info .warp {
            color: #66ddff;
        }
        .controls {
            color: #6688aa;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            border-top: 1px solid #1a1a3a;
            padding-top: 10px;
        }
        .controls kbd {
            background: #1a1a3a;
            padding: 2px 10px;
            border-radius: 4px;
            border: 1px solid #3a3a6a;
            color: #cce;
        }
        #startScreen {
            position: absolute;
            top: 20px;
            left: 30px;
            right: 30px;
            bottom: 80px;
            background: rgba(0, 0, 0, 0.88);
            border-radius: 12px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
            border: 2px solid #2a2a5a;
            pointer-events: none;
        }
        #startScreen.active {
            display: flex;
            pointer-events: auto;
        }
        #startScreen h1 {
            color: #ff4477;
            font-size: 52px;
            letter-spacing: 8px;
            text-shadow: 0 0 40px rgba(255, 68, 119, 0.3);
            margin-bottom: 8px;
        }
        #startScreen .subtitle {
            color: #66ddff;
            font-size: 18px;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }
        #startScreen .controls-hint {
            color: #8899bb;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        #startScreen .controls-hint kbd {
            background: #1a1a3a;
            padding: 2px 10px;
            border-radius: 4px;
            border: 1px solid #3a3a6a;
            color: #cce;
        }
        #startBtn {
            background: transparent;
            color: #66ddff;
            border: 2px solid #66ddff;
            padding: 12px 40px;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            pointer-events: auto;
        }
        #startBtn:hover {
            background: #66ddff;
            color: #0a0a18;
            box-shadow: 0 0 30px rgba(102, 221, 255, 0.3);
        }
        #startScreen .version {
            color: #445577;
            font-size: 11px;
            margin-top: 15px;
            letter-spacing: 2px;
        }
        @media (max-width: 750px) {
            .game-wrapper {
                padding: 10px;
            }
            canvas {
                width: 90vw;
                height: 90vw;
            }
            #startScreen {
                top: 10px;
                left: 10px;
                right: 10px;
                bottom: 60px;
            }
            #startScreen h1 {
                font-size: 32px;
            }
            .info {
                font-size: 13px;
                flex-wrap: wrap;
                gap: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="700" height="700"></canvas>

        <div id="startScreen" class="active">
            <h1>GYRUSS</h1>
            <div class="subtitle">⚡ 3 WARPS TO NEPTUNE ⚡</div>
            <div class="controls-hint">
                <kbd>←</kbd> <kbd>→</kbd> orbit &nbsp;|&nbsp; <kbd>Space</kbd> fire
            </div>
            <button id="startBtn">START GAME</button>
            <div class="version">1983 • KONAMI • FIXED</div>
        </div>

        <div class="info">
            <div>🏆 SCORE <span id="scoreDisplay">0</span></div>
            <div>❤️ LIVES <span id="livesDisplay">3</span></div>
            <div class="warp">🌀 <span id="warpDisplay">3 WARPS TO NEPTUNE</span></div>
            <div id="powerupDisplay" style="color:#ffdd44; font-size:14px;"></div>
        </div>
        <div class="controls">
            <kbd>←</kbd> <kbd>→</kbd> orbit &nbsp;|&nbsp; <kbd>Space</kbd> fire &nbsp;|&nbsp; <kbd>R</kbd> restart
        </div>
    </div>

    <script>
        // ============================================================
        // GYRUSS – FIXED
        // Bonus enemies shootable, enemies face outward, bullets disappear
        // ============================================================

        // ----- SETUP -----
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const livesSpan = document.getElementById('livesDisplay');
        const warpSpan = document.getElementById('warpDisplay');
        const powerupSpan = document.getElementById('powerupDisplay');
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');

        const W = 700,
            H = 700;
        const CX = W / 2,
            CY = H / 2;
        const TUBE_RADIUS = 270;
        const PLAYER_RADIUS = 16;

        // ----- PLANETS -----
        const PLANETS = ['NEPTUNE', 'URANUS', 'SATURN', 'JUPITER', 'MARS', 'EARTH'];
        let planetIndex = 0;
        let warpsInLevel = 0;
        const WARPS_PER_PLANET = 3;

        // ----- AUDIO -----
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ctx = initAudio();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                switch (type) {
                    case 'shoot':
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(880, now);
                        osc.frequency.exponentialRampToValueAtTime(440, now + 0.05);
                        gain.gain.setValueAtTime(0.06, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                        osc.start(now);
                        osc.stop(now + 0.05);
                        break;
                    case 'enemyShoot':
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(500, now);
                        osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
                        gain.gain.setValueAtTime(0.05, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                        osc.start(now);
                        osc.stop(now + 0.08);
                        break;
                    case 'explosion':
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
                        gain.gain.setValueAtTime(0.10, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                        osc.start(now);
                        osc.stop(now + 0.2);
                        break;
                    case 'waveStart':
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
                        gain.gain.setValueAtTime(0.06, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                        osc.start(now);
                        osc.stop(now + 0.2);
                        break;
                    case 'gameOver':
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(440, now);
                        osc.frequency.exponentialRampToValueAtTime(110, now + 0.5);
                        gain.gain.setValueAtTime(0.10, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                        osc.start(now);
                        osc.stop(now + 0.5);
                        break;
                    case 'rescue':
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(700, now);
                        osc.frequency.exponentialRampToValueAtTime(1400, now + 0.15);
                        gain.gain.setValueAtTime(0.08, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                        osc.start(now);
                        osc.stop(now + 0.15);
                        break;
                    case 'bonus':
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(523, now);
                        osc.frequency.setValueAtTime(659, now + 0.08);
                        osc.frequency.setValueAtTime(784, now + 0.16);
                        osc.frequency.setValueAtTime(1047, now + 0.24);
                        gain.gain.setValueAtTime(0.06, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                        osc.start(now);
                        osc.stop(now + 0.3);
                        break;
                    default:
                        break;
                }
            } catch (e) { /* ignore */ }
        }

        // ----- GAME STATE -----
        let score = 0;
        let lives = 3;
        let gameOver = false;
        let frameCount = 0;
        let hitFlash = 0;
        let waveDelay = 0;
        let bonusStage = false;
        let bonusTimer = 0;
        let warpCount = 0;
        let isFirstWave = true;
        let bonusEnemies = [];
        let waveProgress = 0;
        let playerCanShoot = true;

        // ----- PLAYER -----
        const player = {
            angle: 0,
            speed: 0.04,
            x: 0,
            y: 0,
            alive: true,
            respawnTimer: 0,
            invincibleTimer: 60,
            radius: PLAYER_RADIUS,
            doubleShot: false,
            weaponLevel: 1,
        };
        player.x = CX + TUBE_RADIUS;
        player.y = CY;

        // ----- BULLETS -----
        let bullets = [];
        let enemyBullets = [];
        const BULLET_SPEED = 9;
        let enemyBulletSpeed = 2.8;

        // ----- ENEMIES -----
        let enemies = [];
        let enemySpawnQueue = [];
        let enemiesSpawned = 0;
        let enemiesDefeated = 0;
        let totalEnemiesInWave = 0;
        let waveInProgress = false;
        let formationComplete = false;

        // ----- SPECIAL ENEMIES -----
        let satellites = [];
        let asteroids = [];
        let laserBeams = [];

        // ----- PARTICLES -----
        let particles = [];

        // ----- STARS -----
        let stars = [];

        // ----- POWERUP -----
        let powerup = null;
        let powerupTimer = 0;

        // ----- INPUT -----
        const keys = {
            left: false,
            right: false,
            space: false,
        };

        // ----- HELPER FUNCTIONS -----
        function randomBetween(min, max) {
            return Math.random() * (max - min) + min;
        }

        function angleToPoint(angle, radius) {
            return {
                x: CX + Math.cos(angle) * radius,
                y: CY + Math.sin(angle) * radius,
            };
        }

        function dist(a, b) {
            return Math.hypot(a.x - b.x, a.y - b.y);
        }

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function getPlanetName() {
            return PLANETS[planetIndex % PLANETS.length];
        }

        function getWarpDisplay() {
            const remaining = WARPS_PER_PLANET - warpsInLevel;
            if (remaining <= 0) return 'BONUS STAGE!';
            return `${remaining} WARP${remaining > 1 ? 'S' : ''} TO ${getPlanetName()}`;
        }

        function distanceToLineSegment(px, py, x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const len2 = dx * dx + dy * dy;
            if (len2 === 0) return Math.hypot(px - x1, py - y1);
            let t = ((px - x1) * dx + (py - y1) * dy) / len2;
            t = Math.max(0, Math.min(1, t));
            const cx = x1 + t * dx;
            const cy = y1 + t * dy;
            return Math.hypot(px - cx, py - cy);
        }

        // ----- STARFIELD -----
        function initStarfield() {
            stars = [];
            for (let i = 0; i < 120; i++) {
                stars.push({
                    x: randomBetween(-W / 2, W / 2),
                    y: randomBetween(-H / 2, H / 2),
                    z: randomBetween(50, W),
                    speed: randomBetween(2, 6),
                    size: randomBetween(0.5, 2),
                });
            }
        }
        initStarfield();

        // ----- ENEMY WAVE GENERATION -----
        function generateWave() {
            const count = Math.min(6 + Math.floor(warpCount * 0.7), 20);
            totalEnemiesInWave = count;
            enemiesSpawned = 0;
            enemiesDefeated = 0;
            enemies = [];
            enemySpawnQueue = [];
            formationComplete = false;
            waveInProgress = true;
            waveDelay = 0;
            waveProgress = 0;
            satellites = [];
            asteroids = [];
            laserBeams = [];
            enemyBulletSpeed = 2.8 + warpCount * 0.08;

            for (let i = 0; i < count; i++) {
                const spawnAngle = (i / count) * Math.PI * 2 + randomBetween(-0.05, 0.05);
                const formationRadius = 100 + randomBetween(-10, 20) + (i % 3) * 12;
                const type = (i % 5 === 0 && warpCount > 2) ? 'tough' : 'normal';
                const hp = type === 'tough' ? 3 : 1;

                enemySpawnQueue.push({
                    spawnAngle: spawnAngle,
                    formationAngle: spawnAngle,
                    formationRadius: Math.min(formationRadius, TUBE_RADIUS - 40),
                    hp: hp,
                    maxHp: hp,
                    type: type,
                    color: type === 'tough' ? '#ff6b8a' : '#66ddff',
                    alive: true,
                    shootTimer: Math.floor(randomBetween(20, 50)),
                    state: 'spawning',
                    spawnProgress: 0,
                    x: CX,
                    y: CY,
                    angle: spawnAngle,
                    radius: 0,
                    attackTimer: 0,
                    isAttacking: false,
                    attackAngle: 0,
                    attackRadius: 0,
                });
            }

            if (warpCount % 2 === 0 && !isFirstWave) spawnSatellites();
            if (Math.random() < 0.4 && warpCount > 1) spawnAsteroids();
            if (Math.random() < 0.25 && warpCount > 2) spawnLaserBeam();

            playSound('waveStart');
            updateUI();
        }

        // ----- SATELLITES -----
        function spawnSatellites() {
            const count = 3;
            const baseAngle = player.angle + randomBetween(-0.3, 0.3);
            for (let i = 0; i < count; i++) {
                const angle = baseAngle + (i - 1) * 0.15;
                satellites.push({
                    angle: angle,
                    radius: 60 + i * 15,
                    x: 0,
                    y: 0,
                    alive: true,
                    hp: 1,
                    isMiddle: (i === 1),
                    size: 12,
                });
            }
            for (const s of satellites) {
                const pos = angleToPoint(s.angle, s.radius);
                s.x = pos.x;
                s.y = pos.y;
            }
        }

        // ----- ASTEROIDS -----
        function spawnAsteroids() {
            const count = 3 + Math.floor(Math.random() * 3);
            for (let i = 0; i < count; i++) {
                const angle = randomBetween(0, Math.PI * 2);
                asteroids.push({
                    angle: angle,
                    radius: 20 + randomBetween(0, 30),
                    speed: 1 + Math.random() * 1.5,
                    x: 0,
                    y: 0,
                    alive: true,
                    size: 8 + Math.random() * 6,
                    points: 50 + Math.floor(Math.random() * 50),
                });
            }
            for (const a of asteroids) {
                const pos = angleToPoint(a.angle, a.radius);
                a.x = pos.x;
                a.y = pos.y;
            }
        }

        // ----- LASER BEAM -----
        function spawnLaserBeam() {
            const angle1 = randomBetween(0, Math.PI * 2);
            const angle2 = angle1 + Math.PI + randomBetween(-0.2, 0.2);
            const radius = 80 + randomBetween(0, 40);
            const pos1 = angleToPoint(angle1, radius);
            const pos2 = angleToPoint(angle2, radius);
            laserBeams.push({
                x1: pos1.x,
                y1: pos1.y,
                x2: pos2.x,
                y2: pos2.y,
                angle1: angle1,
                angle2: angle2,
                radius: radius,
                alive: true,
                hp: 2,
                maxHp: 2,
                timer: 0,
                active: true,
            });
        }

        // ----- RESET -----
        function resetGame() {
            score = 0;
            lives = 3;
            warpCount = 0;
            warpsInLevel = 0;
            planetIndex = 0;
            gameOver = false;
            hitFlash = 0;
            bonusStage = false;
            bonusTimer = 0;
            isFirstWave = true;
            bonusEnemies = [];
            player.alive = true;
            player.angle = 0;
            player.respawnTimer = 0;
            player.invincibleTimer = 60;
            player.doubleShot = false;
            player.weaponLevel = 1;
            player.x = CX + TUBE_RADIUS;
            player.y = CY;
            bullets = [];
            enemyBullets = [];
            particles = [];
            satellites = [];
            asteroids = [];
            laserBeams = [];
            powerup = null;
            powerupTimer = 0;
            generateWave();
            updateUI();
            startScreen.classList.remove('active');
        }

        function resetWave() {
            player.alive = true;
            player.respawnTimer = 0;
            player.invincibleTimer = 60;
            player.x = CX + TUBE_RADIUS;
            player.y = CY;
            bullets = [];
            enemyBullets = [];
            satellites = [];
            asteroids = [];
            laserBeams = [];
            bonusEnemies = [];
            powerup = null;
            powerupTimer = 0;
            generateWave();
            updateUI();
        }

        function playerHit() {
            if (player.invincibleTimer > 0 || player.respawnTimer > 0) return;
            if (!player.alive) return;

            player.alive = false;
            lives--;
            hitFlash = 30;
            playSound('explosion');
            spawnExplosion(player.x, player.y, '#66ddff', 30);
            updateUI();

            if (lives <= 0) {
                gameOver = true;
                playSound('gameOver');
                startScreen.classList.add('active');
                document.querySelector('#startScreen h1').textContent = '💀 GAME OVER';
                document.querySelector('#startScreen .subtitle').textContent = `Final Score: ${score}`;
                return;
            }

            player.respawnTimer = 90;
            player.doubleShot = false;
            player.weaponLevel = 1;
        }

        function respawnPlayer() {
            player.alive = true;
            player.angle = 0;
            player.x = CX + TUBE_RADIUS;
            player.y = CY;
            player.invincibleTimer = 60;
            enemyBullets = [];
        }

        function updateUI() {
            scoreSpan.textContent = score;
            livesSpan.textContent = lives;
            warpSpan.textContent = getWarpDisplay();
            powerupSpan.textContent = player.weaponLevel >= 2 ? '✦ DOUBLE SHOT' : '';
        }

        // ----- SHOOT -----
        function shoot() {
            if (!player.alive || player.respawnTimer > 0) return;
            if (bullets.length > 30) return;

            const dx = CX - player.x;
            const dy = CY - player.y;
            const len = Math.hypot(dx, dy);
            if (len === 0) return;
            const normX = dx / len;
            const normY = dy / len;

            const spawnDist = 30;
            bullets.push({
                x: player.x + normX * spawnDist,
                y: player.y + normY * spawnDist,
                vx: normX * BULLET_SPEED,
                vy: normY * BULLET_SPEED,
                life: 120,
                radius: 4,
            });

            if (player.weaponLevel >= 2) {
                const offsetAngle = 0.12;
                const cosA = Math.cos(offsetAngle);
                const sinA = Math.sin(offsetAngle);
                const dx2 = dx * cosA - dy * sinA;
                const dy2 = dx * sinA + dy * cosA;
                const len2 = Math.hypot(dx2, dy2);
                const normX2 = dx2 / len2;
                const normY2 = dy2 / len2;
                bullets.push({
                    x: player.x + normX2 * spawnDist,
                    y: player.y + normY2 * spawnDist,
                    vx: normX2 * BULLET_SPEED,
                    vy: normY2 * BULLET_SPEED,
                    life: 120,
                    radius: 4,
                });

                const dx3 = dx * cosA + dy * sinA;
                const dy3 = -dx * sinA + dy * cosA;
                const len3 = Math.hypot(dx3, dy3);
                const normX3 = dx3 / len3;
                const normY3 = dy3 / len3;
                bullets.push({
                    x: player.x + normX3 * spawnDist,
                    y: player.y + normY3 * spawnDist,
                    vx: normX3 * BULLET_SPEED,
                    vy: normY3 * BULLET_SPEED,
                    life: 120,
                    radius: 4,
                });
            }

            playSound('shoot');
        }

        // ----- PARTICLES -----
        function spawnExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = randomBetween(0, Math.PI * 2);
                const speed = randomBetween(1, 5);
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 0.5,
                    life: 25 + randomBetween(0, 20),
                    maxLife: 45,
                    radius: randomBetween(2, 5),
                    color: color || '#ff8844',
                });
            }
        }

        // ----- POWERUP SPAWN -----
        function spawnPowerup() {
            const angle = player.angle + randomBetween(-0.5, 0.5);
            const radius = 80 + randomBetween(0, 30);
            const pos = angleToPoint(angle, radius);
            powerup = {
                x: pos.x,
                y: pos.y,
                angle: angle,
                radius: radius,
                radius2: radius + 30,
                timer: 0,
                alive: true,
                shot: false,
            };
            powerupTimer = 180;
        }

        // ----- UPDATE -----
        function update() {
            if (gameOver) return;

            frameCount++;

            // ---- BONUS STAGE (player can move and shoot) ----
            if (bonusStage) {
                bonusTimer++;
                // Player can move and shoot during bonus stage
                if (player.alive && player.respawnTimer === 0) {
                    if (keys.left) player.angle -= player.speed;
                    if (keys.right) player.angle += player.speed;
                    if (player.angle < 0) player.angle += Math.PI * 2;
                    if (player.angle > Math.PI * 2) player.angle -= Math.PI * 2;
                    player.x = CX + Math.cos(player.angle) * TUBE_RADIUS;
                    player.y = CY + Math.sin(player.angle) * TUBE_RADIUS;
                    if (keys.space) {
                        if (!shoot.lastShot || frameCount - shoot.lastShot > 10) {
                            shoot();
                            shoot.lastShot = frameCount;
                        }
                    }
                }

                // Spawn bonus enemies
                if (bonusTimer % 20 === 0 && bonusTimer < 280) {
                    const angle = randomBetween(0, Math.PI * 2);
                    const radius = 40 + Math.random() * 60;
                    const pos = angleToPoint(angle, radius);
                    bonusEnemies.push({
                        x: pos.x,
                        y: pos.y,
                        angle: angle,
                        radius: radius,
                        speed: 1 + Math.random() * 2,
                        alive: true,
                        points: 50 + Math.floor(Math.random() * 50),
                        size: 8,
                        spin: randomBetween(0, Math.PI * 2),
                    });
                }

                // Update bonus enemies
                for (let i = bonusEnemies.length - 1; i >= 0; i--) {
                    const e = bonusEnemies[i];
                    if (!e.alive) continue;
                    e.angle += 0.02 * e.speed;
                    e.radius += Math.sin(e.spin + bonusTimer * 0.02) * 0.5;
                    const pos = angleToPoint(e.angle, e.radius);
                    e.x = pos.x;
                    e.y = pos.y;
                }

                if (bonusTimer > 300) {
                    bonusStage = false;
                    bonusTimer = 0;
                    warpsInLevel = 0;
                    planetIndex++;
                    isFirstWave = false;
                    bonusEnemies = [];
                    resetWave();
                }
                // Don't return – allow bullet collision with bonus enemies below
            }

            // ---- Player respawn ----
            if (player.respawnTimer > 0) {
                player.respawnTimer--;
                if (player.respawnTimer === 0) {
                    respawnPlayer();
                }
            }

            if (player.invincibleTimer > 0) {
                player.invincibleTimer--;
            }

            // ---- Player movement ----
            if (player.alive && player.respawnTimer === 0) {
                if (keys.left) player.angle -= player.speed;
                if (keys.right) player.angle += player.speed;

                if (player.angle < 0) player.angle += Math.PI * 2;
                if (player.angle > Math.PI * 2) player.angle -= Math.PI * 2;

                player.x = CX + Math.cos(player.angle) * TUBE_RADIUS;
                player.y = CY + Math.sin(player.angle) * TUBE_RADIUS;

                if (keys.space) {
                    if (!shoot.lastShot || frameCount - shoot.lastShot > 10) {
                        shoot();
                        shoot.lastShot = frameCount;
                    }
                }
            }

            if (hitFlash > 0) hitFlash--;

            // ---- Update wave progress ----
            if (totalEnemiesInWave > 0) {
                waveProgress = enemiesSpawned / totalEnemiesInWave;
            }

            // ---- Spawn enemies ----
            if (waveInProgress && enemySpawnQueue.length > 0) {
                waveDelay++;
                const spawnRate = Math.max(6, 14 - Math.floor(warpCount * 0.3));
                if (waveDelay % spawnRate === 0 && enemySpawnQueue.length > 0) {
                    const spawnData = enemySpawnQueue.shift();
                    const enemy = {
                        x: CX,
                        y: CY,
                        angle: spawnData.spawnAngle,
                        formationAngle: spawnData.formationAngle,
                        formationRadius: spawnData.formationRadius,
                        radius: 12,
                        hitRadius: spawnData.type === 'tough' ? 14 : 11,
                        hp: spawnData.hp,
                        maxHp: spawnData.maxHp,
                        type: spawnData.type,
                        color: spawnData.color,
                        alive: true,
                        shootTimer: Math.floor(randomBetween(20, 50) / (1 + warpCount * 0.05)),
                        state: 'spawning',
                        spawnProgress: 0,
                        isAttacking: false,
                        attackTimer: 0,
                        attackAngle: 0,
                        attackRadius: 0,
                        targetX: 0,
                        targetY: 0,
                        size: 0,
                        wobbleOffset: randomBetween(0, Math.PI * 2),
                        moveSpeed: 0.8 + Math.random() * 0.4 + warpCount * 0.02,
                        orbitSpeed: 0.002 + Math.random() * 0.002,
                        orbitRadius: 0,
                        orbitAngle: 0,
                    };
                    enemies.push(enemy);
                    enemiesSpawned++;
                }
            }

            // ---- Update enemies ----
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (!e.alive) {
                    enemies.splice(i, 1);
                    continue;
                }

                const waveSpeed = 1 + waveProgress * 0.4;

                // Spawning
                if (e.state === 'spawning') {
                    e.spawnProgress += 0.025 * waveSpeed;
                    if (e.spawnProgress >= 1) {
                        e.spawnProgress = 1;
                        e.state = 'forming';
                        const pos = angleToPoint(e.formationAngle, e.formationRadius);
                        e.x = pos.x;
                        e.y = pos.y;
                        e.angle = e.formationAngle;
                        e.radius = e.formationRadius;
                        e.size = 14;
                        e.orbitAngle = e.formationAngle;
                        e.orbitRadius = e.formationRadius;
                    } else {
                        const progress = e.spawnProgress;
                        const currentRadius = progress * e.formationRadius + 20;
                        const currentAngle = e.formationAngle + progress * 0.3;
                        const pos = angleToPoint(currentAngle, currentRadius);
                        e.x = pos.x;
                        e.y = pos.y;
                        e.angle = currentAngle;
                        e.radius = currentRadius;
                        e.size = 4 + progress * 10;
                    }
                    continue;
                }

                // ---- ENEMIES ORBIT ----
                if (e.state === 'forming' || e.state === 'active') {
                    e.orbitAngle += e.orbitSpeed * waveSpeed;
                    e.orbitRadius = e.formationRadius + Math.sin(e.wobbleOffset) * 5;

                    const orbitPos = angleToPoint(e.orbitAngle, e.orbitRadius);
                    e.x = orbitPos.x;
                    e.y = orbitPos.y;
                    e.angle = e.orbitAngle;
                    e.radius = e.orbitRadius;
                    e.size = 14;
                    e.wobbleOffset += 0.02;

                    if (e.state === 'forming') {
                        const targetX = CX + Math.cos(e.formationAngle) * e.formationRadius;
                        const targetY = CY + Math.sin(e.formationAngle) * e.formationRadius;
                        e.x += (targetX - e.x) * 0.01;
                        e.y += (targetY - e.y) * 0.01;
                        if (Math.abs(e.x - targetX) < 2 && Math.abs(e.y - targetY) < 2) {
                            e.state = 'active';
                        }
                    }
                }

                // ---- Active state ----
                if (e.state === 'active') {
                    e.attackTimer--;
                    if (e.attackTimer <= 0 && !e.isAttacking) {
                        const attackChance = 0.008 + warpCount * 0.002 + waveProgress * 0.005;
                        if (Math.random() < attackChance) {
                            const attackCount = Math.min(1 + Math.floor(warpCount / 3), 3);
                            const attackers = enemies.filter(en => en.alive && !en.isAttacking && en.state === 'active' && en !== e);
                            const selected = [e];
                            for (let a = 0; a < Math.min(attackCount - 1, attackers.length); a++) {
                                const idx = Math.floor(Math.random() * attackers.length);
                                selected.push(attackers[idx]);
                                attackers.splice(idx, 1);
                            }
                            for (const attacker of selected) {
                                attacker.isAttacking = true;
                                attacker.attackTimer = 0;
                                const targetAngle = Math.atan2(player.y - CY, player.x - CX);
                                attacker.attackAngle = targetAngle + randomBetween(-0.3, 0.3);
                                attacker.targetX = player.x;
                                attacker.targetY = player.y;
                            }
                        } else {
                            e.attackTimer = Math.floor(randomBetween(40, 90) / (1 + warpCount * 0.03));
                        }
                    }

                    if (e.isAttacking) {
                        e.attackTimer++;
                        const attackDuration = Math.max(20, 45 - warpCount);
                        const progress = Math.min(e.attackTimer / attackDuration, 1);

                        const startRadius = e.orbitRadius || e.formationRadius;
                        const endRadius = TUBE_RADIUS + 10;
                        const currentRadius = lerp(startRadius, endRadius, progress * 1.1);
                        const currentAngle = e.attackAngle + Math.sin(progress * Math.PI * 1.5) * 0.2;
                        const pos2 = angleToPoint(currentAngle, currentRadius);
                        e.x = pos2.x;
                        e.y = pos2.y;

                        if (progress > 0.15 && progress < 0.55 && e.attackTimer % 8 === 0) {
                            const angleToPlayer = Math.atan2(player.y - e.y, player.x - e.x);
                            enemyBullets.push({
                                x: e.x + Math.cos(angleToPlayer) * 10,
                                y: e.y + Math.sin(angleToPlayer) * 10,
                                vx: Math.cos(angleToPlayer) * enemyBulletSpeed,
                                vy: Math.sin(angleToPlayer) * enemyBulletSpeed,
                                radius: 5,
                                life: 120,
                            });
                            playSound('enemyShoot');
                        }

                        if (progress >= 1) {
                            e.isAttacking = false;
                            e.attackTimer = 0;
                            e.state = 'forming';
                        }
                        continue;
                    }

                    e.shootTimer--;
                    if (e.shootTimer <= 0 && player.alive) {
                        const angleToPlayer = Math.atan2(player.y - e.y, player.x - e.x);
                        enemyBullets.push({
                            x: e.x + Math.cos(angleToPlayer) * 10,
                            y: e.y + Math.sin(angleToPlayer) * 10,
                            vx: Math.cos(angleToPlayer) * enemyBulletSpeed,
                            vy: Math.sin(angleToPlayer) * enemyBulletSpeed,
                            radius: 5,
                            life: 120,
                        });
                        e.shootTimer = Math.floor(randomBetween(20, 50) / (1 + warpCount * 0.04));
                        playSound('enemyShoot');
                    }

                    if (player.alive && player.respawnTimer === 0 && player.invincibleTimer === 0) {
                        if (dist(player, e) < player.radius + e.hitRadius) {
                            e.alive = false;
                            playerHit();
                            spawnExplosion(e.x, e.y, e.color, 25);
                            enemies.splice(i, 1);
                            if (gameOver) return;
                            continue;
                        }
                    }
                }
            }

            // ---- Update satellites ----
            for (let i = satellites.length - 1; i >= 0; i--) {
                const s = satellites[i];
                if (!s.alive) continue;

                s.angle += 0.015;
                const pos = angleToPoint(s.angle, s.radius);
                s.x = pos.x;
                s.y = pos.y;

                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    if (dist(b, s) < s.size + b.radius) {
                        s.hp--;
                        bullets.splice(j, 1);
                        if (s.hp <= 0) {
                            s.alive = false;
                            spawnExplosion(s.x, s.y, '#ffdd44', 20);
                            if (s.isMiddle) {
                                player.weaponLevel = 2;
                                player.doubleShot = true;
                                score += 100;
                                playSound('rescue');
                                updateUI();
                            } else {
                                score += 30;
                                updateUI();
                            }
                            satellites.splice(i, 1);
                        }
                        break;
                    }
                }

                if (player.alive && player.respawnTimer === 0 && player.invincibleTimer === 0) {
                    if (dist(player, s) < player.radius + s.size) {
                        s.alive = false;
                        playerHit();
                        spawnExplosion(s.x, s.y, '#ffdd44', 20);
                        satellites.splice(i, 1);
                        if (gameOver) return;
                    }
                }
            }

            // ---- Update asteroids ----
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const a = asteroids[i];
                if (!a.alive) continue;

                a.radius += a.speed * (1 + waveProgress * 0.2);
                const pos = angleToPoint(a.angle, a.radius);
                a.x = pos.x;
                a.y = pos.y;

                if (a.radius > TUBE_RADIUS + 50) {
                    a.alive = false;
                    asteroids.splice(i, 1);
                    continue;
                }

                let hit = false;
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    if (dist(b, a) < a.size + b.radius) {
                        bullets.splice(j, 1);
                        if (!hit) {
                            hit = true;
                            a.alive = false;
                            score += a.points;
                            spawnExplosion(a.x, a.y, '#ff8844', 15);
                            playSound('explosion');
                            asteroids.splice(i, 1);
                            updateUI();
                        }
                        break;
                    }
                }

                if (a.alive && player.alive && player.respawnTimer === 0 && player.invincibleTimer === 0) {
                    if (dist(player, a) < player.radius + a.size) {
                        a.alive = false;
                        playerHit();
                        spawnExplosion(a.x, a.y, '#ff8844', 20);
                        asteroids.splice(i, 1);
                        if (gameOver) return;
                    }
                }
            }

            // ---- Update laser beams ----
            for (let i = laserBeams.length - 1; i >= 0; i--) {
                const lb = laserBeams[i];
                if (!lb.alive) continue;

                lb.timer++;
                const beamWidth = 2 + Math.sin(lb.timer * 0.05) * 1;

                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    const d1 = dist(b, { x: lb.x1, y: lb.y1 });
                    const d2 = dist(b, { x: lb.x2, y: lb.y2 });
                    if (d1 < 12 + b.radius || d2 < 12 + b.radius) {
                        bullets.splice(j, 1);
                        lb.hp--;
                        if (lb.hp <= 0) {
                            lb.alive = false;
                            spawnExplosion(lb.x1, lb.y1, '#ff44ff', 20);
                            spawnExplosion(lb.x2, lb.y2, '#ff44ff', 20);
                            score += 200;
                            playSound('explosion');
                            laserBeams.splice(i, 1);
                            updateUI();
                        }
                        break;
                    }
                }

                if (player.alive && player.respawnTimer === 0 && player.invincibleTimer === 0) {
                    const d = distanceToLineSegment(player.x, player.y, lb.x1, lb.y1, lb.x2, lb.y2);
                    if (d < 10) {
                        playerHit();
                        if (gameOver) return;
                    }
                }
            }

            // ---- Check wave completion ----
            if (waveInProgress && enemySpawnQueue.length === 0) {
                const aliveEnemies = enemies.filter(e => e.alive);
                if (aliveEnemies.length === 0 && satellites.length === 0) {
                    waveInProgress = false;
                    warpsInLevel++;

                    if (warpsInLevel >= WARPS_PER_PLANET) {
                        bonusStage = true;
                        bonusTimer = 0;
                        playSound('bonus');
                        spawnExplosion(CX, CY, '#ffdd44', 50);
                        updateUI();
                    } else {
                        warpCount++;
                        updateUI();
                        setTimeout(() => {
                            if (!gameOver) resetWave();
                        }, 1500);
                    }
                }
            }

            // ---- Player bullets ----
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life--;

                // ---- BULLETS DISAPPEAR IN CENTER (NO EXPLOSION) ----
                const distToCenter = Math.hypot(b.x - CX, b.y - CY);
                if (distToCenter < 30) {
                    bullets.splice(i, 1); // Just disappear
                    continue;
                }

                if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
                    bullets.splice(i, 1);
                    continue;
                }

                let bulletUsed = false;

                // ---- Check bonus enemy collision (BONUS STAGE) ----
                if (bonusStage) {
                    for (let j = bonusEnemies.length - 1; j >= 0; j--) {
                        const e = bonusEnemies[j];
                        if (!e.alive) continue;
                        if (dist(b, e) < e.size + b.radius) {
                            e.alive = false;
                            bullets.splice(i, 1);
                            score += e.points;
                            spawnExplosion(e.x, e.y, '#ffdd44', 15);
                            playSound('explosion');
                            updateUI();
                            bonusEnemies.splice(j, 1);
                            bulletUsed = true;
                            break;
                        }
                    }
                    if (bulletUsed) continue;
                }

                // ---- Check enemy collision ----
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (!e.alive) continue;
                    if (dist(b, e) < e.hitRadius + b.radius) {
                        e.hp--;
                        if (e.hp <= 0) {
                            e.alive = false;
                            const points = e.type === 'tough' ? 30 : 15;
                            score += points + warpCount * 2;
                            spawnExplosion(e.x, e.y, e.color, 25);
                            playSound('explosion');
                            enemies.splice(j, 1);
                            enemiesDefeated++;
                            updateUI();
                        } else {
                            spawnExplosion(b.x, b.y, '#88ddff', 5);
                        }
                        bulletUsed = true;
                        break;
                    }
                }

                if (!bulletUsed && powerup && powerup.alive) {
                    if (dist(b, powerup) < 20) {
                        powerup.alive = false;
                        bulletUsed = true;
                        player.weaponLevel = 2;
                        player.doubleShot = true;
                        spawnExplosion(powerup.x, powerup.y, '#ffdd44', 30);
                        score += 50;
                        updateUI();
                        playSound('rescue');
                    }
                }

                if (bulletUsed) {
                    bullets.splice(i, 1);
                }
            }

            // ---- Enemy bullets ----
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life--;

                if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                if (player.alive && player.respawnTimer === 0 && player.invincibleTimer === 0) {
                    if (dist(player, b) < player.radius + b.radius) {
                        enemyBullets.splice(i, 1);
                        playerHit();
                        if (gameOver) return;
                        break;
                    }
                }
            }

            // ---- Powerup ----
            if (powerup && powerup.alive) {
                powerupTimer--;
                if (powerupTimer <= 0) {
                    powerup.alive = false;
                    powerup = null;
                }
            }
            if (powerup && powerup.alive) {
                powerup.angle += 0.02;
                const pos1 = angleToPoint(powerup.angle, powerup.radius);
                const pos2 = angleToPoint(powerup.angle + 0.4, powerup.radius2);
                const pos3 = angleToPoint(powerup.angle - 0.4, powerup.radius2);
                powerup.x = pos1.x;
                powerup.y = pos1.y;
                powerup.x2 = pos2.x;
                powerup.y2 = pos2.y;
                powerup.x3 = pos3.x;
                powerup.y3 = pos3.y;
            }

            // ---- Spawn powerup ----
            if (!powerup && waveInProgress && enemySpawnQueue.length === 0 && enemies.length > 0 && !formationComplete) {
                const activeEnemies = enemies.filter(e => e.state === 'active');
                if (activeEnemies.length > 3 && Math.random() < 0.0005) {
                    formationComplete = true;
                    spawnPowerup();
                }
            }

            // ---- Particles ----
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.03;
                p.life--;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // ---- Stars ----
            for (const s of stars) {
                s.z -= s.speed;
                if (s.z <= 0) {
                    s.z = randomBetween(100, W);
                    s.x = randomBetween(-W / 2, W / 2);
                    s.y = randomBetween(-H / 2, H / 2);
                }
            }
        }

        // ----- DRAW -----
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Background
            const grad = ctx.createRadialGradient(CX, CY, 10, CX, CY, TUBE_RADIUS + 50);
            grad.addColorStop(0, '#0a0a18');
            grad.addColorStop(0.5, '#0d0a22');
            grad.addColorStop(1, '#0a0515');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // Tunnel rings
            const ringCount = 14;
            for (let i = 0; i < ringCount; i++) {
                const progress = i / ringCount;
                const radius = 20 + (TUBE_RADIUS - 20) * progress;
                const alpha = 0.02 + 0.10 * (1 - progress);

                ctx.strokeStyle = `rgba(80, 130, 255, ${alpha})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(CX, CY, radius, 0, Math.PI * 2);
                ctx.stroke();

                const dotCount = Math.floor(radius / 12);
                for (let d = 0; d < dotCount; d++) {
                    const angle = (d / dotCount) * Math.PI * 2 + frameCount * 0.002 * (1 - progress);
                    const dx = CX + Math.cos(angle) * radius;
                    const dy = CY + Math.sin(angle) * radius;
                    ctx.fillStyle = `rgba(150, 200, 255, ${alpha * 0.6})`;
                    ctx.beginPath();
                    ctx.arc(dx, dy, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Main tube ring
            ctx.strokeStyle = 'rgba(60, 120, 255, 0.25)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(CX, CY, TUBE_RADIUS, 0, Math.PI * 2);
            ctx.stroke();

            // Stars (perspective)
            for (const s of stars) {
                const scale = 1 - s.z / (W + 50);
                const sx = CX + s.x * scale * 1.5;
                const sy = CY + s.y * scale * 1.5;
                if (sx > 0 && sx < W && sy > 0 && sy < H) {
                    const alpha = 0.3 + 0.7 * scale;
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.5})`;
                    const size = s.size * (0.3 + 0.7 * scale);
                    ctx.beginPath();
                    ctx.arc(sx, sy, Math.max(0.3, size), 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Tunnel glow
            const glowGrad = ctx.createRadialGradient(CX, CY, 10, CX, CY, TUBE_RADIUS + 20);
            glowGrad.addColorStop(0, 'rgba(20, 30, 80, 0)');
            glowGrad.addColorStop(0.6, 'rgba(40, 60, 120, 0)');
            glowGrad.addColorStop(0.85, 'rgba(60, 100, 200, 0.02)');
            glowGrad.addColorStop(1, 'rgba(100, 150, 255, 0.06)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(CX, CY, TUBE_RADIUS + 20, 0, Math.PI * 2);
            ctx.fill();

            // ---- Laser beams ----
            for (const lb of laserBeams) {
                if (!lb.alive) continue;
                const pulse = 2 + Math.sin(lb.timer * 0.05) * 1;
                ctx.shadowColor = '#ff44ff';
                ctx.shadowBlur = 20;
                ctx.strokeStyle = '#ff44ff';
                ctx.lineWidth = pulse;
                ctx.beginPath();
                ctx.moveTo(lb.x1, lb.y1);
                ctx.lineTo(lb.x2, lb.y2);
                ctx.stroke();
                ctx.shadowBlur = 0;

                for (const pos of [{ x: lb.x1, y: lb.y1 }, { x: lb.x2, y: lb.y2 }]) {
                    ctx.fillStyle = '#ff44ff';
                    ctx.shadowColor = '#ff44ff';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '8px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(lb.hp, pos.x, pos.y + 3);
                }
            }

            // ---- Satellites ----
            for (const s of satellites) {
                if (!s.alive) continue;
                const size = s.isMiddle ? 14 : 10;
                ctx.shadowColor = '#ffdd44';
                ctx.shadowBlur = s.isMiddle ? 25 : 15;
                ctx.fillStyle = s.isMiddle ? '#ffdd44' : '#ffcc88';
                ctx.beginPath();
                ctx.arc(s.x, s.y, size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                if (s.isMiddle) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '10px monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('★', s.x, s.y + 1);
                }
            }

            // ---- Asteroids ----
            for (const a of asteroids) {
                if (!a.alive) continue;
                ctx.shadowColor = '#ff8844';
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#885533';
                ctx.beginPath();
                const points = 6;
                for (let i = 0; i < points; i++) {
                    const angle = (i / points) * Math.PI * 2 + a.angle;
                    const r = a.size * (0.7 + 0.3 * Math.sin(i * 2 + a.angle));
                    if (i === 0) ctx.moveTo(a.x + Math.cos(angle) * r, a.y + Math.sin(angle) * r);
                    else ctx.lineTo(a.x + Math.cos(angle) * r, a.y + Math.sin(angle) * r);
                }
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // ---- Bonus enemies ----
            for (const e of bonusEnemies) {
                if (!e.alive) continue;
                ctx.shadowColor = '#ffdd44';
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#ffdd44';
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.font = '8px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(e.points, e.x, e.y + 3);
            }

            // ---- Powerup ----
            if (powerup && powerup.alive) {
                const pulse = Math.sin(frameCount * 0.05) * 3 + 8;
                ctx.shadowColor = '#ffdd44';
                ctx.shadowBlur = 20;

                const positions = [
                    { x: powerup.x, y: powerup.y },
                    { x: powerup.x2 || powerup.x + 20, y: powerup.y2 || powerup.y - 10 },
                    { x: powerup.x3 || powerup.x - 20, y: powerup.y3 || powerup.y - 10 },
                ];
                for (const pos of positions) {
                    ctx.fillStyle = '#ffdd44';
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, pulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255, 200, 50, 0.2)';
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, pulse + 10, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'rgba(255, 220, 100, 0.5)';
                ctx.font = '9px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('★ POWER', powerup.x, powerup.y + 26);
            }

            // ---- Enemies (OUTWARD FACING) ----
            for (const e of enemies) {
                if (!e.alive) continue;

                const radius = e.type === 'tough' ? 14 : 11;
                const size = e.size || radius;

                ctx.shadowColor = e.color;
                ctx.shadowBlur = 20;

                // Face OUTWARD: point away from center
                const angleToCenter = Math.atan2(e.y - CY, e.x - CX);
                ctx.fillStyle = e.color;
                ctx.save();
                ctx.translate(e.x, e.y);
                // angleToCenter + PI = point AWAY from center
                ctx.rotate(angleToCenter + Math.PI);

                // Triangle pointing outward (tip at top of triangle)
                ctx.beginPath();
                ctx.moveTo(0, -size);
                ctx.lineTo(-size * 0.7, size * 0.6);
                ctx.lineTo(0, size * 0.25);
                ctx.lineTo(size * 0.7, size * 0.6);
                ctx.closePath();
                ctx.fill();

                // Inner highlight
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.moveTo(0, -size * 0.5);
                ctx.lineTo(-size * 0.35, size * 0.15);
                ctx.lineTo(0, size * 0.05);
                ctx.lineTo(size * 0.35, size * 0.15);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
                ctx.shadowBlur = 0;

                if (e.type === 'tough' && e.hp > 1) {
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(e.x - 10, e.y - radius - 8, 20, 3);
                    ctx.fillStyle = '#ff6b8a';
                    ctx.fillRect(e.x - 10, e.y - radius - 8, (e.hp / e.maxHp) * 20, 3);
                }
                ctx.shadowBlur = 0;
            }

            // ---- Player (faces inward) ----
            if (player.alive && player.respawnTimer === 0) {
                if (player.invincibleTimer === 0 || Math.floor(frameCount / 6) % 2 === 0) {
                    const dx = CX - player.x;
                    const dy = CY - player.y;
                    const angle = Math.atan2(dy, dx);

                    ctx.shadowColor = '#66ddff';
                    ctx.shadowBlur = 30;

                    ctx.fillStyle = '#66ddff';
                    ctx.save();
                    ctx.translate(player.x, player.y);
                    ctx.rotate(angle);

                    // Ship points toward center (inward)
                    ctx.beginPath();
                    ctx.moveTo(16, 0);
                    ctx.lineTo(-8, -10);
                    ctx.lineTo(-4, 0);
                    ctx.lineTo(-8, 10);
                    ctx.closePath();
                    ctx.fill();

                    // Cockpit glow
                    ctx.fillStyle = 'rgba(100, 200, 255, 0.4)';
                    ctx.beginPath();
                    ctx.arc(6, 0, 5, 0, Math.PI * 2);
                    ctx.fill();

                    // Engine glow
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(100, 200, 255, 0.15)';
                    ctx.beginPath();
                    ctx.arc(-10, 0, 7, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();

                    // Outer glow ring
                    ctx.shadowColor = '#66ddff';
                    ctx.shadowBlur = 40;
                    ctx.fillStyle = 'rgba(100, 200, 255, 0.05)';
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, 22, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    if (player.weaponLevel >= 2) {
                        ctx.fillStyle = 'rgba(255, 220, 100, 0.7)';
                        ctx.font = '12px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        ctx.fillText('✦', player.x, player.y - 22);
                    }
                }
            }

            // ---- Bullets ----
            for (const b of bullets) {
                ctx.shadowColor = '#66ffcc';
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#66ffcc';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // ---- Enemy bullets ----
            for (const b of enemyBullets) {
                ctx.shadowColor = '#ff5e7a';
                ctx.shadowBlur = 12;
                ctx.fillStyle = '#ff5e7a';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // ---- Particles ----
            for (const p of particles) {
                const alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                const size = p.radius * alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(0.5, size), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            // ---- Hit flash ----
            if (hitFlash > 0) {
                ctx.fillStyle = `rgba(255, 0, 0, ${hitFlash / 30 * 0.2})`;
                ctx.fillRect(0, 0, W, H);
            }

            // ---- Wave announcement ----
            if (waveInProgress && waveDelay < 60 && enemies.length === 0) {
                ctx.fillStyle = `rgba(100, 200, 255, ${1 - waveDelay / 60})`;
                ctx.font = 'bold 36px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(100, 200, 255, 0.3)';
                ctx.shadowBlur = 30;
                ctx.fillText(`WARP ${warpCount + 1}`, W / 2, H / 2 - 20);
                ctx.shadowBlur = 0;
            }

            // ---- Bonus stage ----
            if (bonusStage) {
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(0, 0, W, 40);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffdd44';
                ctx.font = 'bold 24px sans-serif';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ffaa00';
                ctx.fillText(`🌟 ${getPlanetName()} BONUS! 🌟`, W / 2, 20);
                ctx.shadowBlur = 0;
            }

            // ---- HUD ----
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            ctx.font = '11px monospace';
            ctx.fillText(`ENEMIES: ${enemies.filter(e => e.alive).length}`, 14, 12);
            if (player.weaponLevel >= 2) {
                ctx.fillStyle = 'rgba(255, 220, 100, 0.15)';
                ctx.fillText('★ DOUBLE SHOT', 14, 26);
            }
        }

        // ----- GAME LOOP -----
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ----- EVENT LISTENERS -----
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === 'ArrowLeft') { keys.left = true;
                e.preventDefault(); }
            if (key === 'ArrowRight') { keys.right = true;
                e.preventDefault(); }
            if (key === ' ') { keys.space = true;
                e.preventDefault(); }
            if ((key === 'r' || key === 'R') && gameOver) {
                resetGame();
                e.preventDefault();
            }
            initAudio();
            if (startScreen.classList.contains('active') && key !== 'r' && key !== 'R') {
                if (document.querySelector('#startScreen h1').textContent !== '💀 GAME OVER') {
                    startScreen.classList.remove('active');
                    resetGame();
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key;
            if (key === 'ArrowLeft') { keys.left = false;
                e.preventDefault(); }
            if (key === 'ArrowRight') { keys.right = false;
                e.preventDefault(); }
            if (key === ' ') { keys.space = false;
                e.preventDefault(); }
        });

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });

        // ---- START BUTTON ----
        startBtn.addEventListener('click', () => {
            initAudio();
            document.querySelector('#startScreen h1').textContent = 'GYRUSS';
            document.querySelector('#startScreen .subtitle').textContent = '⚡ 3 WARPS TO NEPTUNE ⚡';
            startScreen.classList.remove('active');
            resetGame();
        });

        // ----- START -----
        resetGame();
        gameLoop();
    </script>
</body>
</html>
