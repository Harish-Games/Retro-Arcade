<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yahtzee vs AI - Career Stats Edition</title>
    <style>
        :root {
            --bg-color: #121218;
            --card-bg: #1e1e2a;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --ai-accent: #ec4899;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2d3748;
            --die-bg: #ffffff;
            --die-dot: #111827;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 24px;
            max-width: 1100px;
            width: 100%;
        }

        @media (max-width: 880px) {
            .game-container {
                grid-template-columns: 1fr;
            }
        }

        .play-area {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* --- Running Total Bar --- */
        .running-total-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .total-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .total-box .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .total-box .val {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .total-box.user .val { color: var(--accent-color); }
        .total-box.ai .val { color: var(--ai-accent); }

        .status-bar {
            width: 100%;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            min-height: 2rem;
            color: #e0e7ff;
        }

        .ai-intent-box {
            width: 100%;
            min-height: 48px;
            background: rgba(236, 72, 153, 0.08);
            border: 1px solid rgba(236, 72, 153, 0.25);
            border-radius: 10px;
            padding: 10px 16px;
            margin-bottom: 24px;
            text-align: center;
            font-size: 0.92rem;
            color: #f472b6;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ai-intent-box.active {
            box-shadow: 0 0 16px rgba(236, 72, 153, 0.25);
            background: rgba(236, 72, 153, 0.15);
        }

        .dice-container {
            display: flex;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* --- Dice Styling --- */
        .die {
            width: 68px;
            height: 68px;
            background-color: var(--die-bg);
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 8px;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
            border: 4px solid transparent;
            outline: none;
        }

        .die:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        .die .pip {
            background-color: var(--die-dot);
            border-radius: 50%;
            align-self: center;
            justify-self: center;
            width: 10px;
            height: 10px;
            visibility: hidden;
        }

        .die:hover:not(.disabled) {
            transform: translateY(-3px);
        }

        .die.held {
            border-color: var(--accent-color);
            background-color: #e0e7ff;
            transform: translateY(-5px);
            box-shadow: 0 10px 16px -2px rgba(99, 102, 241, 0.45);
        }

        .die.ai-held {
            border-color: var(--ai-accent);
            background-color: #fce7f3;
            transform: translateY(-5px);
            box-shadow: 0 10px 16px -2px rgba(236, 72, 153, 0.45);
        }

        .die.disabled {
            cursor: not-allowed;
            opacity: 0.85;
        }

        .die.rolling {
            animation: shake 0.22s ease-in-out infinite;
        }

        @keyframes shake {
            0% { transform: rotate(0deg) scale(0.98); }
            25% { transform: rotate(6deg) scale(1.02); }
            75% { transform: rotate(-6deg) scale(0.98); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .controls {
            display: flex;
            gap: 14px;
            margin-bottom: 24px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        button:hover:not(:disabled) {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
            opacity: 0.5;
            box-shadow: none;
        }

        /* --- Career Stats Panel --- */
        .stats-panel {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 700;
        }

        .reset-stats-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            font-size: 0.75rem;
            padding: 0;
            cursor: pointer;
            box-shadow: none;
            text-decoration: underline;
        }
        .reset-stats-btn:hover { background: transparent; transform: none; color: #f87171; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            text-align: center;
        }

        .stat-item .s-label {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .stat-item .s-val {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }

        /* --- Scorecard --- */
        .score-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .score-table {
            width: 100%;
            border-collapse: collapse;
        }

        .score-table th, .score-table td {
            padding: 9px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .score-table th {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        .score-table td.num {
            text-align: right;
            font-weight: 600;
            width: 55px;
        }

        .score-row.selectable {
            cursor: pointer;
        }

        .score-row.selectable:hover td {
            background-color: rgba(99, 102, 241, 0.18);
        }

        .score-row.filled td.num {
            color: var(--text-color);
        }

        .score-row.potential td.num {
            color: #a5b4fc;
            opacity: 0.85;
        }

        .section-header td {
            background-color: rgba(255, 255, 255, 0.03);
            font-weight: 700;
            color: var(--accent-color);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .total-row td {
            font-weight: 700;
            border-top: 2px solid var(--border-color);
            color: #ffffff;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="play-area">
        <!-- Running Total Bar -->
        <div class="running-total-bar">
            <div class="total-box user">
                <span class="label">Your Score</span>
                <span class="val" id="user-running-total">0</span>
            </div>
            <div class="total-box ai">
                <span class="label">AI Score</span>
                <span class="val" id="ai-running-total">0</span>
            </div>
        </div>

        <div class="status-bar" id="status-text" aria-live="polite">Your turn! Roll the dice.</div>
        
        <div class="ai-intent-box" id="ai-intent" aria-live="polite">AI will display tactical decisions here.</div>

        <div class="dice-container" id="dice-container">
            <div class="die" data-index="0" tabindex="0" role="button" aria-label="Die 1">
                <div class="pip"></div><div class="pip"></div><div class="pip"></div>
                <div class="pip"></div><div class="pip"></div><div class="pip"></div>
                <div class="pip"></div><div class="pip"></div><div class="pip"></div>
            </div>
            <div class="die" data-index="1" tabindex="0" role="button" aria-label="Die 2">
                <div class="pip"></div><div class="pip"></div><div class="pip"></div>
                <div class="pip"></div><div class="pip"></div><div class="pip"></div>
                <div class="pip"></div><div class="pip"></div><div class="pip"></div>
            </div>
            <div class="die" data-index="2" tabindex="0" role="button" aria-label="Die 3">
                <div class="pip"></div><div class="pip"></div><div class="pip"></div>
                <div class="pip"></div><div class="pip"></div><div class="pip"></div>
                <div class="pip"></div><div class="pip"></div><div class="pip"></div>
            </div>
            <div class="die" data-index="3" tabindex="0" role="button" aria-label="Die 4">
                <div class="pip"></div><div class="pip"></div><div class="pip"></div>
                <div class="pip"></div><div class="pip"></div><div class="pip"></div>
                <div class="pip"></div><div class="pip"></div><div class="pip"></div>
            </div>
            <div class="die" data-index="4" tabindex="0" role="button" aria-label="Die 5">
                <div class="pip"></div><div class="pip"></div><div class="pip"></div>
                <div class="pip"></div><div class="pip"></div><div class="pip"></div>
                <div class="pip"></div><div class="pip"></div><div class="pip"></div>
            </div>
        </div>

        <div class="controls">
            <button id="roll-btn">Roll Dice (3 left)</button>
            <button id="restart-btn" style="background-color: #2d3748;">New Game</button>
        </div>

        <!-- Career Statistics Panel -->
        <div class="stats-panel">
            <div class="stats-header">
                <span>Career Statistics</span>
                <button class="reset-stats-btn" id="reset-stats-btn">Reset</button>
            </div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="s-label">Played</div>
                    <div class="s-val" id="stat-played">0</div>
                </div>
                <div class="stat-item">
                    <div class="s-label">Record (W-L)</div>
                    <div class="s-val" id="stat-record">0-0</div>
                </div>
                <div class="stat-item">
                    <div class="s-label">High Score</div>
                    <div class="s-val" id="stat-highscore">0</div>
                </div>
                <div class="stat-item">
                    <div class="s-label">Yahtzees</div>
                    <div class="s-val" id="stat-yahtzees">0</div>
                </div>
            </div>
        </div>
    </div>

    <div class="score-card">
        <table class="score-table">
            <thead>
                <tr>
                    <th>Categories</th>
                    <th style="text-align:right">You</th>
                    <th style="text-align:right">AI</th>
                </tr>
            </thead>
            <tbody id="score-body">
                <!-- Dynamic Content -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // --- Sound Synthesis Engine ---
    class SoundEffects {
        constructor() { this.ctx = null; }

        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }

        playRoll() {
            this.init();
            const now = this.ctx.currentTime;
            for (let i = 0; i < 4; i++) {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(120 + Math.random() * 200, now + i * 0.04);
                gain.gain.setValueAtTime(0.06, now + i * 0.04);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.04 + 0.03);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now + i * 0.04);
                osc.stop(now + i * 0.04 + 0.03);
            }
        }

        playHold(isHeld) {
            this.init();
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(isHeld ? 440 : 330, now);
            osc.frequency.exponentialRampToValueAtTime(isHeld ? 660 : 220, now + 0.08);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.08);
        }

        playScore() {
            this.init();
            const now = this.ctx.currentTime;
            const notes = [523.25, 659.25, 783.99];
            notes.forEach((freq, idx) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + idx * 0.06);
                gain.gain.setValueAtTime(0.1, now + idx * 0.06);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now + idx * 0.06);
                osc.stop(now + idx * 0.06 + 0.12);
            });
        }

        playGameOver() {
            this.init();
            const now = this.ctx.currentTime;
            const notes = [440, 554.37, 659.25, 880];
            notes.forEach((freq, idx) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                gain.gain.setValueAtTime(0.12, now + idx * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now + idx * 0.1);
                osc.stop(now + idx * 0.1 + 0.25);
            });
        }
    }

    const sound = new SoundEffects();

    // --- Categories ---
    const CATEGORIES = [
        { id: 'ones', name: 'Ones', section: 'upper' },
        { id: 'twos', name: 'Twos', section: 'upper' },
        { id: 'threes', name: 'Threes', section: 'upper' },
        { id: 'fours', name: 'Fours', section: 'upper' },
        { id: 'fives', name: 'Fives', section: 'upper' },
        { id: 'sixes', name: 'Sixes', section: 'upper' },
        { id: 'threeKind', name: '3 of a Kind', section: 'lower' },
        { id: 'fourKind', name: '4 of a Kind', section: 'lower' },
        { id: 'fullHouse', name: 'Full House', section: 'lower' },
        { id: 'smallStr', name: 'Sm. Straight', section: 'lower' },
        { id: 'largeStr', name: 'Lg. Straight', section: 'lower' },
        { id: 'yahtzee', name: 'Yahtzee', section: 'lower' },
        { id: 'chance', name: 'Chance', section: 'lower' }
    ];

    const PIP_MAPS = {
        0: [], 1: [4], 2: [0, 8], 3: [0, 4, 8],
        4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8]
    };

    let dice = [1, 1, 1, 1, 1];
    let held = [false, false, false, false, false];
    let rollsLeft = 3;
    let currentPlayer = 'user';
    let isGameOver = false;

    let scores = { user: {}, ai: {} };

    // --- LocalStorage Career Stats ---
    let stats = {
        played: 0,
        wins: 0,
        losses: 0,
        highScore: 0,
        yahtzees: 0
    };

    const diceElements = document.querySelectorAll('.die');
    const rollBtn = document.getElementById('roll-btn');
    const restartBtn = document.getElementById('restart-btn');
    const resetStatsBtn = document.getElementById('reset-stats-btn');
    const statusText = document.getElementById('status-text');
    const aiIntentBox = document.getElementById('ai-intent');
    const scoreBody = document.getElementById('score-body');
    const userRunningTotalEl = document.getElementById('user-running-total');
    const aiRunningTotalEl = document.getElementById('ai-running-total');

    function loadStats() {
        const saved = localStorage.getItem('yahtzee_career_stats');
        if (saved) {
            try { stats = JSON.parse(saved); } catch(e) {}
        }
        renderStats();
    }

    function saveStats() {
        localStorage.setItem('yahtzee_career_stats', JSON.stringify(stats));
        renderStats();
    }

    function renderStats() {
        document.getElementById('stat-played').textContent = stats.played;
        document.getElementById('stat-record').textContent = `${stats.wins}-${stats.losses}`;
        document.getElementById('stat-highscore').textContent = stats.highScore;
        document.getElementById('stat-yahtzees').textContent = stats.yahtzees;
    }

    function initGame() {
        scores = { user: {}, ai: {} };
        currentPlayer = 'user';
        isGameOver = false;
        resetTurn();
        renderScoreboard();
        updateStatus("Your turn! Roll the dice.");
        setAiIntent("AI will display tactical decisions here.", false);
    }

    function renderDieFace(el, val) {
        const pips = el.querySelectorAll('.pip');
        const activeIndices = PIP_MAPS[val] || [];
        pips.forEach((pip, idx) => {
            pip.style.visibility = activeIndices.includes(idx) ? 'visible' : 'hidden';
        });
    }

    function resetTurn() {
        dice = [0, 0, 0, 0, 0];
        held = [false, false, false, false, false];
        rollsLeft = 3;
        
        diceElements.forEach((el) => {
            renderDieFace(el, 0);
            el.classList.remove('held', 'ai-held', 'disabled', 'rolling');
            el.setAttribute('aria-label', 'Unrolled die');
        });

        rollBtn.disabled = (currentPlayer === 'ai');
        rollBtn.textContent = `Roll Dice (${rollsLeft} left)`;
    }

    function calculateScore(catId, currentDice) {
        const counts = [0, 0, 0, 0, 0, 0, 0];
        let sum = 0;
        currentDice.forEach(val => {
            if (val > 0) counts[val]++;
            sum += val;
        });

        switch (catId) {
            case 'ones': return counts[1] * 1;
            case 'twos': return counts[2] * 2;
            case 'threes': return counts[3] * 3;
            case 'fours': return counts[4] * 4;
            case 'fives': return counts[5] * 5;
            case 'sixes': return counts[6] * 6;
            case 'threeKind': return Math.max(...counts) >= 3 ? sum : 0;
            case 'fourKind': return Math.max(...counts) >= 4 ? sum : 0;
            case 'fullHouse': 
                const hasThree = counts.includes(3);
                const hasTwo = counts.includes(2);
                const hasFive = counts.includes(5);
                return (hasThree && hasTwo) || hasFive ? 25 : 0;
            case 'smallStr':
                if ((counts[1]&&counts[2]&&counts[3]&&counts[4]) ||
                    (counts[2]&&counts[3]&&counts[4]&&counts[5]) ||
                    (counts[3]&&counts[4]&&counts[5]&&counts[6])) return 30;
                return 0;
            case 'largeStr':
                if ((counts[1]&&counts[2]&&counts[3]&&counts[4]&&counts[5]) ||
                    (counts[2]&&counts[3]&&counts[4]&&counts[5]&&counts[6])) return 40;
                return 0;
            case 'yahtzee': return Math.max(...counts) === 5 ? 50 : 0;
            case 'chance': return sum;
            default: return 0;
        }
    }

    function getSubtotal(player, section) {
        return CATEGORIES
            .filter(c => c.section === section)
            .reduce((sum, c) => sum + (scores[player][c.id] ?? 0), 0);
    }

    function getBonus(player) {
        return getSubtotal(player, 'upper') >= 63 ? 35 : 0;
    }

    function getTotalScore(player) {
        return getSubtotal(player, 'upper') + getBonus(player) + getSubtotal(player, 'lower');
    }

    function renderScoreboard() {
        scoreBody.innerHTML = '';
        appendSectionHeader('Upper Section');
        CATEGORIES.filter(c => c.section === 'upper').forEach(c => appendCategoryRow(c));
        appendSummaryRow('Subtotal', getSubtotal('user', 'upper'), getSubtotal('ai', 'upper'));
        appendSummaryRow('Bonus (63+ pts = 35)', getBonus('user'), getBonus('ai'));
        appendSectionHeader('Lower Section');
        CATEGORIES.filter(c => c.section === 'lower').forEach(c => appendCategoryRow(c));
        appendSummaryRow('GRAND TOTAL', getTotalScore('user'), getTotalScore('ai'), true);

        // Update Running Totals
        userRunningTotalEl.textContent = getTotalScore('user');
        aiRunningTotalEl.textContent = getTotalScore('ai');
    }

    function appendSectionHeader(text) {
        const tr = document.createElement('tr');
        tr.className = 'section-header';
        tr.innerHTML = `<td colspan="3">${text}</td>`;
        scoreBody.appendChild(tr);
    }

    function appendSummaryRow(label, userVal, aiVal, isTotal = false) {
        const tr = document.createElement('tr');
        if (isTotal) tr.className = 'total-row';
        tr.innerHTML = `
            <td><strong>${label}</strong></td>
            <td class="num">${userVal}</td>
            <td class="num">${aiVal}</td>
        `;
        scoreBody.appendChild(tr);
    }

    function appendCategoryRow(cat) {
        const tr = document.createElement('tr');
        tr.className = 'score-row';

        const userFilled = scores.user[cat.id] !== undefined;
        const userVal = userFilled ? scores.user[cat.id] : '';
        const aiVal = scores.ai[cat.id] !== undefined ? scores.ai[cat.id] : '';

        let potentialText = '';
        if (currentPlayer === 'user' && !userFilled && rollsLeft < 3) {
            tr.classList.add('selectable', 'potential');
            potentialText = calculateScore(cat.id, dice);
            tr.onclick = () => selectCategory(cat.id);
        } else if (userFilled) {
            tr.classList.add('filled');
        }

        tr.innerHTML = `
            <td>${cat.name}</td>
            <td class="num">${userFilled ? userVal : potentialText}</td>
            <td class="num">${aiVal}</td>
        `;
        scoreBody.appendChild(tr);
    }

    function updateStatus(msg) { statusText.textContent = msg; }

    function setAiIntent(msg, isActive = true) {
        aiIntentBox.textContent = msg;
        aiIntentBox.classList.toggle('active', isActive);
    }

    function roll() {
        if (rollsLeft <= 0 || currentPlayer !== 'user') return;

        sound.playRoll();
        diceElements.forEach((el, i) => {
            if (!held[i]) el.classList.add('rolling');
        });

        setTimeout(() => {
            for (let i = 0; i < 5; i++) {
                if (!held[i]) dice[i] = Math.floor(Math.random() * 6) + 1;
            }

            rollsLeft--;
            rollBtn.textContent = `Roll Dice (${rollsLeft} left)`;

            diceElements.forEach((el, i) => {
                el.classList.remove('rolling');
                renderDieFace(el, dice[i]);
                el.setAttribute('aria-label', `Die ${i + 1}: ${dice[i]}${held[i] ? ' (Held)' : ''}`);
            });

            renderScoreboard();

            if (rollsLeft === 0) {
                rollBtn.disabled = true;
                updateStatus("Select a category to score your roll.");
            } else {
                updateStatus("Keep dice or roll again.");
            }
        }, 250);
    }

    function toggleHold(index) {
        if (rollsLeft === 3 || currentPlayer !== 'user') return;
        held[index] = !held[index];
        sound.playHold(held[index]);
        diceElements[index].classList.toggle('held', held[index]);
        diceElements[index].setAttribute('aria-label', `Die ${index + 1}: ${dice[index]}${held[index] ? ' (Held)' : ''}`);
    }

    function selectCategory(catId) {
        if (currentPlayer !== 'user' || scores.user[catId] !== undefined || rollsLeft === 3) return;

        sound.playScore();
        const score = calculateScore(catId, dice);
        scores.user[catId] = score;

        // Check Yahtzee stat
        if (catId === 'yahtzee' && score === 50) {
            stats.yahtzees++;
        }

        checkGameOver();

        if (!isGameOver) {
            currentPlayer = 'ai';
            renderScoreboard();
            executeAITurn();
        }
    }

    function checkGameOver() {
        const userComplete = Object.keys(scores.user).length === CATEGORIES.length;
        const aiComplete = Object.keys(scores.ai).length === CATEGORIES.length;

        if (userComplete && aiComplete) {
            isGameOver = true;
            sound.playGameOver();
            const userTotal = getTotalScore('user');
            const aiTotal = getTotalScore('ai');

            // Update Career Stats
            stats.played++;
            if (userTotal > stats.highScore) {
                stats.highScore = userTotal;
            }

            if (userTotal > aiTotal) {
                stats.wins++;
                updateStatus(`🎉 You win! ${userTotal} to ${aiTotal}`);
                setAiIntent("Game Over: Good game! You outscored me.", false);
            } else if (aiTotal > userTotal) {
                stats.losses++;
                updateStatus(`🤖 AI wins! ${aiTotal} to ${userTotal}`);
                setAiIntent("Game Over: Victory for the machine!", true);
            } else {
                updateStatus(`🤝 It's a tie! ${userTotal} to ${aiTotal}`);
                setAiIntent("Game Over: Perfectly matched!", false);
            }

            saveStats();
            renderScoreboard();
            rollBtn.disabled = true;
        }
    }

    async function executeAITurn() {
        resetTurn();
        diceElements.forEach(el => el.classList.add('disabled'));
        updateStatus("AI is playing...");
        setAiIntent("AI is evaluating options...");

        let aiRolls = 3;
        let aiDice = [0, 0, 0, 0, 0];
        let aiHeld = [false, false, false, false, false];

        while (aiRolls > 0) {
            await new Promise(r => setTimeout(r, 650));
            sound.playRoll();
            diceElements.forEach((el, i) => {
                if (!aiHeld[i]) el.classList.add('rolling');
            });

            await new Promise(r => setTimeout(r, 300));

            for (let i = 0; i < 5; i++) {
                if (!aiHeld[i]) aiDice[i] = Math.floor(Math.random() * 6) + 1;
            }
            aiRolls--;

            diceElements.forEach((el, i) => {
                el.classList.remove('rolling');
                renderDieFace(el, aiDice[i]);
            });

            if (aiRolls > 0) {
                const evaluation = evaluateAIStrategy(aiDice, scores.ai);
                aiHeld = evaluation.holds;

                let holdsChanged = false;
                diceElements.forEach((el, i) => {
                    const wasHeld = el.classList.contains('ai-held');
                    if (wasHeld !== aiHeld[i]) holdsChanged = true;
                    el.classList.toggle('ai-held', aiHeld[i]);
                });

                if (holdsChanged) sound.playHold(true);
                setAiIntent(`Roll ${3 - aiRolls}/3: ${evaluation.explanation}`);
                await new Promise(r => setTimeout(r, 1100));
            }
        }

        await new Promise(r => setTimeout(r, 700));
        const finalChoice = chooseBestCategory(aiDice, scores.ai);
        
        sound.playScore();
        scores.ai[finalChoice.catId] = finalChoice.score;

        setAiIntent(`AI scored ${finalChoice.score} pts in ${finalChoice.catName}.`);
        updateStatus(`AI chose ${finalChoice.catName} (${finalChoice.score} pts).`);

        checkGameOver();

        if (!isGameOver) {
            currentPlayer = 'user';
            await new Promise(r => setTimeout(r, 1400));
            resetTurn();
            renderScoreboard();
            updateStatus("Your turn! Roll the dice.");
        }
    }

function evaluateAIStrategy(currentDice, currentScores) {
        const counts = [0, 0, 0, 0, 0, 0, 0];
        currentDice.forEach(d => counts[d]++);
        const uniqueDice = [...new Set(currentDice)].sort((a,b) => a - b);
        
        // Open categories list
        const openCats = CATEGORIES.filter(c => currentScores[c.id] === undefined).map(c => c.id);

        // Quick helper checks
        const openUpperValues = [1, 2, 3, 4, 5, 6].filter(v => openCats.includes(getUpperCatId(v)));
        const needSets = openCats.includes('threeKind') || openCats.includes('fourKind') || openCats.includes('chance');
        const needFullHouse = openCats.includes('fullHouse');
        const needLargeStr = openCats.includes('largeStr');
        const needSmallStr = openCats.includes('smallStr');

        // 1. YAHTZEE Check
        if (Math.max(...counts) === 5) {
            return { holds: [true, true, true, true, true], explanation: "YAHTZEE! Keeping all dice!" };
        }

        // 2. FULL HOUSE Check (If Full House is open)
        if (counts.includes(3) && counts.includes(2) && needFullHouse) {
            return { holds: [true, true, true, true, true], explanation: "Holding Full House!" };
        }

        // 3. STRAIGHT CHECK (If Straights are open, prioritize sequences over random pairs)
        if (needLargeStr || needSmallStr) {
            const fiveCardStraights = [[1,2,3,4,5], [2,3,4,5,6]];
            const fourCardStraights = [[1,2,3,4], [2,3,4,5], [3,4,5,6]];

            for (const pat of fiveCardStraights) {
                if (pat.every(v => uniqueDice.includes(v))) {
                    const holds = currentDice.map(d => pat.includes(d));
                    return { holds, explanation: "Complete Straight hit! Holding sequence." };
                }
            }

            for (const pat of fourCardStraights) {
                if (pat.every(v => uniqueDice.includes(v))) {
                    const used = {};
                    const holds = currentDice.map(d => {
                        if (pat.includes(d) && !used[d]) {
                            used[d] = true;
                            return true;
                        }
                        return false;
                    });
                    return { holds, explanation: `Holding 4-card straight sequence (${pat.join('-')}).` };
                }
            }
        }

        // 4. EVALUATE PAIRS / SETS WITH STRICT CATEGORY RELEVANCE
        let bestTargetVal = 0;
        let bestReason = "";

        // Scan from 6 down to 1
        for (let v = 6; v >= 1; v--) {
            if (counts[v] >= 2) {
                const upperIsOpen = openUpperValues.includes(v);
                
                if (upperIsOpen) {
                    bestTargetVal = v;
                    bestReason = `Keeping ${counts[v]} ${v}'s — Open Upper ${v}'s slot.`;
                    break; // Upper match is high priority
                } else if (needSets) {
                    bestTargetVal = v;
                    bestReason = `Keeping ${counts[v]} ${v}'s — Targeting 3/4 of a Kind / Chance.`;
                    break;
                }
            }
        }

        if (bestTargetVal > 0) {
            const holds = currentDice.map(d => d === bestTargetVal);
            return { holds, explanation: bestReason };
        }

        // 5. TARGETED SINGLE DIE (If no valid pairs match open categories)
        // Look specifically for dice that match open Upper slots (e.g. holding a 6 because only 6s is open)
        for (let v = 6; v >= 1; v--) {
            if (counts[v] > 0 && openUpperValues.includes(v)) {
                const holds = currentDice.map(d => d === v);
                return { holds, explanation: `Chasing open Upper slot — Holding ${v}.` };
            }
        }

        // 6. ULTIMATE FALLBACK: Hold highest die for Chance/Sacrifice
        const maxVal = Math.max(...currentDice);
        const holds = currentDice.map(d => d === maxVal);
        return { holds, explanation: `No open slot matches — Holding highest die (${maxVal}).` };
    }

    function chooseBestCategory(currentDice, currentScores) {
        const openCats = CATEGORIES.filter(c => currentScores[c.id] === undefined);
        let best = { catId: null, score: -1, weight: -999, catName: '' };

        const counts = [0, 0, 0, 0, 0, 0, 0];
        currentDice.forEach(d => counts[d]++);

        for (const cat of openCats) {
            const score = calculateScore(cat.id, currentDice);
            let weight = score;

            if (cat.section === 'upper') {
                const faceVal = getUpperFaceValue(cat.id);
                const diceCount = counts[faceVal];

                if (diceCount > 0) {
                    // Weight based on number of dice relative to the 3-dice benchmark
                    // 3+ dice gets a big boost, 2 dice is solid, 1 die gets heavily penalized for high numbers
                    const benchmarkDelta = diceCount - 3; // e.g., 2 dice = -1, 1 die = -2
                    weight = (benchmarkDelta * 20) + score;

                    // Extra protection: heavily discourage placing a single 4, 5, or 6 in the upper section
                    if (diceCount === 1 && faceVal >= 4) {
                        weight -= 25; 
                    }
                } else {
                    weight = -50; // Zero score in upper is a last resort sacrifice
                }

            } else {
                // Lower Section Strategic Weights
                if (cat.id === 'yahtzee' && score === 50) weight += 100;
                if (cat.id === 'largeStr' && score === 40) weight += 40;
                if (cat.id === 'smallStr' && score === 30) weight += 25;
                if (cat.id === 'fullHouse' && score === 25) weight += 20;
                if ((cat.id === 'threeKind' || cat.id === 'fourKind') && score > 0) {
                    weight += 10;
                }
            }

            if (weight > best.weight) {
                best = { catId: cat.id, score, weight, catName: cat.name };
            }
        }

        // If no smart pick works, sacrifice a category intelligently
        if (best.score === 0 || best.catId === null) {
            const sacrificePriority = [
                'ones', 'twos', 'yahtzee', 'fourKind', 'threeKind', 
                'smallStr', 'largeStr', 'fullHouse', 'threes', 'fours', 'fives', 'sixes'
            ];

            for (const catId of sacrificePriority) {
                if (openCats.some(c => c.id === catId)) {
                    const catObj = CATEGORIES.find(c => c.id === catId);
                    return { catId, score: 0, catName: catObj.name };
                }
            }
        }

        return best;
    }

    // Helper function needed for the upper face value lookup
    function getUpperFaceValue(catId) {
        const mapping = { ones: 1, twos: 2, threes: 3, fours: 4, fives: 5, sixes: 6 };
        return mapping[catId] || 0;
    }

    function getUpperCatId(val) {
        return ['ones', 'twos', 'threes', 'fours', 'fives', 'sixes'][val - 1];
    }

    function getUpperTarget(catId) {
        const targets = { ones: 3, twos: 6, threes: 9, fours: 12, fives: 15, sixes: 18 };
        return targets[catId] || 0;
    }

    // --- Event Listeners ---
    rollBtn.addEventListener('click', roll);
    restartBtn.addEventListener('click', initGame);

    resetStatsBtn.addEventListener('click', () => {
        if (confirm("Reset career statistics?")) {
            stats = { played: 0, wins: 0, losses: 0, highScore: 0, yahtzees: 0 };
            saveStats();
        }
    });

    diceElements.forEach(el => {
        const handleInteraction = () => {
            const index = parseInt(el.dataset.index);
            toggleHold(index);
        };

        el.addEventListener('click', handleInteraction);
        el.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                handleInteraction();
            }
        });
    });

    // Boot
    loadStats();
    initGame();
</script>
