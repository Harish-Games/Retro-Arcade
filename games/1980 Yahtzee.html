<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yahtzee - Smart AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
        }

        .game-wrapper {
            background: #14142a;
            padding: 30px 40px 35px;
            border-radius: 20px;
            border: 2px solid #3a3a6a;
            box-shadow: 0 0 60px rgba(0, 100, 200, 0.1);
            max-width: 960px;
            width: 100%;
        }

        .title {
            color: #88ddff;
            text-align: center;
            font-size: 38px;
            font-weight: bold;
            letter-spacing: 6px;
            margin-bottom: 12px;
            text-shadow: 0 0 30px rgba(0, 150, 255, 0.2);
        }

        .dice-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .die {
            width: 80px;
            height: 80px;
            background: #ffffff;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            font-weight: bold;
            cursor: pointer;
            border: 4px solid #2a2a5a;
            transition: all 0.2s;
            user-select: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .die:hover {
            transform: scale(1.06);
            border-color: #4a4a8a;
        }
        .die.held {
            border-color: #ffdd44;
            box-shadow: 0 0 35px rgba(255, 221, 68, 0.35);
            transform: scale(1.04);
        }
        .die.rolling {
            animation: dieRoll 0.35s ease;
        }
        .die.ai-final {
            border-color: #ff8844;
            box-shadow: 0 0 40px rgba(255, 136, 68, 0.5);
            transform: scale(1.04);
        }
        .die.disabled {
            cursor: default;
            opacity: 0.5;
        }
        .die.disabled:hover {
            transform: none;
        }

        @keyframes dieRoll {
            0% { transform: rotate(0deg) scale(1); }
            40% { transform: rotate(200deg) scale(1.25); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin: 16px 0;
        }
        button {
            background: #2a2a5a;
            color: #fff;
            border: 2px solid #4a4a8a;
            padding: 10px 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        button:hover {
            background: #3a3a7a;
            border-color: #6a6aaa;
            transform: scale(1.03);
        }
        button.primary {
            background: #2a6a3a;
            border-color: #4a9a5a;
        }
        button.primary:hover {
            background: #3a8a4a;
        }
        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
        }

        .status {
            color: #88ddff;
            font-size: 22px;
            text-align: center;
            margin: 12px 0 8px;
            font-weight: bold;
            min-height: 36px;
            padding: 4px 10px;
            background: rgba(0,0,0,0.25);
            border-radius: 8px;
        }
        .status .highlight {
            color: #ff8844;
        }

        .roll-info {
            color: #6688aa;
            font-size: 16px;
            text-align: center;
            margin: 6px 0 14px;
        }

        .scoreboards {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 16px 0 10px;
        }
        .score-board {
            background: #0d0d22;
            padding: 16px 22px;
            border-radius: 12px;
            border: 2px solid #2a2a5a;
            flex: 1;
            min-width: 260px;
            max-width: 440px;
        }
        .score-board h3 {
            color: #aac0ff;
            font-size: 18px;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 3px;
        }
        .score-board .total {
            color: #ffdd44;
            font-size: 32px;
            text-align: center;
            font-weight: bold;
            padding: 4px 0 10px;
            border-bottom: 2px solid #1a1a3a;
            margin-bottom: 8px;
        }
        .score-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 16px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .score-grid::-webkit-scrollbar {
            width: 5px;
        }
        .score-grid::-webkit-scrollbar-track {
            background: #0a0a1a;
            border-radius: 3px;
        }
        .score-grid::-webkit-scrollbar-thumb {
            background: #3a3a6a;
            border-radius: 3px;
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 14px;
            color: #8899aa;
            cursor: default;
            transition: all 0.15s;
        }
        .score-item.available {
            color: #c8d8ff;
            cursor: pointer;
        }
        .score-item.available:hover {
            background: #2a2a5a;
            color: #fff;
            transform: scale(1.02);
        }
        .score-item.used {
            color: #445566;
        }
        .score-item.used .score-value {
            color: #445566;
        }
        .score-item .score-name {
            flex: 1;
        }
        .score-item .score-value {
            font-weight: bold;
            margin-left: 12px;
        }
        .score-item.available .score-value {
            color: #ffdd44;
        }

        .score-item.upper-total {
            border-top: 2px solid #2a2a5a;
            padding-top: 8px;
            margin-top: 4px;
            color: #ffdd44;
            font-weight: bold;
        }
        .score-item.upper-total .score-value {
            color: #ffdd44;
        }

        .score-item.bonus {
            border-top: 2px solid #2a2a5a;
            padding-top: 8px;
            margin-top: 4px;
            color: #88ddff;
            font-weight: bold;
        }
        .score-item.bonus .score-value {
            color: #88ddff;
        }

        .score-item.ai-selected {
            background: rgba(255, 102, 68, 0.2);
            border-left: 4px solid #ff6644;
            padding-left: 12px;
            border-radius: 0 5px 5px 0;
        }
        .score-item .score-extra {
            color: #ff8844;
            font-size: 11px;
            margin-left: 4px;
        }

        .stats-bar {
            display: flex;
            gap: 24px;
            color: #aac0ff;
            font-size: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 12px 0 4px;
            padding: 8px 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        .stats-bar span {
            font-weight: bold;
        }
        .stats-bar .win { color: #66dd88; }
        .stats-bar .loss { color: #ff6666; }
        .stats-bar .streak { color: #66ddff; }

        .keyboard-hint {
            color: #556;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }
        .keyboard-hint kbd {
            background: #1a1a3a;
            padding: 2px 10px;
            border-radius: 4px;
            border: 1px solid #3a3a6a;
            color: #aac0ff;
            font-size: 11px;
        }

        @media (max-width: 750px) {
            .game-wrapper { padding: 18px; }
            .die { width: 62px; height: 62px; font-size: 32px; }
            .title { font-size: 28px; }
            .score-item { font-size: 12px; }
        }
        @media (max-width: 550px) {
            .die { width: 50px; height: 50px; font-size: 26px; gap: 10px; }
            .scoreboards { flex-direction: column; align-items: center; }
            .score-board { max-width: 100%; }
            button { padding: 8px 16px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="title">🎲 YAHTZEE</div>

        <div class="status" id="statusDisplay">🎯 Roll the dice!</div>

        <div class="dice-container" id="diceContainer">
            <div class="die" data-index="0">⚀</div>
            <div class="die" data-index="1">⚀</div>
            <div class="die" data-index="2">⚀</div>
            <div class="die" data-index="3">⚀</div>
            <div class="die" data-index="4">⚀</div>
        </div>

        <div class="roll-info" id="rollInfo">Roll 0 of 3</div>

        <div class="controls">
            <button id="rollBtn" class="primary">🎲 Roll</button>
            <button id="resetBtn">🔄 New Game</button>
            <button id="soundBtn">🔊 Sound</button>
            <button id="aiFirstBtn">🤖 AI First</button>
        </div>

        <div class="scoreboards">
            <div class="score-board">
                <h3>🟢 YOU</h3>
                <div class="total" id="playerTotal">0</div>
                <div class="score-grid" id="playerScores"></div>
            </div>
            <div class="score-board">
                <h3>🔴 AI</h3>
                <div class="total" id="aiTotal">0</div>
                <div class="score-grid" id="aiScores"></div>
            </div>
        </div>

        <div class="stats-bar">
            <div>🏆 Wins: <span class="win" id="wins">0</span></div>
            <div>💀 Losses: <span class="loss" id="losses">0</span></div>
            <div>🔥 Streak: <span class="streak" id="streak">0</span></div>
        </div>

        <div class="keyboard-hint">
            <kbd>R</kbd> Roll &nbsp;|&nbsp; <kbd>1</kbd>-<kbd>5</kbd> Hold dice &nbsp;|&nbsp; <kbd>Space</kbd> New Game
        </div>
    </div>

    <script>
        // ============================================================
        //  YAHTZEE - FULLY CATEGORY-AWARE AI
        //  AI NEVER chases categories that are already used
        // ============================================================

        const DICE_COUNT = 5;
        const MAX_ROLLS = 3;

        const CATEGORIES = [
            { id: 'ones', name: 'Ones', upper: true },
            { id: 'twos', name: 'Twos', upper: true },
            { id: 'threes', name: 'Threes', upper: true },
            { id: 'fours', name: 'Fours', upper: true },
            { id: 'fives', name: 'Fives', upper: true },
            { id: 'sixes', name: 'Sixes', upper: true },
            { id: 'threeOfAKind', name: '3 of a Kind', upper: false },
            { id: 'fourOfAKind', name: '4 of a Kind', upper: false },
            { id: 'fullHouse', name: 'Full House', upper: false },
            { id: 'smallStraight', name: 'Small Straight', upper: false },
            { id: 'largeStraight', name: 'Large Straight', upper: false },
            { id: 'yahtzee', name: 'Yahtzee!', upper: false },
            { id: 'chance', name: 'Chance', upper: false },
        ];

        const DICE_FACES = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
        const UPPER_IDS = ['ones', 'twos', 'threes', 'fours', 'fives', 'sixes'];
        const LOWER_IDS = ['threeOfAKind', 'fourOfAKind', 'fullHouse', 'smallStraight', 'largeStraight', 'yahtzee', 'chance'];

        // ===== DOM REFS =====
        const diceContainer = document.getElementById('diceContainer');
        const statusDisplay = document.getElementById('statusDisplay');
        const rollInfo = document.getElementById('rollInfo');
        const playerScoresEl = document.getElementById('playerScores');
        const aiScoresEl = document.getElementById('aiScores');
        const playerTotalEl = document.getElementById('playerTotal');
        const aiTotalEl = document.getElementById('aiTotal');
        const rollBtn = document.getElementById('rollBtn');
        const resetBtn = document.getElementById('resetBtn');
        const soundBtn = document.getElementById('soundBtn');
        const aiFirstBtn = document.getElementById('aiFirstBtn');
        const winsSpan = document.getElementById('wins');
        const lossesSpan = document.getElementById('losses');
        const streakSpan = document.getElementById('streak');

        // ===== GAME STATE =====
        let game = {
            pDice: [1, 1, 1, 1, 1],
            pHeld: [false, false, false, false, false],
            pRolls: 0,
            pScores: {},
            pTotal: 0,
            pBonus: false,

            aDice: [1, 1, 1, 1, 1],
            aHeld: [false, false, false, false, false],
            aRolls: 0,
            aScores: {},
            aTotal: 0,
            aBonus: false,

            turn: 'player',
            gameOver: false,
            rolling: false,
            aiThinking: false,
            waitingScore: false,

            aiLastCat: null,
            aiLastScore: null,
            aiFinalDice: null,
            showAiFinal: false,

            playerTurnsRemaining: 13,
            aiTurnsRemaining: 13,
        };

        // ===== STATS =====
        let stats = {
            wins: parseInt(localStorage.getItem('yahtzee_wins')) || 0,
            losses: parseInt(localStorage.getItem('yahtzee_losses')) || 0,
            streak: parseInt(localStorage.getItem('yahtzee_streak')) || 0,
        };
        updateStats();

        // ===== AUDIO =====
        let audioCtx = null;
        let soundOn = true;

        function initAudio() {
            if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!soundOn) return;
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                switch (type) {
                    case 'roll':
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(300 + Math.random() * 400, now);
                        osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
                        gain.gain.setValueAtTime(0.05, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                        osc.start(now);
                        osc.stop(now + 0.08);
                        break;
                    case 'yahtzee':
                        [523, 659, 784, 1047, 784, 659].forEach((f, i) => {
                            const o = audioCtx.createOscillator();
                            const g = audioCtx.createGain();
                            o.connect(g);
                            g.connect(audioCtx.destination);
                            o.type = 'square';
                            o.frequency.setValueAtTime(f, now + i * 0.08);
                            g.gain.setValueAtTime(0.05, now + i * 0.08);
                            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.06);
                            o.start(now + i * 0.08);
                            o.stop(now + i * 0.08 + 0.06);
                        });
                        break;
                    case 'win':
                        [523, 659, 784, 1047, 784, 659, 523, 784].forEach((f, i) => {
                            const o = audioCtx.createOscillator();
                            const g = audioCtx.createGain();
                            o.connect(g);
                            g.connect(audioCtx.destination);
                            o.type = 'square';
                            o.frequency.setValueAtTime(f, now + i * 0.06);
                            g.gain.setValueAtTime(0.04, now + i * 0.06);
                            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.05);
                            o.start(now + i * 0.06);
                            o.stop(now + i * 0.06 + 0.05);
                        });
                        break;
                    case 'score':
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                        gain.gain.setValueAtTime(0.05, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                        osc.start(now);
                        osc.stop(now + 0.05);
                        break;
                }
            } catch (e) {}
        }

        // ===== SCORING HELPERS =====
        function counts(dice) {
            const c = [0, 0, 0, 0, 0, 0];
            for (const d of dice) c[d - 1]++;
            return c;
        }

        function scoreCat(dice, cat) {
            const c = counts(dice);
            const s = [...dice].sort((a, b) => a - b);

            switch (cat) {
                case 'ones': return c[0] * 1;
                case 'twos': return c[1] * 2;
                case 'threes': return c[2] * 3;
                case 'fours': return c[3] * 4;
                case 'fives': return c[4] * 5;
                case 'sixes': return c[5] * 6;
                case 'threeOfAKind':
                    for (let i = 0; i < 6; i++) if (c[i] >= 3) return dice.reduce((a, b) => a + b, 0);
                    return 0;
                case 'fourOfAKind':
                    for (let i = 0; i < 6; i++) if (c[i] >= 4) return dice.reduce((a, b) => a + b, 0);
                    return 0;
                case 'fullHouse': {
                    let h3 = false,
                        h2 = false;
                    for (let i = 0; i < 6; i++) { if (c[i] === 3) h3 = true; if (c[i] === 2) h2 = true; }
                    return (h3 && h2) ? 25 : 0;
                }
                case 'smallStraight': {
                    const u = [...new Set(s)];
                    for (let i = 0; i <= u.length - 4; i++) {
                        if (u[i + 3] - u[i] === 3) return 30;
                    }
                    return 0;
                }
                case 'largeStraight':
                    if (s[0] === 1 && s[1] === 2 && s[2] === 3 && s[3] === 4 && s[4] === 5) return 40;
                    if (s[0] === 2 && s[1] === 3 && s[2] === 4 && s[3] === 5 && s[4] === 6) return 40;
                    return 0;
                case 'yahtzee':
                    for (let i = 0; i < 6; i++) if (c[i] === 5) return 50;
                    return 0;
                case 'chance':
                    return dice.reduce((a, b) => a + b, 0);
                default:
                    return 0;
            }
        }

        function upperTotal(scores) {
            let t = 0;
            for (const id of UPPER_IDS) {
                t += scores[id] || 0;
            }
            return t;
        }

        function bonus(scores) {
            return upperTotal(scores) >= 63 ? 35 : 0;
        }

        function totalScore(scores) {
            let t = 0;
            for (const cat of CATEGORIES) t += scores[cat.id] || 0;
            t += bonus(scores);
            return t;
        }

        function usedCats(scores) {
            const used = [];
            for (const cat of CATEGORIES) {
                if (scores[cat.id] !== undefined && scores[cat.id] !== null) used.push(cat.id);
            }
            return used;
        }

        function availCats(scores) {
            const u = usedCats(scores);
            return CATEGORIES.filter(c => !u.includes(c.id));
        }

        function isComplete(scores) {
            return usedCats(scores).length === CATEGORIES.length;
        }

        // ===== FULLY CATEGORY-AWARE AI =====

        function aiPickCategory(dice, scores) {
            const avail = availCats(scores);
            let best = avail[0];
            let bestScore = -Infinity;

            for (const cat of avail) {
                const raw = scoreCat(dice, cat.id);
                let weighted = raw;

                // Upper section: bonus potential
                if (cat.upper) {
                    const ut = upperTotal(scores);
                    if (ut + raw >= 63) weighted += 60;
                    else if (ut + raw >= 55) weighted += 20;
                    weighted += 5;
                }

                // Special bonuses for high-value categories
                if (cat.id === 'yahtzee' && raw === 50) weighted += 70;
                else if (cat.id === 'largeStraight' && raw === 40) weighted += 40;
                else if (cat.id === 'smallStraight' && raw === 30) weighted += 25;
                else if (cat.id === 'fullHouse' && raw === 25) weighted += 15;

                // Penalize zero scores (except Chance)
                if (raw === 0 && cat.id !== 'chance') weighted -= 15;
                // If Chance is available and nothing else is good, it's a fallback
                if (cat.id === 'chance') weighted += 2;

                if (weighted > bestScore) {
                    bestScore = weighted;
                    best = cat;
                }
            }

            return best;
        }

        function aiDecideHold(dice, scores, rollNum) {
            const c = counts(dice);
            const avail = availCats(scores);
            const availIds = avail.map(a => a.id);

            // ===== IF YAHTZEE AVAILABLE =====
            if (availIds.includes('yahtzee')) {
                // Keep 3+ of a kind
                for (let i = 0; i < 6; i++) {
                    if (c[i] >= 3) return dice.map(d => d === i + 1);
                }
                // Keep pairs
                for (let i = 0; i < 6; i++) {
                    if (c[i] === 2) return dice.map(d => d === i + 1);
                }
            }

            // ===== IF STRAIGHTS AVAILABLE =====
            const hasSmall = availIds.includes('smallStraight');
            const hasLarge = availIds.includes('largeStraight');

            if (hasSmall || hasLarge) {
                const s = [...dice].sort((a, b) => a - b);
                const u = [...new Set(s)];

                // Large straight: need 4+ unique consecutive
                if (hasLarge && u.length >= 4) {
                    for (let i = 0; i <= u.length - 4; i++) {
                        if (u[i + 3] - u[i] === 3) {
                            const keep = u.slice(i, i + 4);
                            return dice.map(d => keep.includes(d));
                        }
                    }
                }

                // Small straight: need 3+ unique consecutive
                if (hasSmall && u.length >= 3) {
                    // First try to find 4 consecutive
                    for (let i = 0; i <= u.length - 4; i++) {
                        if (u[i + 3] - u[i] === 3) {
                            const keep = u.slice(i, i + 4);
                            return dice.map(d => keep.includes(d));
                        }
                    }
                    // Try 3 consecutive
                    for (let i = 0; i <= u.length - 3; i++) {
                        if (u[i + 2] - u[i] === 2) {
                            const keep = u.slice(i, i + 3);
                            // Add the next if it would make 4
                            if (i + 3 < u.length && u[i + 3] - u[i] === 3) {
                                keep.push(u[i + 3]);
                            }
                            return dice.map(d => keep.includes(d));
                        }
                    }
                }
            }

            // ===== IF FULL HOUSE AVAILABLE =====
            if (availIds.includes('fullHouse')) {
                let threeVal = -1,
                    twoVal = -1;
                for (let i = 0; i < 6; i++) {
                    if (c[i] >= 3) threeVal = i + 1;
                    else if (c[i] >= 2) twoVal = i + 1;
                }
                if (threeVal > 0 && twoVal > 0) {
                    return dice.map(d => d === threeVal || d === twoVal);
                }
                if (threeVal > 0) {
                    return dice.map(d => d === threeVal);
                }
                // Keep any pairs
                let pairs = [];
                for (let i = 0; i < 6; i++) {
                    if (c[i] === 2) pairs.push(i + 1);
                }
                if (pairs.length >= 1) {
                    return dice.map(d => pairs.includes(d));
                }
            }

            // ===== IF 4 OF A KIND OR 3 OF A KIND AVAILABLE =====
            const hasFour = availIds.includes('fourOfAKind');
            const hasThree = availIds.includes('threeOfAKind');

            if (hasFour || hasThree) {
                // Keep 3+ of a kind
                for (let i = 0; i < 6; i++) {
                    if (c[i] >= 3) return dice.map(d => d === i + 1);
                }
                // Keep pairs
                for (let i = 0; i < 6; i++) {
                    if (c[i] === 2) return dice.map(d => d === i + 1);
                }
            }

            // ===== UPPER SECTION =====
            // Find upper categories that are available
            const availUpper = avail.filter(c => c.upper).map(c => c.id);

            if (availUpper.length > 0) {
                // Find which number has the highest count among available upper categories
                let bestVal = -1,
                    bestCount = 0;
                for (let i = 0; i < 6; i++) {
                    const val = i + 1;
                    const id = UPPER_IDS[i];
                    if (availUpper.includes(id) && c[i] > bestCount) {
                        bestCount = c[i];
                        bestVal = val;
                    }
                }
                if (bestVal > 0 && bestCount >= 2) {
                    return dice.map(d => d === bestVal);
                }
            }

            // ===== CHANCE (fallback) =====
            // Keep the highest dice for Chance
            return dice.map(d => d >= 4);
        }

        // ===== AI TURN =====
        function aiTurn() {
            if (game.gameOver || game.aiThinking) return;
            if (game.aiTurnsRemaining <= 0) {
                if (game.playerTurnsRemaining <= 0) {
                    game.gameOver = true;
                    determineWinner();
                } else {
                    game.turn = 'player';
                    statusDisplay.innerHTML = '🎯 Your turn! Roll the dice!';
                    renderAll();
                }
                return;
            }

            game.aiThinking = true;
            game.turn = 'ai';
            game.waitingScore = false;
            game.aRolls = 0;
            game.aDice = [1, 1, 1, 1, 1];
            game.aHeld = [false, false, false, false, false];
            game.aiLastCat = null;
            game.aiLastScore = null;
            game.aiFinalDice = null;
            game.showAiFinal = false;

            statusDisplay.innerHTML = '🤖 AI is thinking…';
            renderAll();

            setTimeout(() => {
                aiRollDice();
                game.aRolls = 1;
                animateDice('ai');
                renderAll();
                statusDisplay.innerHTML = '🤖 AI Roll 1…';

                setTimeout(() => {
                    const hold1 = aiDecideHold(game.aDice, game.aScores, 1);
                    game.aHeld = hold1;
                    renderAll();

                    aiRollDice();
                    game.aRolls = 2;
                    animateDice('ai');
                    renderAll();
                    statusDisplay.innerHTML = '🤖 AI Roll 2…';

                    setTimeout(() => {
                        const hold2 = aiDecideHold(game.aDice, game.aScores, 2);
                        game.aHeld = hold2;
                        renderAll();

                        aiRollDice();
                        game.aRolls = 3;
                        animateDice('ai');
                        renderAll();
                        statusDisplay.innerHTML = '🤖 AI Roll 3…';

                        setTimeout(() => {
                            game.aiFinalDice = [...game.aDice];
                            game.showAiFinal = true;

                            const cat = aiPickCategory(game.aDice, game.aScores);
                            const pts = scoreCat(game.aDice, cat.id);
                            game.aScores[cat.id] = pts;
                            game.aiLastCat = cat;
                            game.aiLastScore = pts;
                            game.aTotal = totalScore(game.aScores);
                            game.aBonus = bonus(game.aScores) > 0;
                            game.aiTurnsRemaining--;

                            statusDisplay.innerHTML =
                                `🤖 AI scored <span class="highlight">${pts}</span> in <span class="highlight">${cat.name}</span>`;
                            playSound('score');

                            renderAll();
                            updateScores();

                            if (game.aiTurnsRemaining <= 0) {
                                if (game.playerTurnsRemaining <= 0) {
                                    game.gameOver = true;
                                    determineWinner();
                                } else {
                                    game.turn = 'player';
                                    game.pRolls = 0;
                                    game.pDice = [1, 1, 1, 1, 1];
                                    game.pHeld = [false, false, false, false, false];
                                    game.waitingScore = false;
                                    game.aiThinking = false;
                                    statusDisplay.innerHTML = '🎯 Your turn! Roll the dice!';
                                    renderAll();
                                    updateScores();
                                }
                                return;
                            }

                            game.turn = 'player';
                            game.pRolls = 0;
                            game.pDice = [1, 1, 1, 1, 1];
                            game.pHeld = [false, false, false, false, false];
                            game.waitingScore = false;
                            game.aiThinking = false;
                            game.showAiFinal = true;

                            statusDisplay.innerHTML = '🎯 Your turn! Roll the dice!';
                            renderAll();
                            updateScores();

                        }, 1400);
                    }, 1500);
                }, 1500);
            }, 1200);
        }

        function aiRollDice() {
            for (let i = 0; i < DICE_COUNT; i++) {
                if (!game.aHeld[i]) {
                    game.aDice[i] = Math.floor(Math.random() * 6) + 1;
                }
            }
        }

        function animateDice(player) {
            const els = diceContainer.querySelectorAll('.die');
            const held = player === 'player' ? game.pHeld : game.aHeld;
            els.forEach((el, i) => {
                if (!held[i]) {
                    el.classList.add('rolling');
                    setTimeout(() => el.classList.remove('rolling'), 400);
                }
            });
        }

        // ===== PLAYER FUNCTIONS =====
        function playerRoll() {
            if (game.gameOver) return;
            if (game.turn !== 'player') return;
            if (game.rolling) return;
            if (game.pRolls >= MAX_ROLLS) return;
            if (game.waitingScore) return;

            game.showAiFinal = false;

            game.rolling = true;
            playSound('roll');

            for (let i = 0; i < DICE_COUNT; i++) {
                if (!game.pHeld[i]) {
                    game.pDice[i] = Math.floor(Math.random() * 6) + 1;
                }
            }
            game.pRolls++;

            const els = diceContainer.querySelectorAll('.die');
            els.forEach((el, i) => {
                if (!game.pHeld[i]) {
                    el.classList.add('rolling');
                    setTimeout(() => el.classList.remove('rolling'), 400);
                }
                el.textContent = DICE_FACES[game.pDice[i] - 1];
            });

            renderAll();
            updateRollInfo();

            const c = counts(game.pDice);
            let y = false;
            for (let i = 0; i < 6; i++) { if (c[i] === 5) y = true; }
            if (y) {
                playSound('yahtzee');
                statusDisplay.innerHTML = '🎉 YAHTZEE! 🎉';
            } else {
                statusDisplay.innerHTML = `🎲 Roll ${game.pRolls} of ${MAX_ROLLS}`;
            }

            game.rolling = false;

            if (game.pRolls === MAX_ROLLS) {
                game.waitingScore = true;
                statusDisplay.innerHTML = '📝 Click a category to score!';
                rollBtn.disabled = true;
            } else {
                rollBtn.disabled = false;
            }

            renderAll();
        }

        function playerScore(catId) {
            if (game.gameOver) return;
            if (game.turn !== 'player') return;
            if (game.pRolls === 0) return;
            if (game.pScores[catId] !== undefined) return;
            if (!game.waitingScore && game.pRolls < MAX_ROLLS) return;

            const pts = scoreCat(game.pDice, catId);
            game.pScores[catId] = pts;
            game.pTotal = totalScore(game.pScores);
            game.pBonus = bonus(game.pScores) > 0;
            game.waitingScore = false;
            game.playerTurnsRemaining--;
            playSound('score');

            statusDisplay.innerHTML = `✅ You scored <span class="highlight">${pts}</span>`;

            if (game.playerTurnsRemaining <= 0) {
                if (game.aiTurnsRemaining <= 0) {
                    game.gameOver = true;
                    determineWinner();
                } else {
                    game.turn = 'ai';
                    game.pRolls = 0;
                    game.pDice = [1, 1, 1, 1, 1];
                    game.pHeld = [false, false, false, false, false];
                    game.waitingScore = false;
                    renderAll();
                    updateScores();
                    setTimeout(aiTurn, 600);
                }
                return;
            }

            game.turn = 'ai';
            game.pRolls = 0;
            game.pDice = [1, 1, 1, 1, 1];
            game.pHeld = [false, false, false, false, false];
            game.waitingScore = false;
            renderAll();
            updateScores();

            setTimeout(aiTurn, 600);
        }

        function toggleHold(idx) {
            if (game.gameOver) return;
            if (game.turn !== 'player') return;
            if (game.pRolls === 0) return;
            if (game.rolling) return;
            if (game.waitingScore) {
                statusDisplay.innerHTML = '📝 Score first! Click a category above.';
                return;
            }
            game.pHeld[idx] = !game.pHeld[idx];
            renderDice();
        }

        // ===== WINNER =====
        function determineWinner() {
            const p = totalScore(game.pScores);
            const a = totalScore(game.aScores);
            let msg = '';
            if (p > a) {
                msg = `🏆 YOU WIN! ${p} – ${a}`;
                stats.wins++;
                stats.streak = stats.streak >= 0 ? stats.streak + 1 : 1;
                playSound('win');
            } else if (a > p) {
                msg = `💀 AI WINS! ${a} – ${p}`;
                stats.losses++;
                stats.streak = stats.streak <= 0 ? stats.streak - 1 : -1;
            } else {
                msg = `🤝 DRAW! ${p} – ${a}`;
                stats.streak = 0;
            }
            localStorage.setItem('yahtzee_wins', stats.wins);
            localStorage.setItem('yahtzee_losses', stats.losses);
            localStorage.setItem('yahtzee_streak', stats.streak);
            updateStats();
            statusDisplay.innerHTML = msg;
            renderAll();
            updateScores();
        }

        // ===== RENDER =====
        function renderDice() {
            const els = diceContainer.querySelectorAll('.die');

            if (game.showAiFinal && game.aiFinalDice) {
                els.forEach((el, i) => {
                    el.textContent = DICE_FACES[game.aiFinalDice[i] - 1];
                    el.classList.add('ai-final', 'disabled');
                    el.classList.remove('held', 'rolling');
                });
                return;
            }

            if (game.turn === 'player' || game.gameOver) {
                els.forEach((el, i) => {
                    el.textContent = DICE_FACES[game.pDice[i] - 1];
                    el.classList.toggle('held', game.pHeld[i]);
                    el.classList.remove('ai-final');
                    const interact = game.turn === 'player' &&
                        game.pRolls > 0 &&
                        !game.waitingScore &&
                        !game.gameOver;
                    el.classList.toggle('disabled', !interact);
                });
                return;
            }

            if (game.turn === 'ai') {
                els.forEach((el, i) => {
                    el.textContent = DICE_FACES[game.aDice[i] - 1];
                    el.classList.add('disabled');
                    el.classList.remove('held', 'ai-final');
                });
            }
        }

        function renderScoreboard(player, container, totalEl) {
            const scores = player === 'player' ? game.pScores : game.aScores;
            const total = player === 'player' ? game.pTotal : game.aTotal;

            let html = '';
            let ut = 0;

            for (const id of UPPER_IDS) {
                const cat = CATEGORIES.find(c => c.id === id);
                const val = scores[id];
                const used = val !== undefined && val !== null;
                ut += val || 0;

                let cls = 'score-item';
                if (used) cls += ' used';
                else {
                    const canScore = player === 'player' &&
                        game.turn === 'player' &&
                        game.pRolls > 0 &&
                        game.waitingScore &&
                        !game.gameOver;
                    if (canScore) cls += ' available';
                }

                let extra = '';
                if (player === 'ai' && game.aiLastCat && game.aiLastCat.id === id && used && game.aiLastScore !== null) {
                    cls += ' ai-selected';
                    extra = `<span class="score-extra">${game.aiLastScore}</span>`;
                }

                html += `
                    <div class="${cls}" data-cat="${id}" data-player="${player}">
                        <span class="score-name">${cat.name}</span>
                        <span class="score-value">${used ? val : '-'} ${extra}</span>
                    </div>
                `;
            }

            html += `
                <div class="score-item upper-total">
                    <span class="score-name">Upper Total</span>
                    <span class="score-value">${ut}</span>
                </div>
            `;

            const b = bonus(scores);
            const ok = ut >= 63 ? '✅' : '❌';
            html += `
                <div class="score-item bonus">
                    <span class="score-name">Bonus (63+) ${ok}</span>
                    <span class="score-value">${b}</span>
                </div>
            `;

            for (const id of LOWER_IDS) {
                const cat = CATEGORIES.find(c => c.id === id);
                const val = scores[id];
                const used = val !== undefined && val !== null;

                let cls = 'score-item';
                if (used) cls += ' used';
                else {
                    const canScore = player === 'player' &&
                        game.turn === 'player' &&
                        game.pRolls > 0 &&
                        game.waitingScore &&
                        !game.gameOver;
                    if (canScore) cls += ' available';
                }

                let extra = '';
                if (player === 'ai' && game.aiLastCat && game.aiLastCat.id === id && used && game.aiLastScore !== null) {
                    cls += ' ai-selected';
                    extra = `<span class="score-extra">${game.aiLastScore}</span>`;
                }

                html += `
                    <div class="${cls}" data-cat="${id}" data-player="${player}">
                        <span class="score-name">${cat.name}</span>
                        <span class="score-value">${used ? val : '-'} ${extra}</span>
                    </div>
                `;
            }

            container.innerHTML = html;
            totalEl.textContent = total;

            container.querySelectorAll('.score-item.available').forEach(el => {
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const cat = this.dataset.cat;
                    const p = this.dataset.player;
                    if (p === 'player') playerScore(cat);
                });
            });
        }

        function updateRollInfo() {
            if (game.waitingScore) {
                rollInfo.textContent = '📝 Select a category!';
                return;
            }
            if (game.turn === 'player') {
                rollInfo.textContent = `Roll ${game.pRolls} of ${MAX_ROLLS}`;
                rollBtn.disabled = game.pRolls >= MAX_ROLLS || game.gameOver || game.waitingScore;
            } else {
                rollInfo.textContent = `AI Roll ${game.aRolls} of ${MAX_ROLLS}`;
                rollBtn.disabled = true;
            }
        }

        function renderAll() {
            renderDice();
            renderScoreboard('player', playerScoresEl, playerTotalEl);
            renderScoreboard('ai', aiScoresEl, aiTotalEl);
            updateRollInfo();
        }

        function updateScores() {
            game.pTotal = totalScore(game.pScores);
            game.aTotal = totalScore(game.aScores);
            playerTotalEl.textContent = game.pTotal;
            aiTotalEl.textContent = game.aTotal;
        }

        function updateStats() {
            winsSpan.textContent = stats.wins;
            lossesSpan.textContent = stats.losses;
            streakSpan.textContent = stats.streak;
        }

        // ===== RESET =====
        function resetGame() {
            game = {
                pDice: [1, 1, 1, 1, 1],
                pHeld: [false, false, false, false, false],
                pRolls: 0,
                pScores: {},
                pTotal: 0,
                pBonus: false,
                aDice: [1, 1, 1, 1, 1],
                aHeld: [false, false, false, false, false],
                aRolls: 0,
                aScores: {},
                aTotal: 0,
                aBonus: false,
                turn: 'player',
                gameOver: false,
                rolling: false,
                aiThinking: false,
                waitingScore: false,
                aiLastCat: null,
                aiLastScore: null,
                aiFinalDice: null,
                showAiFinal: false,
                playerTurnsRemaining: 13,
                aiTurnsRemaining: 13,
            };
            statusDisplay.innerHTML = '🎯 Your turn! Roll the dice!';
            rollBtn.disabled = false;
            renderAll();
            updateScores();
        }

        function aiFirst() {
            resetGame();
            game.turn = 'ai';
            statusDisplay.innerHTML = '🤖 AI goes first…';
            renderAll();
            setTimeout(aiTurn, 600);
        }

        // ===== EVENTS =====
        diceContainer.addEventListener('click', (e) => {
            const die = e.target.closest('.die');
            if (!die) return;
            const idx = parseInt(die.dataset.index);
            if (game.turn === 'player' && !game.waitingScore) {
                toggleHold(idx);
            } else if (game.waitingScore) {
                statusDisplay.innerHTML = '📝 Score first! Click a category above.';
            }
        });

        rollBtn.addEventListener('click', playerRoll);
        resetBtn.addEventListener('click', resetGame);
        aiFirstBtn.addEventListener('click', aiFirst);

        soundBtn.addEventListener('click', () => {
            soundOn = !soundOn;
            soundBtn.textContent = soundOn ? '🔊 Sound' : '🔇 Muted';
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                if (!game.gameOver && game.turn === 'player' && !game.waitingScore) {
                    playerRoll();
                }
                e.preventDefault();
            }
            if (e.key === ' ' || e.key === 'Enter') {
                if (game.gameOver) resetGame();
                e.preventDefault();
            }
            const n = parseInt(e.key);
            if (n >= 1 && n <= 5) {
                if (game.turn === 'player' && !game.waitingScore) {
                    toggleHold(n - 1);
                }
                e.preventDefault();
            }
        });

        // ===== START =====
        initAudio();
        resetGame();

        const orig = playSound;
        playSound = function(t) { try { orig(t); } catch (e) {} };
    </script>
</body>
</html>
