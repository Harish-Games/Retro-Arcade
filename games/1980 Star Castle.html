<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Castle – 12‑Segment Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        .game-wrapper {
            background: #12121f;
            padding: 20px 30px 25px;
            border-radius: 16px;
            border: 1px solid #2a2a4a;
            box-shadow: 0 0 60px rgba(0, 150, 255, 0.08);
        }
        canvas {
            display: block;
            margin: 0 auto;
            border: 2px solid #2a2a5a;
            border-radius: 8px;
            background: #0b0b18;
            cursor: none;
            width: 600px;
            height: 600px;
        }
        .info {
            display: flex;
            justify-content: space-between;
            color: #aac0ff;
            font-size: 18px;
            font-weight: bold;
            margin-top: 14px;
            padding: 0 10px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(80, 160, 255, 0.2);
        }
        .info span {
            color: #ffcc77;
        }
        .info .level {
            color: #88ddff;
        }
        .info .rings-left {
            color: #ffaa88;
        }
        .controls {
            color: #5577aa;
            font-size: 14px;
            margin-top: 8px;
            text-align: center;
            border-top: 1px solid #1a1a3a;
            padding-top: 10px;
        }
        .controls kbd {
            background: #1a1a3a;
            padding: 2px 10px;
            border-radius: 4px;
            border: 1px solid #3a3a6a;
            color: #cce;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="info">
            <div>🏆 SCORE <span id="scoreDisplay">0</span></div>
            <div class="level">🌀 LEVEL <span id="levelDisplay">1</span></div>
            <div class="rings-left">⭕ RINGS <span id="ringsDisplay">3</span></div>
            <div>❤️ LIVES <span id="livesDisplay">3</span></div>
        </div>
        <div class="controls">
            <kbd>←</kbd> <kbd>→</kbd> rotate &nbsp;|&nbsp; <kbd>↑</kbd> thrust &nbsp;|&nbsp; <kbd>SPACE</kbd> fire &nbsp;|&nbsp; <kbd>P</kbd> pause
        </div>
    </div>

    <script>
        // ----- SETUP -----
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const livesSpan = document.getElementById('livesDisplay');
        const levelSpan = document.getElementById('levelDisplay');
        const ringsSpan = document.getElementById('ringsDisplay');

        const W = 600,
            H = 600;
        const CX = W / 2,
            CY = H / 2;
        const MARGIN = 20;
        const SEGMENTS = 12;
        const SEG_ANGLE = (2 * Math.PI) / SEGMENTS;

        // ----- AUDIO -----
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                switch (type) {
                    case 'shoot':
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(880, now);
                        osc.frequency.exponentialRampToValueAtTime(440, now + 0.08);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                        osc.start(now);
                        osc.stop(now + 0.08);
                        break;
                    case 'explosion':
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                        osc.start(now);
                        osc.stop(now + 0.3);
                        break;
                    case 'cannonShoot':
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(1200, now);
                        osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                    case 'gameOver':
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(440, now);
                        osc.frequency.exponentialRampToValueAtTime(110, now + 0.6);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                        osc.start(now);
                        osc.stop(now + 0.6);
                        break;
                    default:
                        break;
                }
            } catch (e) {}
        }

        // ----- GAME STATE -----
        let gameOver = false;
        let score = 0;
        let lives = 3;
        let level = 1;
        let paused = false;
        let transitioning = false;
        let transitionTimer = 0;
        let showLevelTimer = 0;
        let levelDisplayText = '';

        // ----- SHIP -----
        const ship = {
            x: CX + 180,
            y: CY,
            radius: 12,
            angle: -Math.PI / 2,
            vx: 0,
            vy: 0,
            thrustPower: 0.12,
            friction: 0.99,
            maxSpeed: 5,
            turnSpeed: 0.05,
            invincible: 0,
            shootCooldown: 0,
            shootDelay: 10, // frames between shots
        };

        // ----- BULLETS -----
        let playerBullets = [];
        let cannonBullets = [];
        const MAX_BULLETS = 5;
        const BULLET_SPEED = 7;
        const BULLET_LIFE = 60;
        const CANNON_BULLET_SPEED = 5;

        // ----- RINGS (12-segment model) -----
        let rings = [];

        function createRing(radius, speed) {
            return {
                radius: radius,
                segments: new Array(SEGMENTS).fill(2), // 2 = solid, 1 = damaged, 0 = gap
                angle: 0,
                speed: speed,
                alive: true,
            };
        }

        function createRings(level) {
            const numRings = Math.min(3 + Math.floor(level / 2), 6);
            const newRings = [];
            const directions = [1, -1, 1];
            for (let i = 0; i < numRings; i++) {
                const radius = 60 + i * 28;
                const baseSpeed = 0.008 + (level - 1) * 0.002;
                const dir = directions[i % directions.length];
                const ring = createRing(radius, dir * baseSpeed * (1 + i * 0.2));
                ring.angle = i * 0.5;
                newRings.push(ring);
            }
            return newRings;
        }

        // ----- HELPER: Map world angle to segment index -----
        function getSegmentIndex(ring, worldAngle) {
            let localAngle = ((worldAngle - ring.angle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
            return Math.floor(localAngle / SEG_ANGLE) % SEGMENTS;
        }

        // ----- COLLISION & LINE OF SIGHT -----
        function isPointInRing(ring, worldAngle) {
            const idx = getSegmentIndex(ring, worldAngle);
            return ring.segments[idx] > 0;
        }

        function lineOfSightClear(worldAngle) {
            for (let ring of rings) {
                if (!ring.alive) continue;
                if (isPointInRing(ring, worldAngle)) {
                    return false;
                }
            }
            return true;
        }

        function checkRingCollision(player) {
            if (player.invincible > 0) return false;
            const d = Math.hypot(player.x - CX, player.y - CY);
            for (let ring of rings) {
                if (!ring.alive) continue;
                if (Math.abs(d - ring.radius) < player.radius + 3) {
                    const angle = Math.atan2(player.y - CY, player.x - CX);
                    if (isPointInRing(ring, angle)) {
                        return true;
                    }
                }
            }
            return false;
        }

        // ----- PARTICLES & STARS -----
        let particles = [];
        let stars = [];

        function initStars() {
            stars = [];
            for (let i = 0; i < 80; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    size: 0.5 + Math.random() * 1.5,
                    brightness: 0.4 + Math.random() * 0.6,
                });
            }
        }
        initStars();

        // ----- CANNON -----
        const cannon = {
            angle: 0,
            cooldown: 0,
            cooldownMax: 25,
            speed: 0.03,
        };

        // ----- INPUT -----
        const keys = { left: false, right: false, up: false, space: false };

        // ----- HELPERS -----
        function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

        function randomBetween(min, max) { return Math.random() * (max - min) + min; }

        function angleDiff(a, b) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }

        // ----- BOUNCE SHIP OFF EDGES -----
        function bounceShip() {
            if (ship.x - ship.radius < MARGIN) {
                ship.x = MARGIN + ship.radius;
                ship.vx = -ship.vx * 0.8;
            } else if (ship.x + ship.radius > W - MARGIN) {
                ship.x = W - MARGIN - ship.radius;
                ship.vx = -ship.vx * 0.8;
            }
            if (ship.y - ship.radius < MARGIN) {
                ship.y = MARGIN + ship.radius;
                ship.vy = -ship.vy * 0.8;
            } else if (ship.y + ship.radius > H - MARGIN) {
                ship.y = H - MARGIN - ship.radius;
                ship.vy = -ship.vy * 0.8;
            }
        }

        function bulletOutOfBounds(b) {
            return b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20;
        }

        // ----- LEVEL MANAGEMENT -----
        function resetLevel() {
            ship.x = CX + 180;
            ship.y = CY;
            ship.vx = 0;
            ship.vy = 0;
            ship.invincible = 90;
            ship.shootCooldown = 0;
            playerBullets = [];
            cannonBullets = [];
            particles = [];
            rings = createRings(level);
            cannon.cooldown = 0;
            cannon.speed = 0.025 + (level - 1) * 0.005;
            cannon.cooldownMax = Math.max(15, 30 - level * 2);
            showLevelTimer = 80;
            levelDisplayText = `LEVEL ${level}`;
            updateUI();
        }

        function resetGame() {
            gameOver = false;
            score = 0;
            lives = 3;
            level = 1;
            paused = false;
            transitioning = false;
            initStars();
            resetLevel();
            updateUI();
        }

        function loseLife() {
            playSound('explosion');
            lives--;
            updateUI();
            if (lives <= 0) {
                gameOver = true;
                playSound('gameOver');
                return;
            }
            ship.x = CX + 180;
            ship.y = CY;
            ship.vx = 0;
            ship.vy = 0;
            ship.invincible = 120;
            ship.shootCooldown = 0;
            playerBullets = [];
            cannonBullets = [];
            particles = [];
        }

        function updateUI() {
            scoreSpan.textContent = score;
            livesSpan.textContent = lives;
            levelSpan.textContent = level;
            const aliveRings = rings.filter(r => r.alive).length;
            ringsSpan.textContent = aliveRings;
        }

        // ----- SHOOTING -----
        function playerShoot() {
            if (playerBullets.length >= MAX_BULLETS) return;
            if (ship.shootCooldown > 0) return;
            playSound('shoot');
            playerBullets.push({
                x: ship.x + Math.cos(ship.angle) * (ship.radius + 4),
                y: ship.y + Math.sin(ship.angle) * (ship.radius + 4),
                vx: Math.cos(ship.angle) * BULLET_SPEED + ship.vx * 0.3,
                vy: Math.sin(ship.angle) * BULLET_SPEED + ship.vy * 0.3,
                life: BULLET_LIFE,
                radius: 3,
                active: true,
            });
            ship.shootCooldown = 10; // frames between shots
        }

        function cannonFire() {
            if (cannon.cooldown > 0) return;
            const angleToShip = Math.atan2(ship.y - CY, ship.x - CX);
            if (!lineOfSightClear(angleToShip)) return;
            playSound('cannonShoot');
            const speed = CANNON_BULLET_SPEED + level * 0.2;
            cannonBullets.push({
                x: CX + Math.cos(angleToShip) * 35,
                y: CY + Math.sin(angleToShip) * 35,
                vx: Math.cos(angleToShip) * speed,
                vy: Math.sin(angleToShip) * speed,
                life: 200,
                radius: 4,
                active: true,
            });
            cannon.cooldown = cannon.cooldownMax;
        }

        // ----- UPDATE -----
        function update() {
            if (gameOver || paused) return;
            if (transitioning) {
                transitionTimer--;
                if (transitionTimer <= 0) {
                    transitioning = false;
                    level++;
                    resetLevel();
                }
                return;
            }
            if (showLevelTimer > 0) showLevelTimer--;

            // Ship rotation
            if (keys.left) ship.angle -= ship.turnSpeed;
            if (keys.right) ship.angle += ship.turnSpeed;

            // Ship thrust
            if (keys.up) {
                const thrustX = Math.cos(ship.angle) * ship.thrustPower;
                const thrustY = Math.sin(ship.angle) * ship.thrustPower;
                ship.vx += thrustX;
                ship.vy += thrustY;
                const spd = Math.hypot(ship.vx, ship.vy);
                if (spd > ship.maxSpeed) {
                    ship.vx = (ship.vx / spd) * ship.maxSpeed;
                    ship.vy = (ship.vy / spd) * ship.maxSpeed;
                }
                for (let i = 0; i < 2; i++) {
                    const angleOffset = randomBetween(-0.3, 0.3);
                    const dir = ship.angle + Math.PI + angleOffset;
                    const speed = randomBetween(0.5, 1.5);
                    particles.push({
                        x: ship.x - Math.cos(ship.angle) * (ship.radius + 2) + Math.cos(dir) * 6,
                        y: ship.y - Math.sin(ship.angle) * (ship.radius + 2) + Math.sin(dir) * 6,
                        vx: Math.cos(dir) * speed + ship.vx * 0.1,
                        vy: Math.sin(dir) * speed + ship.vy * 0.1,
                        life: 20 + Math.random() * 20,
                        maxLife: 40,
                        radius: 2 + Math.random() * 4,
                        color: `hsl(${30 + Math.random() * 30}, 100%, ${50 + Math.random() * 30}%)`,
                    });
                }
            } else {
                ship.vx *= ship.friction;
                ship.vy *= ship.friction;
                if (Math.abs(ship.vx) < 0.01) ship.vx = 0;
                if (Math.abs(ship.vy) < 0.01) ship.vy = 0;
            }

            ship.x += ship.vx;
            ship.y += ship.vy;
            bounceShip();

            if (ship.invincible > 0) ship.invincible--;
            if (ship.shootCooldown > 0) ship.shootCooldown--;

            // Player shooting
            if (keys.space) {
                playerShoot();
            }

            // Cannon tracking
            const targetAngle = Math.atan2(ship.y - CY, ship.x - CX);
            let diff = angleDiff(cannon.angle, targetAngle);
            const maxTurn = cannon.speed;
            if (Math.abs(diff) > maxTurn) {
                cannon.angle += Math.sign(diff) * maxTurn;
            } else {
                cannon.angle = targetAngle;
            }
            if (cannon.cooldown > 0) cannon.cooldown--;
            cannonFire();

            // ---- Player bullets vs rings ----
            for (let i = playerBullets.length - 1; i >= 0; i--) {
                const b = playerBullets[i];
                if (!b || !b.active) {
                    playerBullets.splice(i, 1);
                    continue;
                }

                b.x += b.vx;
                b.y += b.vy;
                b.life--;

                if (b.life <= 0 || bulletOutOfBounds(b)) {
                    playerBullets.splice(i, 1);
                    continue;
                }

                let hit = false;
                const distToCenter = Math.hypot(b.x - CX, b.y - CY);
                for (let ring of rings) {
                    if (!ring.alive) continue;
                    if (Math.abs(distToCenter - ring.radius) < b.radius + 3) {
                        const angle = Math.atan2(b.y - CY, b.x - CX);
                        const idx = getSegmentIndex(ring, angle);
                        if (ring.segments[idx] > 0) {
                            ring.segments[idx]--;
                            if (ring.segments[idx] === 0) {
                                if (ring.segments.every(s => s === 0)) {
                                    ring.alive = false;
                                }
                            }
                            hit = true;
                            score += 5;
                            updateUI();
                            for (let p = 0; p < 12; p++) {
                                const a = randomBetween(0, 2 * Math.PI);
                                const s = randomBetween(1, 4);
                                particles.push({
                                    x: b.x,
                                    y: b.y,
                                    vx: Math.cos(a) * s,
                                    vy: Math.sin(a) * s,
                                    life: 15 + Math.random() * 15,
                                    maxLife: 30,
                                    radius: 2 + Math.random() * 3,
                                    color: '#ffcc44',
                                });
                            }
                            playSound('explosion');
                            break;
                        }
                    }
                }
                if (hit) {
                    playerBullets.splice(i, 1);
                }
            }

            // ---- Cannon bullets vs player ----
            for (let i = cannonBullets.length - 1; i >= 0; i--) {
                const b = cannonBullets[i];
                if (!b || !b.active) {
                    cannonBullets.splice(i, 1);
                    continue;
                }

                b.x += b.vx;
                b.y += b.vy;
                b.life--;

                if (b.life <= 0 || bulletOutOfBounds(b)) {
                    cannonBullets.splice(i, 1);
                    continue;
                }

                if (ship.invincible === 0) {
                    if (dist(b, ship) < b.radius + ship.radius) {
                        cannonBullets.splice(i, 1);
                        loseLife();
                        if (gameOver) return;
                    }
                }
            }

            // ---- Ship vs rings ----
            if (ship.invincible === 0) {
                if (checkRingCollision(ship)) {
                    loseLife();
                    if (gameOver) return;
                }
            }

            // ---- Check if all rings destroyed ----
            const aliveRings = rings.filter(r => r.alive).length;
            if (aliveRings === 0 && !transitioning) {
                transitioning = true;
                transitionTimer = 60;
                score += 500;
                playSound('explosion');
                updateUI();
                for (let i = 0; i < 60; i++) {
                    const a = randomBetween(0, 2 * Math.PI);
                    const s = randomBetween(2, 6);
                    particles.push({
                        x: CX + randomBetween(-20, 20),
                        y: CY + randomBetween(-20, 20),
                        vx: Math.cos(a) * s,
                        vy: Math.sin(a) * s,
                        life: 30 + Math.random() * 30,
                        maxLife: 60,
                        radius: 3 + Math.random() * 4,
                        color: `hsl(${40 + Math.random() * 20}, 100%, 60%)`,
                    });
                }
            }

            // ---- Rotate rings ----
            for (let ring of rings) {
                if (!ring.alive) continue;
                ring.angle += ring.speed;
            }

            // ---- Update particles ----
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                if (!p) {
                    particles.splice(i, 1);
                    continue;
                }
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            updateUI();
        }

        // ----- DRAW -----
        function draw() {
            ctx.clearRect(0, 0, W, H);
            // Stars
            for (let star of stars) {
                ctx.globalAlpha = star.brightness;
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 2;
                ctx.shadowColor = '#ffffff';
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, 2 * Math.PI);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            // Draw rings (12-segment)
            for (let ring of rings) {
                if (!ring.alive) continue;
                const radius = ring.radius;
                for (let i = 0; i < SEGMENTS; i++) {
                    const val = ring.segments[i];
                    if (val === 0) continue;

                    const startAngle = i * SEG_ANGLE + ring.angle;
                    const endAngle = (i + 1) * SEG_ANGLE + ring.angle;

                    if (val === 2) {
                        ctx.strokeStyle = '#ffcc44';
                        ctx.shadowColor = '#ffcc44';
                        ctx.shadowBlur = 15;
                    } else {
                        ctx.strokeStyle = '#cc8833';
                        ctx.shadowColor = '#cc8833';
                        ctx.shadowBlur = 8;
                    }
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    const steps = 10;
                    const stepSize = (endAngle - startAngle) / steps;
                    for (let j = 0; j <= steps; j++) {
                        const a = startAngle + j * stepSize;
                        const x = CX + Math.cos(a) * radius;
                        const y = CY + Math.sin(a) * radius;
                        if (j === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }
            }
            ctx.shadowBlur = 0;

            // Cannon
            ctx.fillStyle = '#ff4444';
            ctx.shadowColor = '#ff4444';
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.arc(CX, CY, 8, 0, 2 * Math.PI);
            ctx.fill();
            ctx.shadowBlur = 20;
            ctx.strokeStyle = '#ff6644';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(CX, CY);
            const tipX = CX + Math.cos(cannon.angle) * 35;
            const tipY = CY + Math.sin(cannon.angle) * 35;
            ctx.lineTo(tipX, tipY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Player bullets
            for (let b of playerBullets) {
                if (!b || !b.active) continue;
                ctx.fillStyle = '#66ffcc';
                ctx.shadowColor = '#66ffcc';
                ctx.shadowBlur = 16;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, 2 * Math.PI);
                ctx.fill();
            }

            // Cannon bullets
            for (let b of cannonBullets) {
                if (!b || !b.active) continue;
                ctx.fillStyle = '#ff6666';
                ctx.shadowColor = '#ff6666';
                ctx.shadowBlur = 18;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, 2 * Math.PI);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // Ship
            if (ship.invincible === 0 || Math.floor(performance.now() / 80) % 2 === 0) {
                ctx.save();
                ctx.translate(ship.x, ship.y);
                ctx.rotate(ship.angle);
                ctx.shadowColor = '#66ddff';
                ctx.shadowBlur = 20;
                ctx.strokeStyle = '#66ddff';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(ship.radius, 0);
                ctx.lineTo(-ship.radius * 0.6, -ship.radius * 0.6);
                ctx.lineTo(-ship.radius * 0.3, 0);
                ctx.lineTo(-ship.radius * 0.6, ship.radius * 0.6);
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }

            // Particles
            for (let p of particles) {
                if (!p) continue;
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.fillStyle = p.color || '#ffaa44';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff8822';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius * (p.life / p.maxLife), 0, 2 * Math.PI);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            // Level display
            if (showLevelTimer > 0) {
                const progress = 1 - showLevelTimer / 80;
                const scale = 0.5 + progress * 1.5;
                const alpha = Math.min(1, progress * 2) * (1 - (1 - progress) * 0.5);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `bold ${48 * scale}px "Courier New", monospace`;
                ctx.shadowColor = '#88ddff';
                ctx.shadowBlur = 40;
                ctx.fillStyle = '#88ddff';
                ctx.fillText(levelDisplayText, W / 2, H / 2 - 20);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#aaccff';
                ctx.font = '18px "Courier New", monospace';
                ctx.fillText('Destroy the rings!', W / 2, H / 2 + 50);
                ctx.restore();
            }

            // Transition
            if (transitioning) {
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(0, 0, W, H);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = '#66ffaa';
                ctx.shadowBlur = 40;
                ctx.fillStyle = '#66ffaa';
                ctx.font = 'bold 52px "Courier New", monospace';
                ctx.fillText('LEVEL UP!', W / 2, H / 2);
                ctx.shadowBlur = 0;
            }

            // Pause
            if (paused) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, W, H);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = '#ffaa44';
                ctx.shadowBlur = 30;
                ctx.fillStyle = '#ffaa44';
                ctx.font = 'bold 48px "Courier New", monospace';
                ctx.fillText('⏸ PAUSED', W / 2, H / 2);
                ctx.shadowBlur = 0;
            }

            // Game Over
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, W, H);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = '#ff3366';
                ctx.shadowBlur = 30;
                ctx.fillStyle = '#ff4477';
                ctx.font = 'bold 56px "Courier New", monospace';
                ctx.fillText('💀 GAME OVER', W / 2, H / 2 - 60);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffcc77';
                ctx.font = '24px "Courier New", monospace';
                ctx.fillText(`Score: ${score}`, W / 2, H / 2 + 10);
                ctx.fillStyle = '#aaccff';
                ctx.font = '20px "Courier New", monospace';
                ctx.fillText('Press any key to restart', W / 2, H / 2 + 60);
            }
        }

        // ----- GAME LOOP -----
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ----- EVENTS -----
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === 'ArrowLeft') { keys.left = true;
                e.preventDefault(); }
            if (key === 'ArrowRight') { keys.right = true;
                e.preventDefault(); }
            if (key === 'ArrowUp') { keys.up = true;
                e.preventDefault(); }
            if (key === ' ') { keys.space = true;
                e.preventDefault(); }
            if (key === 'p' || key === 'P') { paused = !paused;
                e.preventDefault(); }
            if (gameOver && (key === ' ' || key === 'Enter' || key === 'r')) {
                resetGame();
                e.preventDefault();
            }
            initAudio();
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key;
            if (key === 'ArrowLeft') { keys.left = false;
                e.preventDefault(); }
            if (key === 'ArrowRight') { keys.right = false;
                e.preventDefault(); }
            if (key === 'ArrowUp') { keys.up = false;
                e.preventDefault(); }
            if (key === ' ') { keys.space = false;
                e.preventDefault(); }
        });

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'p', 'P'].includes(e.key)) {
                e.preventDefault();
            }
        });

        // ----- START -----
        resetGame();
        gameLoop();
    </script>
</body>
</html>
