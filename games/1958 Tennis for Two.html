<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1958 Tennis for Two</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin: 5px 0;
            font-size: 24px;
            letter-spacing: 2px;
        }

        #controls-info {
            display: flex;
            justify-content: space-between;
            width: 640px;
            font-size: 14px;
            color: #88ff88;
            margin-bottom: 10px;
        }

        #scoreboard {
            display: flex;
            justify-content: center;
            gap: 50px;
            width: 640px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #canvasContainer {
            position: relative;
            border: 4px solid #33aa33;
            border-radius: 50%; /* Gives it that classic round oscilloscope CRT look */
            overflow: hidden;
            background-color: #001100;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
        }

        canvas {
            display: block;
        }

        /* Oscilloscope grid overlay effect */
        #canvasContainer::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,255,0,0.03) 50%, rgba(0,0,0,0.1) 50%),
                        linear-gradient(90deg, rgba(0,255,0,0.03) 50%, rgba(0,0,0,0.1) 50%);
            background-size: 20px 20px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>TENNIS FOR TWO (1958)</h1>
    
    <div id="scoreboard">
        <div>PLAYER 1: <span id="p1Score">0</span></div>
        <div>PLAYER 2: <span id="p2Score">0</span></div>
    </div>

    <div id="canvasContainer">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </div>

    <div id="controls-info">
        <div>[W] Player 1 Hit / Serve</div>
        <div>Player 2 Hit / Serve [Up Arrow]</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const p1ScoreEl = document.getElementById('p1Score');
        const p2ScoreEl = document.getElementById('p2Score');

        // Game Configuration
        const GRAVITY = 0.15;
        const NET_HEIGHT = 40;
        const GROUND_Y = 450;
        const NET_X = canvas.width / 2;
        
        // Scores
        let p1Score = 0;
        let p2Score = 0;

        // Ball Properties
        let ball = {
            x: 150,
            y: 300,
            vx: 0,
            vy: 0,
            radius: 6,
            bounceCount: 0,
            active: false, // Waiting for serve
            lastSide: 1    // 1 = Left, 2 = Right
        };

        // Input Tracking (to prevent holding down keys)
        let keysPressed = {};

        window.addEventListener('keydown', e => {
            if (keysPressed[e.code]) return; // Block repeating inputs
            keysPressed[e.code] = true;

            // Prevent space/arrows from scrolling
            if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();

            handleInput(e.code);
        });

        window.addEventListener('keyup', e => {
            keysPressed[e.code] = false;
        });

        function resetBall(servingPlayer) {
            ball.active = false;
            ball.bounceCount = 0;
            ball.vy = 0;
            ball.vx = 0;
            ball.y = GROUND_Y - 10;
            
            if (servingPlayer === 1) {
                ball.x = 80;
                ball.lastSide = 1;
            } else {
                ball.x = canvas.width - 80;
                ball.lastSide = 2;
            }
        }

        function handleInput(code) {
            let ballSide = ball.x < NET_X ? 1 : 2;

            // Player 1 Hit (W key)
            if (code === 'KeyW') {
                if (!ball.active && ball.lastSide === 1) {
                    // Serve
                    ball.active = true;
                    ball.vx = 4 + Math.random() * 2; // Forward speed
                    ball.vy = -6 - Math.random() * 3; // Upward speed
                } else if (ball.active && ballSide === 1) {
                    // Normal Hit
                    ball.vx = 3.5 + Math.random() * 3; 
                    ball.vy = -5 - Math.random() * 4;
                    ball.bounceCount = 0;
                }
            }

            // Player 2 Hit (Arrow Up)
            if (code === 'ArrowUp') {
                if (!ball.active && ball.lastSide === 2) {
                    // Serve
                    ball.active = true;
                    ball.vx = -4 - Math.random() * 2;
                    ball.vy = -6 - Math.random() * 3;
                } else if (ball.active && ballSide === 2) {
                    // Normal Hit
                    ball.vx = -3.5 - Math.random() * 3;
                    ball.vy = -5 - Math.random() * 4;
                    ball.bounceCount = 0;
                }
            }
        }

        function update() {
            if (!ball.active) return;

            // Apply Physics (Gravity)
            ball.vy += GRAVITY;
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Floor Collision
            if (ball.y + ball.radius >= GROUND_Y) {
                ball.y = GROUND_Y - ball.radius;
                ball.vy = -ball.vy * 0.75; // Dampen bounce energy (velocity retention)
                ball.bounceCount++;

                // If ball bounces twice on one side, opposing player scores
                if (ball.bounceCount >= 2) {
                    if (ball.x < NET_X) {
                        p2Score++;
                        resetBall(1); // P1 serves next
                    } else {
                        p1Score++;
                        resetBall(2); // P2 serves next
                    }
                    updateUI();
                    return;
                }
            }

            // Net Collision
            if (Math.abs(ball.x - NET_X) < ball.radius + 2) {
                // Check if ball height is lower than the top of the net
                if (ball.y > GROUND_Y - NET_HEIGHT) {
                    // It hit the net! Bounce backward
                    ball.vx = -ball.vx * 0.5;
                    ball.bounceCount = 0; // Reset bounce count on net collision
                }
            }

            // Out of Bounds Checks
            if (ball.x < 0) {
                p2Score++;
                updateUI();
                resetBall(1);
            } else if (ball.x > canvas.width) {
                p1Score++;
                updateUI();
                resetBall(2);
            }
        }

        function updateUI() {
            p1ScoreEl.innerText = p1Score;
            p2ScoreEl.innerText = p2Score;
        }

        // Phosphor Trail Simulation Arrays
        let trail = [];

        function draw() {
            // Dark green phosphor clearing effect to create trailing blur
            ctx.fillStyle = 'rgba(0, 15, 0, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Scope Reticle Crosshairs (Very subtle)
            ctx.strokeStyle = 'rgba(0, 80, 0, 0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2); ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();

            // Draw Court Line (Ground)
            ctx.strokeStyle = '#33ff33';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#33ff33';
            
            ctx.beginPath();
            ctx.moveTo(50, GROUND_Y);
            ctx.lineTo(canvas.width - 50, GROUND_Y);
            ctx.stroke();

            // Draw Net
            ctx.beginPath();
            ctx.moveTo(NET_X, GROUND_Y);
            ctx.lineTo(NET_X, GROUND_Y - NET_HEIGHT);
            ctx.stroke();

            // Manage and Draw Glowing Phosphor Trail
            if (ball.active) {
                trail.push({x: ball.x, y: ball.y});
                if (trail.length > 8) trail.shift();
            } else {
                trail = [];
            }

            // Draw Trail lines
            ctx.strokeStyle = 'rgba(51, 255, 51, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < trail.length; i++) {
                if (i === 0) ctx.moveTo(trail[i].x, trail[i].y);
                else ctx.lineTo(trail[i].x, trail[i].y);
            }
            ctx.stroke();

            // Draw Ball
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ffffff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // Reset shadows for performance
            ctx.shadowBlur = 0;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Start game with Player 1 serving
        resetBall(1);
        loop();
    </script>
</body>
</html>
