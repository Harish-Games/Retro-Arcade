<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Defender (Balanced, Classic Bullets)</title>
<style>
  body {
    background: black;
    margin: 0;
    overflow: hidden;
    font-family: monospace;
    color: white;
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 16px;
  }
</style>
</head>
<body>

<div id="hud"></div>
<canvas id="game" width="900" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

// WORLD
let worldX = 0;
const WORLD_LENGTH = 6000;

// PLAYER (centered horizontally)
let player = {
  x: W/2,
  y: H/2,
  vx: 0,
  vy: 0,
  accel: 0.45,
  drag: 0.93,
  maxSpeed: 10,
  width: 26,
  height: 10,
  alive: true
};

// BULLETS
let bullets = [];

// ENEMY BULLETS (world space)
let enemyBullets = [];

// ENEMIES
let enemies = [];

// EXPLOSIONS
let explosions = [];

// STARFIELD
let stars = [];

// GAME STATE
let score = 0;
let highScore = parseInt(localStorage.getItem("defenderHighScore") || "0", 10);
let wave = 1;
let keys = {};
let loopID = null;
let shake = 0;

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

function updateHUD(message = "") {
  document.getElementById("hud").innerHTML =
    `Wave: ${wave} | Score: ${score} | High Score: ${highScore} | Enemies: ${enemies.length}<br>${message}`;
}

// INIT STARS
function initStars() {
  stars = [];
  for (let i = 0; i < 150; i++) {
    stars.push({
      x: Math.random() * WORLD_LENGTH,
      y: Math.random() * H,
      layer: Math.random() * 2 + 0.5
    });
  }
}

// SPAWN WAVE (light difficulty)
function spawnWave() {
  enemies = [];
  enemyBullets = [];

  const baseCount = 4 + wave; // light waves
  const type = wave % 4;

  for (let i = 0; i < baseCount; i++) {
    let speed = 1.0 + wave * 0.1;
    if (type === 1) speed *= 1.2;
    if (type === 2) speed *= 0.9;
    if (type === 3) speed *= 1.1;

    enemies.push({
      x: Math.random() * WORLD_LENGTH,
      y: Math.random() * H * 0.8 + H*0.1,
      vx: (Math.random() < 0.5 ? -1 : 1) * speed,
      width: 22,
      height: 18,
      alive: true,
      phase: Math.random() * Math.PI * 2,
      type,
      fireCooldown: wave === 1 ? 150 : Math.max(60, 120 - wave*2) // warm-up + slower fire
    });
  }
}

// PLAYER MOVEMENT (centered horizontally)
function updatePlayer() {
  if (!player.alive) return;

  let accel = player.accel;

  if (keys["ArrowRight"]) player.vx += accel;
  if (keys["ArrowLeft"])  player.vx -= accel;
  if (keys["ArrowUp"])    player.vy -= accel;
  if (keys["ArrowDown"])  player.vy += accel;

  // Reverse thrust
  if (keys["x"] || keys["X"]) player.vx *= -1;

  player.vx *= player.drag;
  player.vy *= player.drag;

  const max = player.maxSpeed;
  player.vx = Math.max(-max, Math.min(max, player.vx));
  player.vy = Math.max(-max, Math.min(max, player.vy));

  // Player stays centered horizontally
  player.x = W / 2;

  // Vertical movement
  player.y += player.vy;
  player.y = Math.max(40, Math.min(H - 40, player.y));

  // Scroll world horizontally based on vx
  worldX += player.vx;
  if (worldX < 0) worldX += WORLD_LENGTH;
  if (worldX > WORLD_LENGTH) worldX -= WORLD_LENGTH;
}

// SHOOTING
function shoot() {
  if (!player.alive) return;
  const speed = 10;
  bullets.push({
    x: player.x + player.width/2,
    y: player.y,
    vx: speed,
    alive: true
  });
}

document.addEventListener("keydown", e => {
  if (e.key === " ") shoot();
});

// UPDATE BULLETS
function updateBullets() {
  bullets.forEach(b => {
    b.x += b.vx;
    if (b.x > W + 50) b.alive = false;
  });
  bullets = bullets.filter(b => b.alive);
}

// UPDATE ENEMY BULLETS (world space)
function updateEnemyBullets() {
  enemyBullets.forEach(b => {
    b.wx += b.vx;
    b.wy += b.vy;

    // wrap or kill if far out of world bounds
    if (b.wx < 0 || b.wx > WORLD_LENGTH || b.wy < -50 || b.wy > H + 50) {
      b.alive = false;
      return;
    }

    const sx = worldToScreen(b.wx);

    if (Math.abs(sx - player.x) < 8 &&
        Math.abs(b.wy - player.y) < 8 &&
        player.alive) {
      player.alive = false;
      spawnExplosion(player.x, player.y);
      shake = 20;
      gameOver("Hit by plasma!");
    }
  });

  enemyBullets = enemyBullets.filter(b => b.alive);
}

// UPDATE ENEMIES
function updateEnemies() {
  enemies.forEach(e => {
    if (!e.alive) return;

    e.phase += 0.05;
    let wobble = Math.sin(e.phase) * 1.5;

    e.x += e.vx;
    e.y += wobble;

    if (e.x < 0) e.x += WORLD_LENGTH;
    if (e.x > WORLD_LENGTH) e.x -= WORLD_LENGTH;

    const sx = worldToScreen(e.x);

    // Softer tracking
    if (player.alive) {
      if (sx < player.x) e.vx += 0.010;
      if (sx > player.x) e.vx -= 0.010;
    }

    // Clamp speed
    e.vx = Math.max(-4 - wave*0.1, Math.min(4 + wave*0.1, e.vx));

    // Enemy firing (slower, with aim error, weak on wave 1)
    e.fireCooldown--;
    if (e.fireCooldown <= 0 && player.alive) {
      e.fireCooldown = wave === 1 ? 150 : Math.max(60, 120 - wave*2);
      fireEnemyBullet(e.x, e.y);
    }

    // Collision with player (more forgiving)
    if (player.alive &&
        Math.abs(sx - player.x) < (e.width/2 - 6) &&
        Math.abs(e.y - player.y) < (e.height/2 - 6)) {
      player.alive = false;
      spawnExplosion(player.x, player.y);
      shake = 20;
      gameOver("You were hit!");
    }

    // Bullet collision
    bullets.forEach(b => {
      if (!b.alive) return;
      if (Math.abs(sx - b.x) < e.width/2 &&
          Math.abs(e.y - b.y) < e.height/2) {
        e.alive = false;
        b.alive = false;
        score += 100;
        spawnExplosion(sx, e.y);
        shake = 10;
      }
    });
  });

  enemies = enemies.filter(e => e.alive);

  if (enemies.length === 0) {
    wave++;
    spawnWave();
  }
}

// ENEMY FIRE (world-space bullets, weak on wave 1)
function fireEnemyBullet(wx, wy) {
  // limit bullets on wave 1
  if (wave === 1 && enemyBullets.length >= 3) return;

  const aimError = (Math.random() - 0.5) * 200;
  const targetX = player.x + aimError;
  const sx = worldToScreen(wx);
  const dx_screen = targetX - sx;
  const dy = player.y - wy;
  const dist = Math.sqrt(dx_screen*dx_screen + dy*dy) || 1;

  const speed = wave === 1 ? 2 : (2 + wave * 0.1);

  // convert dx_screen back to world-space direction
  const dx_world = dx_screen; // small approximation, good enough for feel

  enemyBullets.push({
    wx,
    wy,
    vx: dx_world / dist * speed,
    vy: dy / dist * speed,
    alive: true
  });
}

// EXPLOSIONS
function spawnExplosion(x, y) {
  const parts = [];
  for (let i = 0; i < 20; i++) {
    parts.push({
      x,
      y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      life: Math.random() * 20 + 10
    });
  }
  explosions.push(parts);
}

function updateExplosions() {
  explosions.forEach(parts => {
    parts.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
    });
  });
  explosions = explosions.filter(parts => parts.some(p => p.life > 0));
}

// WORLD → SCREEN
function worldToScreen(wx) {
  let sx = wx - worldX + W/2;
  if (sx < -50) sx += WORLD_LENGTH;
  if (sx > W+50) sx -= WORLD_LENGTH;
  return sx;
}

// DRAW STARFIELD
function drawStars() {
  ctx.save();
  ctx.fillStyle = "white";
  stars.forEach(s => {
    const sx = worldToScreen(s.x * (1/s.layer));
    const sy = s.y;
    ctx.globalAlpha = 0.3 + 0.3/s.layer;
    ctx.fillRect(sx, sy, 2, 2);
  });
  ctx.restore();
}

function drawMiniMap() {
  const mapW = 200;
  const mapH = 80;
  const mapX = W - mapW - 10;
  const mapY = 10;

  // background
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(mapX, mapY, mapW, mapH);

  // terrain silhouette
  ctx.strokeStyle = "#0f8";
  ctx.beginPath();
  for (let i = 0; i < mapW; i++) {
    const wx = (worldX + (i / mapW) * WORLD_LENGTH) % WORLD_LENGTH;
    const h = 80 + Math.sin(wx * 0.001) * 40 + Math.cos(wx * 0.0005) * 30;
    const y = mapY + mapH - (h / 8);
    if (i === 0) ctx.moveTo(mapX + i, y);
    else ctx.lineTo(mapX + i, y);
  }
  ctx.stroke();

  // player marker (always centered)
  ctx.fillStyle = "#0ff";
  ctx.fillRect(mapX + mapW/2 - 2, mapY + mapH/2 - 2, 4, 4);

  // enemies
  ctx.fillStyle = "#f44";
  enemies.forEach(e => {
    const rel = ((e.x - worldX + WORLD_LENGTH) % WORLD_LENGTH) / WORLD_LENGTH;
    const ex = mapX + rel * mapW;
    const ey = mapY + (e.y / H) * mapH;
    ctx.fillRect(ex - 2, ey - 2, 4, 4);
  });

  ctx.restore();
}


// DRAW TERRAIN
function drawTerrain() {
  ctx.save();
  ctx.strokeStyle = "#0f8";
  ctx.lineWidth = 2;
  ctx.shadowColor = "#0f8";
  ctx.shadowBlur = 10;

  ctx.beginPath();
  for (let i = 0; i <= W; i += 20) {
    const wx = worldX + i - W/2;
    const h = 80 + Math.sin(wx * 0.001) * 40 + Math.cos(wx * 0.0005) * 30;
    const y = H - h;
    if (i === 0) ctx.moveTo(i, y);
    else ctx.lineTo(i, y);
  }
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fillStyle = "rgba(0,40,0,0.8)";
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

// DRAW PLAYER (centered)
function drawPlayer() {
  if (!player.alive) return;

  ctx.save();
  ctx.translate(player.x, player.y);

  ctx.shadowColor = "#0ff";
  ctx.shadowBlur = 15;

  ctx.fillStyle = "#0ff";
  ctx.beginPath();
  ctx.moveTo(-player.width/2, -player.height/2);
  ctx.lineTo(player.width/2, 0);
  ctx.lineTo(-player.width/2, player.height/2);
  ctx.closePath();
  ctx.fill();

  const flame = 8;
  ctx.fillStyle = "#f80";
  ctx.beginPath();
  ctx.moveTo(-player.width/2 - flame, 0);
  ctx.lineTo(-player.width/2, -3);
  ctx.lineTo(-player.width/2, 3);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// DRAW ENEMIES
function drawEnemies() {
  ctx.save();
  ctx.shadowColor = "#f44";
  ctx.shadowBlur = 15;

  enemies.forEach(e => {
    const sx = worldToScreen(e.x);
    ctx.save();
    ctx.translate(sx, e.y);

    const pulse = 0.5 + 0.5 * Math.sin(e.phase * 2);
    ctx.fillStyle = `rgba(255,80,80,${0.6 + 0.4*pulse})`;

    ctx.beginPath();
    ctx.moveTo(0, -e.height/2);
    ctx.lineTo(e.width/2, 0);
    ctx.lineTo(0, e.height/2);
    ctx.lineTo(-e.width/2, 0);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  });

  ctx.restore();
}

// DRAW BULLETS (player)
function drawBullets() {
  ctx.save();
  ctx.shadowColor = "#ff0";
  ctx.shadowBlur = 10;
  ctx.fillStyle = "#ff0";
  bullets.forEach(b => {
    ctx.fillRect(b.x, b.y - 2, 10, 4);
  });
  ctx.restore();
}

// DRAW ENEMY BULLETS (classic small dots)
function drawEnemyBullets() {
  ctx.save();
  ctx.shadowColor = "#f0f";
  ctx.shadowBlur = 8;
  ctx.fillStyle = "#f0f";
  enemyBullets.forEach(b => {
    const sx = worldToScreen(b.wx);
    ctx.fillRect(sx - 1, b.wy - 1, 2, 2);
  });
  ctx.restore();
}

// DRAW EXPLOSIONS
function drawExplosions() {
  ctx.save();
  ctx.shadowColor = "#f80";
  ctx.shadowBlur = 20;
  explosions.forEach(parts => {
    parts.forEach(p => {
      if (p.life <= 0) return;
      ctx.globalAlpha = p.life / 30;
      ctx.fillStyle = "#f80";
      ctx.fillRect(p.x, p.y, 3, 3);
    });
  });
  ctx.restore();
}

// GAME OVER
function gameOver(msg) {
  if (score > highScore) {
    highScore = score;
    localStorage.setItem("defenderHighScore", highScore);
  }

  updateHUD(msg + " | Press SPACE to restart");

  ctx.fillStyle = "white";
  ctx.font = "40px monospace";
  ctx.fillText("GAME OVER", W/2 - 140, H/2);
  ctx.fillText(msg, W/2 - 200, H/2 + 40);

  cancelAnimationFrame(loopID);

  document.addEventListener("keydown", restartOnSpace);
}

function restartOnSpace(e) {
  if (e.key === " ") {
    document.removeEventListener("keydown", restartOnSpace);
    restartGame();
  }
}

function restartGame() {
  score = 0;
  wave = 1;
  worldX = 0;
  bullets = [];
  enemyBullets = [];
  explosions = [];
  shake = 0;

  player = {
    x: W/2,
    y: H/2,
    vx: 0,
    vy: 0,
    accel: 0.45,
    drag: 0.93,
    maxSpeed: 10,
    width: 26,
    height: 10,
    alive: true
  };

  spawnWave();
  loopID = requestAnimationFrame(loop);
}

// MAIN LOOP
function loop() {
  updateHUD();

  updatePlayer();
  updateBullets();
  updateEnemyBullets();
  updateEnemies();
  updateExplosions();

  ctx.clearRect(0, 0, W, H);

  if (shake > 0) {
    shake--;
    ctx.save();
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }

  drawStars();
  drawTerrain();
  drawEnemies();
  drawBullets();
  drawEnemyBullets();
  drawPlayer();
  drawExplosions();

  if (shake > 0) ctx.restore();

  loopID = requestAnimationFrame(loop);
}

// START
initStars();
spawnWave();
loopID = requestAnimationFrame(loop);
</script>

</body>
</html>
