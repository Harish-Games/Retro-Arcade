<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manic Miner - Central Cavern</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        .game-wrapper {
            background: #16213e;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.8);
        }
canvas {
    display: block;
    border: 4px solid #e94560;
    border-radius: 12px;
    background: #0f3460;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
}
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="1024" height="768"></canvas>

</div>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 256, H = 192;

    // Render at 4× resolution for crisp text and shapes
    ctx.scale(4, 4);
    ctx.imageSmoothingEnabled = false;

    // ---------- CONSTANTS ----------
    const GRAVITY = 0.6;
    const JUMP_FORCE = -6.0; 	// lower (closer to zero) is lower jump
    const MOVE_SPEED = 1.0;		// movement speed
    const AIR_SPEED  = 1.5;     // air speed — keeps jump distance the same as before
    const FRICTION = 0.6;		// slide after stop speed
    const TILE_SIZE = 8;
    const COLS = 32;
    const ROWS = 24;              // total canvas rows (gameplay + panel)
    const PLAY_ROWS = 18;         // rows 0-16 = gameplay
    const PANEL_TOP = 18;         // rows 17-23 = status panel
    const QUICKSAND_CRUMBLE_SECONDS = 1.0;   // how long you can stand on quicksand before it crumbles
    // ---- MONSTER CONFIG ----
    const MONSTER_W = 10;
    const MONSTER_H = 14;
    
    // ---------- GAME STATE ----------
    const keys = {};
    document.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code === 'Space') e.preventDefault();
        if (e.code === 'KeyR') resetGame();
    });
    document.addEventListener('keyup', (e) => {
        keys[e.code] = false;
    });

    // ---------- LEVEL DEFINITION ----------
    // 0 = empty, 1 = platform, 2 = wall, 3 = deadly, 4 = quicksand
    let level = [];
    let items = [];
    let totalKeys = 5;
    let score = 0;
    let lives = 3;
    let air = 100;
    let gameOver = false;
    let levelComplete = false;
    let highScore = 0;
    let levelName = 'Central Cavern';
    let levelNumber = 1;
    let bgColor = '#0a0a1a';
    let monsters = [];
    
     // ---- LEVEL TRACKING ----
    let currentLevel = 0;         // index into LEVELS array
    const TOTAL_LEVELS = 2;       // update when you add more
    
        // Tracks how many frames each quicksand tile has been stood on
    // Key format: "row,col" — value: frames elapsed
    let quicksandErosion = {};

// ---- EXIT DOOR ----
const door = {
    x: 232, y: 104, w: 16, h: 16, active: false,
};

// ---- PLAYER ----
const player = {
    x: 24,
    y: 104,
    w: 10,
    h: 14,
    vx: 0,
    vy: 0,
    onGround: false,
    facing: 1,
    sinkTimer: 0,
};

    function loadLevel(index) {
        currentLevel = index;
        LEVELS[index].build();
        updateHUD();
    }

    function buildMonsters(spawns) {
        return spawns.map(s => ({
            x: s.colStart * TILE_SIZE,
            y: s.row * TILE_SIZE - MONSTER_H,
            w: MONSTER_W,
            h: MONSTER_H,
            dir: s.dir,
            speed: s.speed,
            minX: s.colStart * TILE_SIZE,
            maxX: (s.colEnd + 1) * TILE_SIZE,
        }));
    }

        function buildLevel1() {
         // ---- INIT GRID ----
                level = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        quicksandErosion = {};

        // ---- LEFT AND RIGHT WALLS (gameplay rows only) ----
        for (let r = 0; r < PLAY_ROWS; r++) {
            level[r][0] = 2;
            level[r][COLS - 1] = 2;
        }

        // ---- GROUND (row 15) ----
        for (let c = 0; c < COLS; c++) {
            level[PLAY_ROWS - 1][c] = 1;
        }

        // ---- PLATFORMS ----
        // Low tier
        for (let c = 6;  c <= 18; c++) level[14][c] = 1;
        for (let c = 19; c <= 22; c++) level[13][c] = 2;
		for (let c = 23; c <= 26; c++) level[13][c] = 4;
		for (let c = 27; c <= 30; c++) level[13][c] = 1;

		// Mid tier
		for (let c = 29; c <= 30; c++) level[11][c] = 1;
        for (let c = 1;  c <= 5; c++) level[10][c] = 1;
        for (let c = 9; c <= 27; c++) level[10][c] = 5;
		for (let c = 16; c <= 18; c++) level[9][c] = 2;
		for (let c = 1; c <= 4; c++) level[8][c] = 1;		
		
		// Top tier
        for (let c = 1;  c <= 11; c++) level[5][c] = 1;
        for (let c = 12; c <= 15; c++) level[5][c] = 4;
		for (let c = 16; c <= 18; c++) level[5][c] = 1;
		for (let c = 19; c <= 22; c++) level[5][c] = 4;
		for (let c = 23; c <= 30; c++) level[5][c] = 1;

		// --- MONSTERS ---
		monsters = buildMonsters([
            { colStart: 10, colEnd: 15, row: 10, speed: 0.2, dir: 1 },
        ]);

        // ---- DEADLY TREES ----
        level[13][11]  = 3;
        level[9][20] = 3;
        level[4][23] = 3;
        level[4][27] = 3;
        level[0][9] = 3;
        level[0][15] = 3;

                // ---- KEYS 
        items = [];
        const keyTiles = [
            { col: 30,  row: 6 },
            { col: 7, row: 0 },
            { col: 15,  row: 1 },
            { col: 24, row: 4 },
            { col: 29, row: 0  },
        ];
        keyTiles.forEach((pos, index) => {
            items.push({
                x: pos.col * TILE_SIZE + 1,   // +1 centers 6px key on 8px tile
                y: pos.row * TILE_SIZE + 1,
                w: 6, h: 6,
                collected: false,
                type: 'key',
                id: index
            });
        });
          levelName = 'Central Cavern';
        levelNumber = 1;
          bgColor = '#000000'; 
  
    }  
    
        function buildLevel2() {
        // ---- INIT GRID ----
               level = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        quicksandErosion = {};
        monsters = [];

        // ---- LEFT AND RIGHT WALLS (gameplay rows only) ----
                
        // ---- WALLS ----
        for (let r = 0; r < PLAY_ROWS; r++) {
            level[r][0] = 2;
            level[r][COLS - 1] = 2;
        }

        // ---- GROUND ----
        for (let c = 0; c < COLS; c++) {
            level[PLAY_ROWS - 1][c] = 1;
        }

        // ---- PLATFORMS ---- LEVEL 2
        for (let c = 7;  c <= 10;  c++) level[14][c] = 4;
        for (let c = 13; c <= 16; c++) level[12][c] = 1;
        for (let c = 2; c <= 5; c++) level[11][c] = 5;
        for (let c = 19; c <= 22; c++) level[10][c] = 4;

        for (let c = 8;  c <= 15; c++) level[8][c] = 1;
        for (let c = 1; c <= 1; c++) level[6][c] = 1;
        for (let c = 2; c <= 5; c++) level[6][c] = 4;

        for (let c = 21;  c <= 24; c++) level[4][c] = 1;
        for (let c = 1; c <= 19; c++) level[3][c] = 1;

        for (let c = 21; c <= 24; c++) level[1][c] = 4;

        for (let c = 1; c <= 19; c++) level[3][c] = 1;

		for (let r = 4; r <= 14; r++) level[r][25] = 2;
		for (let r = 3; r <= 14; r++) level[r][28] = 2;
        for (let c = 26; c <= 27; c++) level[14][c] = 4;
        for (let c = 26; c <= 27; c++) level[12][c] = 4;
        for (let c = 26; c <= 27; c++) level[10][c] = 4;
        for (let c = 26; c <= 27; c++) level[8][c] = 4;
        for (let c = 26; c <= 27; c++) level[6][c] = 4;
        for (let c = 26; c <= 27; c++) level[4][c] = 4;

		// --- MONSTERS ---
		monsters = buildMonsters([
            { colStart: 5, colEnd: 23, row: 17, speed: 0.2, dir: 1 },
            { colStart: 5, colEnd: 14, row: 3, speed: 0.2, dir: 1 },
        ]);

          // ---- DEADLY TREES ----
        level[0][30]  = 3;
 
        // ---- KEYS ----
        items = [];
        const keyTiles = [
            { col: 19,  row: 12 },   // lower tier left
            { col: 2, row: 8 },   // lower tier right
            { col: 7,  row: 0 },   // middle tier left
            { col: 24, row: 0  },   // upper tier right
            { col: 26, row: 5  },   // top tier
        ];
        keyTiles.forEach((pos, index) => {
            items.push({
                x: pos.col * TILE_SIZE + 1,
                y: pos.row * TILE_SIZE + 1,
                w: 6, h: 6,
                collected: false,
                type: 'key',
                id: index
            });
        });

        // ---- PLAYER START ----
        player.x = 24;
        player.y = (PLAY_ROWS - 2) * TILE_SIZE;
        player.vx = 0;
        player.vy = 0;
        player.onGround = false;

        // ---- DOOR ----
        door.x = 232;
        door.y = (PLAY_ROWS - 3) * TILE_SIZE;
        door.w = 16;
        door.h = 16;
        door.active = false;

        levelName = 'The Cold Room';
        levelNumber = 2;
                bgColor = '#1A2F9E';
    }
   
         const LEVELS = [
        { build: buildLevel1, name: 'Central Cavern' },
        { build: buildLevel2, name: 'The Cold Room' },
    ];
    
    // ---------- COLLISION DETECTION ----------
  // Returns true if the tile at (col,row) blocks horizontal movement (walls only)
function isSolidHoriz(col, row) {
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return false;
    return level[row][col] === 2;
}

function isOneWaySolid(col, row) {
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return false;
    const t = level[row][col];
    return t === 1 || t === 4 || t === 5;
}

function resolveHorizontal() {
    const left  = Math.floor(player.x / TILE_SIZE);
    const right = Math.floor((player.x + player.w - 0.001) / TILE_SIZE);
    const top   = Math.floor(player.y / TILE_SIZE);
    const bot   = Math.floor((player.y + player.h - 0.001) / TILE_SIZE);

    let hit = false;
    for (let row = top; row <= bot; row++) {
        for (let col = left; col <= right; col++) {
            if (isSolidHoriz(col, row)) { hit = true; break; }
        }
        if (hit) break;
    }

    if (!hit) return;

    if (player.vx > 0) {
        const col = Math.floor((player.x + player.w) / TILE_SIZE);
        player.x = col * TILE_SIZE - player.w - 0.001;
    } else if (player.vx < 0) {
        const col = Math.floor(player.x / TILE_SIZE);
        player.x = (col + 1) * TILE_SIZE + 0.001;
    }
    player.vx = 0;
}

function resolveVertical() {
    const prevFeetY = (player.y - player.vy) + player.h;
    const feetY     = player.y + player.h;
    const left  = Math.floor(player.x / TILE_SIZE);
    const right = Math.floor((player.x + player.w - 0.001) / TILE_SIZE);

    let landed = false;

    if (player.vy >= 0) {
        // ---- FALLING ----
        const startRow = Math.floor(prevFeetY / TILE_SIZE);
        const endRow   = Math.floor(feetY / TILE_SIZE);

        // Normal platforms (tile 1 & quicksand 4)
        for (let row = startRow; row <= endRow; row++) {
            for (let col = left; col <= right; col++) {
                if (!isOneWaySolid(col, row)) continue;
                const tileTop = row * TILE_SIZE;
                if (prevFeetY <= tileTop && feetY >= tileTop) {
                    player.y = tileTop - player.h;
                    player.vy = 0;
                    player.onGround = true;
                    landed = true;
                    break;
                }
            }
            if (landed) break;
        }

        // Walls (tile 2) also block from above
        if (!landed) {
            for (let row = startRow; row <= endRow; row++) {
                for (let col = left; col <= right; col++) {
                    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) continue;
                    if (level[row][col] !== 2) continue;
                    const tileTop = row * TILE_SIZE;
                    if (prevFeetY <= tileTop && feetY >= tileTop) {
                        player.y = tileTop - player.h;
                        player.vy = 0;
                        player.onGround = true;
                        landed = true;
                        break;
                    }
                }
                if (landed) break;
            }
        }
    } else {
        // ---- RISING ----
        const headY     = player.y;
        const prevHeadY = player.y - player.vy;
        const topRow    = Math.floor(headY / TILE_SIZE);
        const stopRow   = Math.floor(prevHeadY / TILE_SIZE);

        // Walls block the head
        for (let row = stopRow; row >= topRow; row--) {
            for (let col = left; col <= right; col++) {
                if (row < 0 || row >= ROWS || col < 0 || col >= COLS) continue;
                if (level[row][col] !== 2) continue;
                const tileBottom = (row + 1) * TILE_SIZE;
                if (prevHeadY >= tileBottom && headY < tileBottom) {
                    player.y = tileBottom;
                    player.vy = 0;
                    break;
                }
            }
        }
    }
}

    // ---------- PHYSICS UPDATE ----------
function updatePlayer() {
    if (gameOver || levelComplete) return;

    // ---- HORIZONTAL MOVEMENT ----
    const speed = player.onGround ? MOVE_SPEED : AIR_SPEED;
    if (keys['ArrowLeft']) {
        player.vx = -speed;
        player.facing = -1;
    } else if (keys['ArrowRight']) {
        player.vx = speed;
        player.facing = 1;
    } else {
        player.vx *= FRICTION;
        if (Math.abs(player.vx) < 0.1) player.vx = 0;
    }

    // ---- DEADLY TILES (tree = tile 3) ----
    // If any tile overlapping the player's bounding box is 3, it's instant death.
    const bodyLeft  = Math.floor(player.x / TILE_SIZE);
    const bodyRight = Math.floor((player.x + player.w - 0.001) / TILE_SIZE);
    const bodyTop   = Math.floor(player.y / TILE_SIZE);
    const bodyBot   = Math.floor((player.y + player.h - 0.001) / TILE_SIZE);

    let touchingDeadly = false;
    for (let r = bodyTop; r <= bodyBot; r++) {
        for (let c = bodyLeft; c <= bodyRight; c++) {
            if (level[r]?.[c] === 3) { touchingDeadly = true; break; }
        }
        if (touchingDeadly) break;
    }

    if (touchingDeadly) {
        loseLife();
        return;   // stop processing this frame — we just respawned
    }

    // ---- UPDATE MONSTERS ----
    updateMonsters();

    // ---- MONSTER COLLISION ----
    for (const m of monsters) {
        if (player.x + player.w > m.x &&
            player.x < m.x + m.w &&
            player.y + player.h > m.y &&
            player.y < m.y + m.h) {
            loseLife();
            return;
        }
    }

    // ---- JUMP ----
    if (keys['Space'] && player.onGround) {
        player.vy = JUMP_FORCE;
        player.onGround = false;
    }

    // ---- CONVEYOR BELT ----
    // If the player's feet are on a tile-5 conveyor, push them sideways.
    if (player.onGround) {
        const feetY = player.y + player.h + 1;
        const leftCol  = Math.floor(player.x / TILE_SIZE);
        const rightCol = Math.floor((player.x + player.w - 0.001) / TILE_SIZE);
        const feetRow  = Math.floor(feetY / TILE_SIZE);
        const CONVEYOR_SPEED = 0.4;   // Conveyor speed

        for (let c = leftCol; c <= rightCol; c++) {
            if (level[feetRow]?.[c] === 5) {
                player.x -= CONVEYOR_SPEED;   // push LEFT
                break;
            }
        }
    }

             // ---- GRAVITY & VERTICAL SPEED ----
    if (!player.onGround) {
        player.vy += GRAVITY;
        if (player.vy > 6.0) player.vy = 6.0;
    } else {
        player.vy = 0;
    }

    // ---- RESET onGround (resolveVertical will set it if we land) ----
    player.onGround = false;

     // ---- MOVE X ----
    player.x += player.vx;
    resolveHorizontal();

    // ---- MOVE Y ----
    // resolveVertical() handles landing, ceilings, quicksand, and drop-through
    player.y += player.vy;
    resolveVertical();

    // ---- QUICKSAND EROSION ----
    // If the player is grounded on a tile 4, erode it away over time.
    if (player.onGround) {
        const feetY = player.y + player.h + 1;   // +1 to reach into the tile below the feet
        const leftCol  = Math.floor(player.x / TILE_SIZE);
        const rightCol = Math.floor((player.x + player.w - 0.001) / TILE_SIZE);
        const feetRow  = Math.floor(feetY / TILE_SIZE);

        for (let c = leftCol; c <= rightCol; c++) {
            if (level[feetRow]?.[c] !== 4) continue;

            const key = feetRow + ',' + c;
            quicksandErosion[key] = (quicksandErosion[key] || 0) + 1;

            // 0.5s at 60fps = 30 frames
            const framesToCrumble = QUICKSAND_CRUMBLE_SECONDS * 60;
            if (quicksandErosion[key] >= framesToCrumble) {
                level[feetRow][c] = 0;       // crumbled — becomes a hole
                delete quicksandErosion[key];
            }
        }
    }

    // ---- KEEP WITHIN BOUNDS ----
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > W) player.x = W - player.w;
    const playBottom = (PLAY_ROWS - 1) * TILE_SIZE;   // y = 120 — TOP of the ground row
    if (player.y + player.h > playBottom) {
        player.y = playBottom - player.h;
        player.onGround = true;
        player.vy = 0;
    }

        if (player.y > playBottom + 50) {
        loseLife();
    }

    // ---- COLLECT ITEMS ----
    items.forEach(item => {
        if (!item.collected) {
            const dx = (player.x + player.w / 2) - (item.x + item.w / 2);
            const dy = (player.y + player.h / 2) - (item.y + item.h / 2);
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 12) {
                item.collected = true;
                score += 100;
                if (score > highScore) highScore = score;
                updateHUD();
            }
        }
    });


        const collectedCount = items.filter(item => item.collected).length;
    if (collectedCount === totalKeys) {
        door.active = true;
    }

    // ---- CHECK FOR EXIT ----
    if (door.active) {
        const hit = player.x < door.x + door.w &&
                    player.x + player.w > door.x &&
                    player.y < door.y + door.h &&
                    player.y + player.h > door.y;
        if (hit) {
            levelComplete = true;
            levelCompleteTimer = 0;   // reset the countdown
        }
    }

    updateHUD();
}

function updateMonsters() {
    for (const m of monsters) {
        m.x += m.dir * m.speed;
        if (m.x <= m.minX) { m.x = m.minX; m.dir = 1; }
        if (m.x + m.w >= m.maxX) { m.x = m.maxX - m.w; m.dir = -1; }
    }
}

    // ---------- GAME FUNCTIONS ----------
    function loseLife() {
        lives--;
        if (lives <= 0) {
            gameOver = true;
        } else {
            // Respawn at start
            player.x = 24;
            player.y = 104;
            player.vx = 0;
            player.vy = 0;
            player.onGround = false;
        }
        updateHUD();
    }

    function resetGame() {
        lives = 3;
        score = 0;
        air = 100;
        gameOver = false;
        levelComplete = false;
        loadLevel(1);               
        updateHUD();
    }

    function updateHUD() {
        // HUD is rendered into the canvas by drawPanel() every frame.
        // This is intentionally a no-op; kept so existing calls don't throw.
    }

    // ---------- RENDER ----------
    
        function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, W, H);

        // ---- TILES ----
        for (let row = 0; row < ROWS; row++) {
            for (let col = 0; col < COLS; col++) {
                const tile = level[row][col];
                const x = col * TILE_SIZE;
                const y = row * TILE_SIZE;

                if (tile === 1) {
                    ctx.fillStyle = '#8B1A1A';
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                    ctx.fillStyle = '#B22222';
                    ctx.fillRect(x, y, TILE_SIZE, 2);
                    ctx.strokeStyle = '#5C1010';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
                    if (row > 0 && level[row-1][col] === 0) {
                        ctx.fillStyle = '#E04A4A';
                        ctx.fillRect(x, y, TILE_SIZE, 1);
                    }
                } else if (tile === 2) {
                    ctx.fillStyle = '#6B3410';
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(x, y, TILE_SIZE, 3);
                    ctx.strokeStyle = '#3D1F08';
                    ctx.lineWidth = 0.5;
                    ctx.beginPath();
                    ctx.moveTo(x, y + 4);
                    ctx.lineTo(x + TILE_SIZE, y + 4);
                    ctx.stroke();
                    const brickRow = Math.floor(y / TILE_SIZE) % 2;
                    const joinX = brickRow === 0 ? x + 4 : x + 2;
                    ctx.beginPath();
                    ctx.moveTo(joinX, y + 4);
                    ctx.lineTo(joinX, y + TILE_SIZE);
                    ctx.stroke();
                    ctx.strokeStyle = '#2A1405';
                    ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
                } else if (tile === 3) {
                    ctx.fillStyle = '#1B5E20';
                    ctx.fillRect(x + 1, y + 3, 6, 4);
                    ctx.fillRect(x + 2, y + 2, 4, 1);
                    ctx.fillStyle = '#2E7D32';
                    ctx.fillRect(x + 2, y + 3, 2, 2);
                    ctx.fillRect(x + 4, y + 5, 2, 2);
                    ctx.fillStyle = '#5C3A1E';
                    ctx.fillRect(x + 3, y + 6, 2, 2);
                    ctx.fillStyle = '#FFEB3B';
                    ctx.fillRect(x + 2, y + 1, 1, 1);
                    ctx.fillRect(x + 5, y + 2, 1, 1);
                    ctx.fillRect(x + 6, y + 5, 1, 1);
                                } else if (tile === 4) {
                    // ---- Quicksand: solid until it crumbles ----
                    // Compute erosion for this tile (0..1)
                    const key = row + ',' + col;
                    const framesToCrumble = QUICKSAND_CRUMBLE_SECONDS * 60;
                    const erosion = Math.min(1, (quicksandErosion[key] || 0) / framesToCrumble);

                    // Base: sandy colour, darkens as it crumbles
                    ctx.fillStyle = erosion > 0.6 ? '#6B5230' : '#A8884D';
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

                    // Top highlight (looks like packed sand)
                    ctx.fillStyle = '#D4B67A';
                    ctx.fillRect(x, y, TILE_SIZE, 2);

                    // Cracks appear as erosion increases
                    if (erosion > 0.25) {
                        ctx.strokeStyle = `rgba(40, 25, 10, ${erosion})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(x + 2, y + 3);
                        ctx.lineTo(x + 4, y + 5);
                        ctx.lineTo(x + 3, y + 7);
                        ctx.stroke();
                    }
                    if (erosion > 0.55) {
                        ctx.strokeStyle = `rgba(40, 25, 10, ${erosion})`;
                        ctx.beginPath();
                        ctx.moveTo(x + 5, y + 3);
                        ctx.lineTo(x + 7, y + 6);
                        ctx.stroke();
                    }

                    // Border
                    ctx.strokeStyle = '#6B5B3A';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
        
                                } else if (tile === 5) {
                    // ---- Conveyor belt (pushing left) ----
                    // Base platform surface
                    ctx.fillStyle = '#3A4A6B';
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                    // Top highlight
                    ctx.fillStyle = '#5C7AA8';
                    ctx.fillRect(x, y, TILE_SIZE, 1);
                    // Border
                    ctx.strokeStyle = '#1A2A3B';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);

                    // Animated treads scrolling LEFT
                    const speed = 0.002;
                    const phase = Math.floor(Date.now() * speed + x * 4) % 4;
                    ctx.fillStyle = '#8899BB';
                    for (let i = 0; i < 4; i++) {
                        const px = (i * 2 + phase) % TILE_SIZE;
                        ctx.fillRect(x + px, y + 2, 1, 4);
                    }

                    // Direction arrow (left)
                    ctx.fillStyle = '#FFD700';
                    ctx.fillRect(x + 1, y + 4, 1, 1);
                    ctx.fillRect(x + 2, y + 3, 1, 3);
                    ctx.fillRect(x + 3, y + 4, 1, 1);
                                }
            }
        }

        // ---- MONSTERS ----
        for (const m of monsters) {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(m.x + 1, m.y + m.h - 1, m.w - 2, 2);

            // Body (fills most of the sprite)
            ctx.fillStyle = '#C0392B';
            ctx.fillRect(m.x + 1, m.y + 2, m.w - 2, m.h - 4);

            // Top darker band
            ctx.fillStyle = '#A93226';
            ctx.fillRect(m.x + 1, m.y + 2, m.w - 2, 2);

            // Legs (at the very bottom, alternate placement for walk cycle)
            ctx.fillStyle = '#7B241C';
            if (m.dir === 1) {
                ctx.fillRect(m.x + 1, m.y + m.h - 3, 2, 2);
                ctx.fillRect(m.x + m.w - 3, m.y + m.h - 3, 2, 2);
            } else {
                ctx.fillRect(m.x + 2, m.y + m.h - 3, 2, 2);
                ctx.fillRect(m.x + m.w - 4, m.y + m.h - 3, 2, 2);
            }

            // Eye (facing direction)
            const eyeY = m.y + Math.floor(m.h * 0.35);
            ctx.fillStyle = '#FFF';
            if (m.dir === 1) {
                ctx.fillRect(m.x + m.w - 4, eyeY, 2, 2);
            } else {
                ctx.fillRect(m.x + 2, eyeY, 2, 2);
            }
            ctx.fillStyle = '#000';
            if (m.dir === 1) {
                ctx.fillRect(m.x + m.w - 3, eyeY, 1, 1);
            } else {
                ctx.fillRect(m.x + 2, eyeY, 1, 1);
            }
        }

                // ---- KEYS ----
        items.forEach(item => {
            if (item.collected) return;
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(item.x, item.y + 2, item.w, 2);
            ctx.fillRect(item.x + 1, item.y + 1, item.w - 2, 2);
            ctx.beginPath();
            ctx.arc(item.x + item.w - 1, item.y + 3, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        // ---- DOOR ----
        {
            const dx = door.x, dy = door.y;
            ctx.fillStyle = '#0a1a3a';
            ctx.fillRect(dx, dy, door.w, door.h);
            if (door.active) {
                const flash = Math.floor(Date.now() / 250) % 2 === 0;
                ctx.fillStyle = flash ? '#FFD700' : '#2A6FDB';
                ctx.fillRect(dx + 1, dy + 1, door.w - 2, door.h - 2);
                ctx.shadowColor = flash ? '#FFD700' : '#2A6FDB';
                ctx.shadowBlur = 10;
                ctx.strokeStyle = flash ? '#FFD700' : '#2A6FDB';
                ctx.lineWidth = 1;
                ctx.strokeRect(dx + 0.5, dy + 0.5, door.w - 1, door.h - 1);
                ctx.shadowBlur = 0;
            } else {
                ctx.fillStyle = '#1a3a6b';
                ctx.fillRect(dx + 1, dy + 1, door.w - 2, door.h - 2);
                ctx.strokeStyle = '#f7d44a';
                ctx.lineWidth = 1;
                ctx.strokeRect(dx + 0.5, dy + 0.5, door.w - 1, door.h - 1);
                ctx.fillStyle = '#f7d44a';
                ctx.fillRect(dx + door.w / 2 - 1, dy + door.h / 2 - 1, 2, 2);
            }
        }

        // ---- PLAYER ----
        if (!gameOver) {
            const px = player.x;
            const py = player.y;
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(px + 2, py + player.h - 2, player.w - 4, 3);
            ctx.fillStyle = '#4A90D9';
            ctx.fillRect(px + 1, py + 4, player.w - 2, 7);
            ctx.fillStyle = '#FDBF8A';
            ctx.fillRect(px + 2, py + 1, 6, 5);
            ctx.fillStyle = '#4A3728';
            ctx.fillRect(px + 2, py, 6, 2);
            ctx.fillStyle = '#2C3E50';
            if (player.facing === 1) {
                ctx.fillRect(px + 5, py + 2, 1, 1);
                ctx.fillRect(px + 7, py + 2, 1, 1);
            } else {
                ctx.fillRect(px + 3, py + 2, 1, 1);
                ctx.fillRect(px + 5, py + 2, 1, 1);
            }
            ctx.fillStyle = '#2C3E50';
            ctx.fillRect(px + 2, py + 11, 2, 3);
            ctx.fillRect(px + 6, py + 11, 2, 3);
            ctx.fillStyle = '#C0392B';
            ctx.fillRect(px + 1, py + 13, 3, 1);
            ctx.fillRect(px + 6, py + 13, 3, 1);
        }

        // ---- PANEL ----
        drawPanel();

        // ---- OVERLAYS ----
        if (levelComplete) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 40, W, 30);
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 12px "Courier New"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('CAVERN COMPLETE!', W/2, 55);
        }
        if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(0, 40, W, 30);
            ctx.fillStyle = '#FF4444';
            ctx.font = 'bold 12px "Courier New"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('GAME OVER - PRESS R', W/2, 55);
        }
    }

    function drawPanel() {
        const y0 = PANEL_TOP * TILE_SIZE;
        const panelH = (ROWS - PANEL_TOP) * TILE_SIZE;

        ctx.fillStyle = '#000';
        ctx.fillRect(0, y0, W, panelH);

        // Banner
        ctx.fillStyle = '#f7d44a';
        ctx.fillRect(0, y0, W, 16);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px "Courier New"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(levelName.toUpperCase(), W / 2, y0 + 8);
        
        // Air row
        ctx.fillStyle = '#000';
        ctx.fillRect(0, y0 + 16, W, 8);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 8px "Courier New"';
        ctx.textAlign = 'left';
        ctx.fillText('AIR', 4, y0 + 20);
        const barX = 32;
        const barW = W - barX - 4;
        ctx.fillStyle = '#333';
        ctx.fillRect(barX, y0 + 18, barW, 4);
        ctx.fillStyle = air < 30 ? '#FF4444' : '#4CAF50';
        ctx.fillRect(barX, y0 + 18, (air / 100) * barW, 4);

        // Score row
        ctx.fillStyle = '#000';
        ctx.fillRect(0, y0 + 24, W, 8);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 8px "Courier New"';
        ctx.textAlign = 'left';
        ctx.fillText('HI', 4, y0 + 28);
        ctx.fillStyle = '#f7d44a';
        ctx.fillText(String(highScore).padStart(6, '0'), 22, y0 + 28);
        ctx.fillStyle = '#fff';
        ctx.fillText('SCORE', 110, y0 + 28);
        ctx.fillStyle = '#f7d44a';
        ctx.fillText(String(score).padStart(6, '0'), 150, y0 + 28);
        const collected = items.filter(i => i.collected).length;
        ctx.fillStyle = '#fff';
        ctx.fillText('KEYS', 200, y0 + 28);
        ctx.fillStyle = '#FFD700';
        ctx.fillText(collected + '/' + totalKeys, 226, y0 + 28);

        // Lives row
        ctx.fillStyle = '#000';
        ctx.fillRect(0, y0 + 32, W, panelH - 32);
        for (let i = 0; i < lives; i++) {
            const wx = 8 + i * 14;
            const wy = y0 + 36;
            ctx.fillStyle = '#4A90D9';
            ctx.fillRect(wx + 1, wy + 3, 6, 5);
            ctx.fillStyle = '#FDBF8A';
            ctx.fillRect(wx + 2, wy, 4, 4);
            ctx.fillStyle = '#4A3728';
            ctx.fillRect(wx + 2, wy - 1, 4, 1);
            ctx.fillStyle = '#2C3E50';
            ctx.fillRect(wx + 1, wy + 8, 2, 2);
            ctx.fillRect(wx + 5, wy + 8, 2, 2);
        }
        ctx.fillStyle = '#888';
        ctx.font = '6px "Courier New"';
        ctx.textAlign = 'right';
        ctx.fillText('←→ MOVE   SPACE JUMP   R RESET', W - 4, y0 + 40);
    }    
    // ---------- GAME LOOP ----------
    function gameLoop() {
        // Air drain
        if (!gameOver && !levelComplete) {
            air -= 0.02;
            if (air <= 0) {
                air = 0;
                loseLife();
                air = 100;
            }
            updateHUD();
        }

        // Level complete countdown → advance
        if (levelComplete && !gameOver) {
            levelCompleteTimer++;
            if (levelCompleteTimer > 120) {   // 2 seconds at 60fps
                levelCompleteTimer = 0;
                advanceLevel();
            }
        }

        updatePlayer();
        draw();
        requestAnimationFrame(gameLoop);
    }

    let levelCompleteTimer = 0;

    function advanceLevel() {
        if (currentLevel + 1 < TOTAL_LEVELS) {
            currentLevel++;
            air = 100;
            levelComplete = false;
            loadLevel(currentLevel);
        } else {
            // finished all levels — show game complete, offer restart with R
            gameOver = true;
        }
    }

    // ---------- START ----------
    loadLevel(0);  // Select Starting Level for Testing - 0 starts from level 1 (0+1)
    updateHUD();
    gameLoop();

    // Handle window focus for key release
    window.addEventListener('blur', () => {
        for (let key in keys) keys[key] = false;
    });
</script>
</body>
</html>
