    // ---------- AUDIO ----------
    let audioCtx = null;
    let masterGain = null;
    let muted = false;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.5;
            masterGain.connect(audioCtx.destination);
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function beep(freq, duration, type = "square", volume = 0.08, slideTo = null) {
        if (!audioCtx || muted) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (slideTo !== null) osc.frequency.linearRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // ---- Named sound effects ----
    function sfxJump()          { beep(400, 0.10, "square",   0.06, 700); }
    function sfxKey()           { beep(880, 0.06, "square",   0.05); beep(1320, 0.06, "square", 0.05); }
    function sfxDoorOpen()      { beep(660, 0.08, "square",   0.06); setTimeout(() => beep(880, 0.08, "square", 0.06), 80); setTimeout(() => beep(1320, 0.12, "square", 0.06), 160); }
    function sfxLevelComplete() { beep(523, 0.10, "square",   0.07); setTimeout(() => beep(659, 0.10, "square", 0.07), 100); setTimeout(() => beep(784, 0.10, "square", 0.07), 200); setTimeout(() => beep(1046, 0.20, "square", 0.07), 300); }
    function sfxDeath()         { beep(300, 0.40, "sawtooth", 0.10, 80); }
	function sfxBonus()         { beep(300, 1.5, "square", 0.06, 1600); }

function buildMonsters(spawns) {
    return spawns.map(s => {
        if (s.axis === 'v') {
            const startRow = s.startRow !== undefined ? s.startRow : s.rowStart;
            return {
                x: s.col * TILE_SIZE,
                y: startRow * TILE_SIZE - MONSTER_H,
                w: MONSTER_W,
                h: MONSTER_H,
                axis: 'v',
                dir: s.dir,
                speed: s.speed,
                minY: s.rowStart * TILE_SIZE - MONSTER_H,
                maxY: s.rowEnd * TILE_SIZE - MONSTER_H,
            };
        }
        const startCol = s.startCol !== undefined ? s.startCol : s.colStart;
        return {
            x: startCol * TILE_SIZE,
            y: s.row * TILE_SIZE - MONSTER_H,
            w: MONSTER_W,
            h: MONSTER_H,
            axis: 'h',
            dir: s.dir,
            speed: s.speed,
            minX: s.colStart * TILE_SIZE,
            maxX: (s.colEnd + 1) * TILE_SIZE,
        };
    });
}

    // ---------- COLLISION DETECTION ----------
  // Returns true if the tile at (col,row) blocks horizontal movement (walls only)
function isSolidHoriz(col, row) {
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return false;
    return level[row][col] === 2;
}

function isOneWaySolid(col, row) {
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return false;
    const t = level[row][col];
    return t === 1 || t === 4 || t === 5;
}

function resolveHorizontal() {
    const left  = Math.floor(player.x / TILE_SIZE);
    const right = Math.floor((player.x + player.w - 0.001) / TILE_SIZE);
    const top   = Math.floor(player.y / TILE_SIZE);
    const bot   = Math.floor((player.y + player.h - 0.001) / TILE_SIZE);

    let hit = false;
    for (let row = top; row <= bot; row++) {
        for (let col = left; col <= right; col++) {
            if (isSolidHoriz(col, row)) { hit = true; break; }
        }
        if (hit) break;
    }

    if (!hit) return;

    if (player.vx > 0) {
        const col = Math.floor((player.x + player.w) / TILE_SIZE);
        player.x = col * TILE_SIZE - player.w - 0.001;
    } else if (player.vx < 0) {
        const col = Math.floor(player.x / TILE_SIZE);
        player.x = (col + 1) * TILE_SIZE + 0.001;
    }
    player.vx = 0;
}

function resolveVertical() {
    const prevFeetY = (player.y - player.vy) + player.h;
    const feetY     = player.y + player.h;
    const left  = Math.floor(player.x / TILE_SIZE);
    const right = Math.floor((player.x + player.w - 0.001) / TILE_SIZE);

    let landed = false;

    if (player.vy >= 0) {
        // ---- FALLING ----
        const startRow = Math.floor(prevFeetY / TILE_SIZE);
        const endRow   = Math.floor(feetY / TILE_SIZE);

        // Normal platforms (tile 1 & quicksand 4)
        for (let row = startRow; row <= endRow; row++) {
            for (let col = left; col <= right; col++) {
                if (!isOneWaySolid(col, row)) continue;
                const tileTop = row * TILE_SIZE;
                if (prevFeetY <= tileTop && feetY >= tileTop) {
                    player.y = tileTop - player.h;
                    player.vy = 0;
                    player.onGround = true;
                    landed = true;
                    break;
                }
            }
            if (landed) break;
        }

        // Walls (tile 2) also block from above
        if (!landed) {
            for (let row = startRow; row <= endRow; row++) {
                for (let col = left; col <= right; col++) {
                    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) continue;
                    if (level[row][col] !== 2) continue;
                    const tileTop = row * TILE_SIZE;
                    if (prevFeetY <= tileTop && feetY >= tileTop) {
                        player.y = tileTop - player.h;
                        player.vy = 0;
                        player.onGround = true;
                        landed = true;
                        break;
                    }
                }
                if (landed) break;
            }
        }
    } else {
        // ---- RISING ----
        const headY     = player.y;
        const prevHeadY = player.y - player.vy;
        const topRow    = Math.floor(headY / TILE_SIZE);
        const stopRow   = Math.floor(prevHeadY / TILE_SIZE);

        // Walls block the head
        for (let row = stopRow; row >= topRow; row--) {
            for (let col = left; col <= right; col++) {
                if (row < 0 || row >= ROWS || col < 0 || col >= COLS) continue;
                if (level[row][col] !== 2) continue;
                const tileBottom = (row + 1) * TILE_SIZE;
                if (prevHeadY >= tileBottom && headY < tileBottom) {
                    player.y = tileBottom;
                    player.vy = 0;
                    break;
                }
            }
        }
    }
}

    // ---------- PHYSICS UPDATE ----------
function updatePlayer() {
    if (gameOver || levelComplete || dying) return;

    // ---- HORIZONTAL MOVEMENT ----
    const speed = player.onGround ? MOVE_SPEED : AIR_SPEED;
    if (keys['ArrowLeft']) {
        player.vx = -speed;
        player.facing = -1;
    } else if (keys['ArrowRight']) {
        player.vx = speed;
        player.facing = 1;
    } else {
        player.vx *= FRICTION;
        if (Math.abs(player.vx) < 0.1) player.vx = 0;
    }

if (player.onGround && Math.abs(player.vx) > 0.1) {
    walkFrame++;
} else {
    walkFrame = 0;
}


    // ---- DEADLY TILES (tree = tile 3) ----
    // If any tile overlapping the player's bounding box is 3, it's instant death.
    const bodyLeft  = Math.floor(player.x / TILE_SIZE);
    const bodyRight = Math.floor((player.x + player.w - 0.001) / TILE_SIZE);
    const bodyTop   = Math.floor(player.y / TILE_SIZE);
    const bodyBot   = Math.floor((player.y + player.h - 0.001) / TILE_SIZE);

    let touchingDeadly = false;
    for (let r = bodyTop; r <= bodyBot; r++) {
        for (let c = bodyLeft; c <= bodyRight; c++) {
            if (level[r]?.[c] === 3) { touchingDeadly = true; break; }
        }
        if (touchingDeadly) break;
    }

    if (touchingDeadly) {
        loseLife();
        return;   // stop processing this frame — we just respawned
    }

    // ---- UPDATE MONSTERS ----
    updateMonsters();

    // ---- MONSTER COLLISION ----
    for (const m of monsters) {
        if (player.x + player.w > m.x &&
            player.x < m.x + m.w &&
            player.y + player.h > m.y &&
            player.y < m.y + m.h) {
            loseLife();
            return;
        }
    }

    // ---- JUMP ----
    if (keys['Space'] && player.onGround) {
        player.vy = JUMP_FORCE;
        player.onGround = false;
                sfxJump();
    }

    // ---- CONVEYOR BELT ----
    // If the player's feet are on a tile-5 conveyor, push them sideways.
    if (player.onGround) {
    const feetY = player.y + player.h + 1;
    const leftCol  = Math.floor(player.x / TILE_SIZE);
    const rightCol = Math.floor((player.x + player.w - 0.001) / TILE_SIZE);
    const feetRow  = Math.floor(feetY / TILE_SIZE);
    const CONVEYOR_SPEED = 0.4;

    for (let c = leftCol; c <= rightCol; c++) {
        if (level[feetRow]?.[c] === 5) {
            const dir = conveyorDirs[feetRow + ',' + c] || -1;
            player.x += dir * CONVEYOR_SPEED;
            break;
			}
		}
    }

             // ---- GRAVITY & VERTICAL SPEED ----
    if (!player.onGround) {
        player.vy += GRAVITY;
        if (player.vy > 6.0) player.vy = 6.0;
    } else {
        player.vy = 0;
    }

    // ---- RESET onGround (resolveVertical will set it if we land) ----
    player.onGround = false;

     // ---- MOVE X ----
    player.x += player.vx;
    resolveHorizontal();

    // ---- MOVE Y ----
    // resolveVertical() handles landing, ceilings, quicksand, and drop-through
    player.y += player.vy;
    resolveVertical();

    // ---- QUICKSAND EROSION ----
    // If the player is grounded on a tile 4, erode it away over time.
    if (player.onGround) {
        const feetY = player.y + player.h + 1;   // +1 to reach into the tile below the feet
        const leftCol  = Math.floor(player.x / TILE_SIZE);
        const rightCol = Math.floor((player.x + player.w - 0.001) / TILE_SIZE);
        const feetRow  = Math.floor(feetY / TILE_SIZE);

        for (let c = leftCol; c <= rightCol; c++) {
            if (level[feetRow]?.[c] !== 4) continue;

            const key = feetRow + ',' + c;
            quicksandErosion[key] = (quicksandErosion[key] || 0) + 1;

            // 0.5s at 60fps = 30 frames
            const framesToCrumble = QUICKSAND_CRUMBLE_SECONDS * 60;
            if (quicksandErosion[key] >= framesToCrumble) {
                level[feetRow][c] = 0;       // crumbled — becomes a hole
                delete quicksandErosion[key];
            }
        }
    }

    // ---- KEEP WITHIN BOUNDS ----
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > W) player.x = W - player.w;
    const playBottom = (PLAY_ROWS - 1) * TILE_SIZE;   // y = 120 — TOP of the ground row
    if (player.y + player.h > playBottom) {
        player.y = playBottom - player.h;
        player.onGround = true;
        player.vy = 0;
    }

        if (player.y > playBottom + 50) {
        loseLife();
    }

    // ---- COLLECT ITEMS ----
    items.forEach(item => {
        if (!item.collected) {
            const dx = (player.x + player.w / 2) - (item.x + item.w / 2);
            const dy = (player.y + player.h / 2) - (item.y + item.h / 2);
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 12) {
    item.collected = true;
    score += 100;
    if (score > highScore) highScore = score;
    sfxKey();
    updateHUD();
}
        }
    });


     const collectedCount = items.filter(item => item.collected).length;
    if (collectedCount === totalKeys && !door.active) {
        door.active = true;
        sfxDoorOpen();
    }

    // ---- CHECK FOR EXIT ----
    if (door.active) {
        const hit = player.x < door.x + door.w &&
                    player.x + player.w > door.x &&
                    player.y < door.y + door.h &&
                    player.y + player.h > door.y;
if (hit) {
    levelComplete = true;
    bonusPhase = true;
    bonusAccumulator = 0;
    levelCompleteTimer = 0;
    sfxLevelComplete();
    setTimeout(sfxBonus, 400);
}
    }
}

function updateMonsters() {
    for (const m of monsters) {
        if (m.axis === 'v') {
            m.y += m.dir * m.speed;
            if (m.y <= m.minY) { m.y = m.minY; m.dir = 1; }
            if (m.y + m.h >= m.maxY + MONSTER_H) { m.y = m.maxY; m.dir = -1; }
        } else {
            m.x += m.dir * m.speed;
            if (m.x <= m.minX) { m.x = m.minX; m.dir = 1; }
            if (m.x + m.w >= m.maxX) { m.x = m.maxX - m.w; m.dir = -1; }
        }
    }
}

    // ---------- GAME FUNCTIONS ----------

        dying = true;

 function finishDeath() {

    function updateHUD() {
        // HUD is rendered into the canvas by drawPanel() every frame.
        // This is intentionally a no-op; kept so existing calls don't throw.
    }

    // ---------- RENDER ----------
    
        function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, W, H);

        // ---- TILES ----
        for (let row = 0; row < ROWS; row++) {
            for (let col = 0; col < COLS; col++) {
                const tile = level[row][col];
                const x = col * TILE_SIZE;
                const y = row * TILE_SIZE;

                if (tile === 1) {
                    ctx.fillStyle = '#8B1A1A';
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                    ctx.fillStyle = '#B22222';
                    ctx.fillRect(x, y, TILE_SIZE, 2);
                    ctx.strokeStyle = '#5C1010';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
                    if (row > 0 && level[row-1][col] === 0) {
                        ctx.fillStyle = '#E04A4A';
                        ctx.fillRect(x, y, TILE_SIZE, 1);
                    }
                } else if (tile === 2) {
                    ctx.fillStyle = '#6B3410';
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(x, y, TILE_SIZE, 3);
                    ctx.strokeStyle = '#3D1F08';
                    ctx.lineWidth = 0.5;
                    ctx.beginPath();
                    ctx.moveTo(x, y + 4);
                    ctx.lineTo(x + TILE_SIZE, y + 4);
                    ctx.stroke();
                    const brickRow = Math.floor(y / TILE_SIZE) % 2;
                    const joinX = brickRow === 0 ? x + 4 : x + 2;
                    ctx.beginPath();
                    ctx.moveTo(joinX, y + 4);
                    ctx.lineTo(joinX, y + TILE_SIZE);
                    ctx.stroke();
                    ctx.strokeStyle = '#2A1405';
                    ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
                } else if (tile === 3) {
                    ctx.fillStyle = '#1B5E20';
                    ctx.fillRect(x + 1, y + 3, 6, 4);
                    ctx.fillRect(x + 2, y + 2, 4, 1);
                    ctx.fillStyle = '#2E7D32';
                    ctx.fillRect(x + 2, y + 3, 2, 2);
                    ctx.fillRect(x + 4, y + 5, 2, 2);
                    ctx.fillStyle = '#5C3A1E';
                    ctx.fillRect(x + 3, y + 6, 2, 2);
                    ctx.fillStyle = '#FFEB3B';
                    ctx.fillRect(x + 2, y + 1, 1, 1);
                    ctx.fillRect(x + 5, y + 2, 1, 1);
                    ctx.fillRect(x + 6, y + 5, 1, 1);
                                } else if (tile === 4) {
                    // ---- Quicksand: solid until it crumbles ----
                    // Compute erosion for this tile (0..1)
                    const key = row + ',' + col;
                    const framesToCrumble = QUICKSAND_CRUMBLE_SECONDS * 60;
                    const erosion = Math.min(1, (quicksandErosion[key] || 0) / framesToCrumble);

                    // Base: sandy colour, darkens as it crumbles
                    ctx.fillStyle = erosion > 0.6 ? '#6B5230' : '#A8884D';
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

                    // Top highlight (looks like packed sand)
                    ctx.fillStyle = '#D4B67A';
                    ctx.fillRect(x, y, TILE_SIZE, 2);

                    // Cracks appear as erosion increases
                    if (erosion > 0.25) {
                        ctx.strokeStyle = `rgba(40, 25, 10, ${erosion})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(x + 2, y + 3);
                        ctx.lineTo(x + 4, y + 5);
                        ctx.lineTo(x + 3, y + 7);
                        ctx.stroke();
                    }
                    if (erosion > 0.55) {
                        ctx.strokeStyle = `rgba(40, 25, 10, ${erosion})`;
                        ctx.beginPath();
                        ctx.moveTo(x + 5, y + 3);
                        ctx.lineTo(x + 7, y + 6);
                        ctx.stroke();
                    }

                    // Border
                    ctx.strokeStyle = '#6B5B3A';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
        
                                } else if (tile === 5) {
                    // ---- Conveyor belt (pushing left) ----
                    // Base platform surface
                    ctx.fillStyle = '#3A4A6B';
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                    // Top highlight
                    ctx.fillStyle = '#5C7AA8';
                    ctx.fillRect(x, y, TILE_SIZE, 1);
                    // Border
                    ctx.strokeStyle = '#1A2A3B';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);

                    // Animated treads scrolling LEFT
                    const speed = 0.002;
                    const phase = Math.floor(Date.now() * speed + x * 4) % 4;
                    ctx.fillStyle = '#8899BB';
                    for (let i = 0; i < 4; i++) {
                        const px = (i * 2 + phase) % TILE_SIZE;
                        ctx.fillRect(x + px, y + 2, 1, 4);
                    }

                    // Direction arrow (left)
                    ctx.fillStyle = '#FFD700';
                    ctx.fillRect(x + 1, y + 4, 1, 1);
                    ctx.fillRect(x + 2, y + 3, 1, 3);
                    ctx.fillRect(x + 3, y + 4, 1, 1);
                                }
            }
        }

        // ---- MONSTERS ----
        for (const m of monsters) {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(m.x + 1, m.y + m.h - 1, m.w - 2, 2);

            // Body (fills most of the sprite)
            ctx.fillStyle = '#C0392B';
            ctx.fillRect(m.x + 1, m.y + 2, m.w - 2, m.h - 4);

            // Top darker band
            ctx.fillStyle = '#A93226';
            ctx.fillRect(m.x + 1, m.y + 2, m.w - 2, 2);

            // Legs (at the very bottom, alternate placement for walk cycle)
            ctx.fillStyle = '#7B241C';
            if (m.dir === 1) {
                ctx.fillRect(m.x + 1, m.y + m.h - 3, 2, 2);
                ctx.fillRect(m.x + m.w - 3, m.y + m.h - 3, 2, 2);
            } else {
                ctx.fillRect(m.x + 2, m.y + m.h - 3, 2, 2);
                ctx.fillRect(m.x + m.w - 4, m.y + m.h - 3, 2, 2);
            }

            // Eye (facing direction)
            const eyeY = m.y + Math.floor(m.h * 0.35);
            ctx.fillStyle = '#FFF';
            if (m.dir === 1) {
                ctx.fillRect(m.x + m.w - 4, eyeY, 2, 2);
            } else {
                ctx.fillRect(m.x + 2, eyeY, 2, 2);
            }
            ctx.fillStyle = '#000';
            if (m.dir === 1) {
                ctx.fillRect(m.x + m.w - 3, eyeY, 1, 1);
            } else {
                ctx.fillRect(m.x + 2, eyeY, 1, 1);
            }
        }

                // ---- KEYS ----
        items.forEach(item => {
            if (item.collected) return;
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(item.x, item.y + 2, item.w, 2);
            ctx.fillRect(item.x + 1, item.y + 1, item.w - 2, 2);
            ctx.beginPath();
            ctx.arc(item.x + item.w - 1, item.y + 3, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        // ---- DOOR ----
        {
            const dx = door.x, dy = door.y;
            ctx.fillStyle = '#0a1a3a';
            ctx.fillRect(dx, dy, door.w, door.h);
            if (door.active) {
                const flash = Math.floor(Date.now() / 250) % 2 === 0;
                ctx.fillStyle = flash ? '#FFD700' : '#2A6FDB';
                ctx.fillRect(dx + 1, dy + 1, door.w - 2, door.h - 2);
                ctx.shadowColor = flash ? '#FFD700' : '#2A6FDB';
                ctx.shadowBlur = 10;
                ctx.strokeStyle = flash ? '#FFD700' : '#2A6FDB';
                ctx.lineWidth = 1;
                ctx.strokeRect(dx + 0.5, dy + 0.5, door.w - 1, door.h - 1);
                ctx.shadowBlur = 0;
            } else {
                ctx.fillStyle = '#1a3a6b';
                ctx.fillRect(dx + 1, dy + 1, door.w - 2, door.h - 2);
                ctx.strokeStyle = '#f7d44a';
                ctx.lineWidth = 1;
                ctx.strokeRect(dx + 0.5, dy + 0.5, door.w - 1, door.h - 1);
                ctx.fillStyle = '#f7d44a';
                ctx.fillRect(dx + door.w / 2 - 1, dy + door.h / 2 - 1, 2, 2);
            }
        }

               // ---- PLAYER ----
        if (!gameOver) {
            // Blink the player: visible on even frames, invisible on odd, while dying
            const visible = !dying || Math.floor(dyingTimer / 4) % 2 === 0;

            if (visible) {
                const px = player.x;
                const py = player.y;
                const legPhase = Math.floor(walkFrame / 6) % 2;

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(px + 2, py + player.h - 2, player.w - 4, 3);

                // Body
                ctx.fillStyle = '#4A90D9';
                ctx.fillRect(px + 1, py + 4, player.w - 2, 7);

                                // Arms (sleeves) + hands
                ctx.fillStyle = '#4A90D9';
                if (!player.onGround) {
                    // Arms up
                    ctx.fillRect(px, py + 1, 2, 3);
                    ctx.fillRect(px + 8, py + 1, 2, 3);
                    ctx.fillStyle = '#FDBF8A';
                    ctx.fillRect(px, py, 2, 1);
                    ctx.fillRect(px + 8, py, 2, 1);
                } else {
                    // Alternating swing — one arm forward, one arm back
                    const leftArmY  = (legPhase === 0) ? py + 5 : py + 6;
                    const rightArmY = (legPhase === 0) ? py + 6 : py + 5;
                    ctx.fillRect(px, leftArmY, 2, 3);
                    ctx.fillRect(px + 8, rightArmY, 2, 3);
                    ctx.fillStyle = '#FDBF8A';
                    ctx.fillRect(px, leftArmY + 3, 2, 1);
                    ctx.fillRect(px + 8, rightArmY + 3, 2, 1);
                }

                // Head
                ctx.fillStyle = '#FDBF8A';
                ctx.fillRect(px + 2, py + 1, 6, 5);

                // Hair
                ctx.fillStyle = '#4A3728';
                ctx.fillRect(px + 2, py, 6, 2);

                // Eyes
                ctx.fillStyle = '#2C3E50';
                if (player.facing === 1) {
                    ctx.fillRect(px + 5, py + 2, 1, 1);
                    ctx.fillRect(px + 7, py + 2, 1, 1);
                } else {
                    ctx.fillRect(px + 3, py + 2, 1, 1);
                    ctx.fillRect(px + 5, py + 2, 1, 1);
                }

                // Legs
                ctx.fillStyle = '#2C3E50';
                if (!player.onGround) {
                    ctx.fillRect(px + 2, py + 11, 2, 3);
                    ctx.fillRect(px + 6, py + 11, 2, 3);
                } else if (legPhase === 0) {
                    ctx.fillRect(px + 2, py + 11, 2, 3);
                    ctx.fillRect(px + 6, py + 11, 2, 3);
                } else {
                    ctx.fillRect(px + 3, py + 11, 2, 3);
                    ctx.fillRect(px + 5, py + 11, 2, 3);
                }

                // Shoes
                ctx.fillStyle = '#C0392B';
                if (!player.onGround) {
                    ctx.fillRect(px + 1, py + 13, 3, 1);
                    ctx.fillRect(px + 6, py + 13, 3, 1);
                } else if (legPhase === 0) {
                    ctx.fillRect(px + 1, py + 13, 3, 1);
                    ctx.fillRect(px + 6, py + 13, 3, 1);
                } else {
                    ctx.fillRect(px + 2, py + 13, 3, 1);
                    ctx.fillRect(px + 5, py + 13, 3, 1);
                }
            }
        }

        // ---- DEATH FLASH ----
        if (dying) {
            const alpha = Math.max(0, dyingTimer / 60) * 0.35;
            ctx.fillStyle = `rgba(200, 30, 30, ${alpha})`;
            ctx.fillRect(0, 0, W, H);
        }

        // ---- PANEL ----
        drawPanel();

        // ---- OVERLAYS ----
        if (levelComplete) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 30, W, 50);
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 12px "Courier New"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('CAVERN COMPLETE!', W/2, 42);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 8px "Courier New"';
            ctx.fillText('AIR BONUS', W/2, 56);
            ctx.fillStyle = '#FFD700';
            ctx.fillText('+' + bonusAccumulator, W/2, 68);
        }
        if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(0, 40, W, 30);
            ctx.fillStyle = '#FF4444';
            ctx.font = 'bold 12px "Courier New"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('GAME OVER - PRESS R', W/2, 55);
        }
    }

    function drawPanel() {
        const y0 = PANEL_TOP * TILE_SIZE;
        const panelH = (ROWS - PANEL_TOP) * TILE_SIZE;

        ctx.fillStyle = '#000';
        ctx.fillRect(0, y0, W, panelH);

        // Banner
        ctx.fillStyle = '#f7d44a';
        ctx.fillRect(0, y0, W, 16);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px "Courier New"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(levelName.toUpperCase(), W / 2, y0 + 8);
        
        // Air row
        ctx.fillStyle = '#000';
        ctx.fillRect(0, y0 + 16, W, 8);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 8px "Courier New"';
        ctx.textAlign = 'left';
        ctx.fillText('AIR', 4, y0 + 20);
        const barX = 32;
        const barW = W - barX - 4;
        ctx.fillStyle = '#333';
        ctx.fillRect(barX, y0 + 18, barW, 4);
        ctx.fillStyle = air < 30 ? '#FF4444' : '#4CAF50';
        ctx.fillRect(barX, y0 + 18, (air / 100) * barW, 4);

        // Score row
        ctx.fillStyle = '#000';
        ctx.fillRect(0, y0 + 24, W, 8);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 8px "Courier New"';
        ctx.textAlign = 'left';
        ctx.fillText('HI', 4, y0 + 28);
        ctx.fillStyle = '#f7d44a';
        ctx.fillText(String(highScore).padStart(6, '0'), 22, y0 + 28);
        ctx.fillStyle = '#fff';
        ctx.fillText('SCORE', 110, y0 + 28);
        ctx.fillStyle = '#f7d44a';
        ctx.fillText(String(score).padStart(6, '0'), 150, y0 + 28);
        const collected = items.filter(i => i.collected).length;
        ctx.fillStyle = '#fff';
        ctx.fillText('KEYS', 200, y0 + 28);
        ctx.fillStyle = '#FFD700';
        ctx.fillText(collected + '/' + totalKeys, 226, y0 + 28);

        // Lives row
        ctx.fillStyle = '#000';
        ctx.fillRect(0, y0 + 32, W, panelH - 32);
        for (let i = 0; i < lives; i++) {
            const wx = 8 + i * 14;
            const wy = y0 + 36;
            ctx.fillStyle = '#4A90D9';
            ctx.fillRect(wx + 1, wy + 3, 6, 5);
            ctx.fillStyle = '#FDBF8A';
            ctx.fillRect(wx + 2, wy, 4, 4);
            ctx.fillStyle = '#4A3728';
            ctx.fillRect(wx + 2, wy - 1, 4, 1);
            ctx.fillStyle = '#2C3E50';
            ctx.fillRect(wx + 1, wy + 8, 2, 2);
            ctx.fillRect(wx + 5, wy + 8, 2, 2);
        }
        ctx.fillStyle = '#888';
        ctx.font = '6px "Courier New"';
        ctx.textAlign = 'right';
        ctx.fillText('←→ MOVE   SPACE JUMP   R RESET', W - 4, y0 + 40);
    }    
    // ---------- GAME LOOP ----------
        
            let lastFrame = 0;
    const FRAME_INTERVAL = 1000 / 32;

    function gameLoop(timestamp) {
        if (timestamp - lastFrame < FRAME_INTERVAL) {
            requestAnimationFrame(gameLoop);
            return;
        }
        lastFrame = timestamp;
        
        // Air drain
        if (!gameOver && !levelComplete) {
            air -= 0.02;
            if (air <= 0) {
                air = 0;
                loseLife();
                air = 100;
            }
            updateHUD();
        }

                // ---- LEVEL COMPLETE — AIR BONUS ----
        if (levelComplete && !gameOver) {
            if (bonusPhase) {
                // Drain air and convert to score
                if (air > 0) {
                    // 1 air unit per frame drains in ~1.5 seconds (100 air / 1.5s / 60fps ≈ 1.1/frame)
                    const drain = Math.min(air, 1.0);
                    air -= drain;
                    const points = Math.round(drain * 10);   // 10 points per air unit
                    score += points;
                    bonusAccumulator += points;
                    if (score > highScore) {
    highScore = score;
    localStorage.setItem('manic-miner-hi', highScore);
}
                } else {
                    air = 0;
                    bonusPhase = false;
                    levelCompleteTimer = 0;   // start the "pause" countdown
                }
            } else {
                // Bonus is done — short pause, then advance
                levelCompleteTimer++;
                if (levelCompleteTimer > 60) {    // 1 second
                    levelCompleteTimer = 0;
                    advanceLevel();
                }
            }
        }

        // ---- DYING ----
        if (dying && !gameOver) {
            dyingTimer--;
            if (dyingTimer <= 0) {
                finishDeath();
            }
        }

        updatePlayer();
        draw();
        requestAnimationFrame(gameLoop);
    }

    let levelCompleteTimer = 0;

    function advanceLevel() {
        if (currentLevel + 1 < TOTAL_LEVELS) {
            currentLevel++;
            air = 100;
            levelComplete = false;
            bonusPhase = false;
            bonusAccumulator = 0;
            loadLevel(currentLevel);
        } else {
            // finished all levels — show game complete, offer restart with R
            gameOver = true;
                        sfxGameOver();
        }
    }

    // ---------- START ----------
    loadLevel(0);  // Select Starting Level for Testing - 0 starts from level 1 (0+1)
    updateHUD();
    gameLoop();

    // Handle window focus for key release
    window.addEventListener('blur', () => {
        for (let key in keys) keys[key] = false;
    });
</script>
</body>
</html>
