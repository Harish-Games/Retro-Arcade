<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1979 Lunar Lander Arcade (Fixed)</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff55;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            letter-spacing: 4px;
            text-shadow: 0 0 8px #00ff55;
        }

        #dashboard {
            width: 800px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            font-size: 14px;
            margin-bottom: 8px;
            border: 1px solid #005511;
            padding: 10px;
            background: #000a00;
        }

        .stat span {
            color: #ffffff;
            font-weight: bold;
        }

        .danger {
            color: #ff3333 !important;
            animation: blink 0.5s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }

        #gameContainer {
            position: relative;
        }

        canvas {
            background-color: #000000;
            border: 2px solid #00ff55;
            box-shadow: 0 0 20px rgba(0, 255, 85, 0.2);
            display: block;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none;
            border: 2px solid #00ff55;
        }

        #overlay h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        #overlay p {
            color: #fff;
            margin-bottom: 20px;
            font-size: 18px;
        }

        button {
            background-color: transparent;
            color: #00ff55;
            border: 2px solid #00ff55;
            padding: 10px 25px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #00ff55;
            color: #000;
            box-shadow: 0 0 15px #00ff55;
        }
    </style>
</head>
<body>

    <h1>LUNAR LANDER</h1>
    
    <div id="dashboard">
        <div class="stat">SCORE: <span id="score">0000</span></div>
        <div class="stat">FUEL: <span id="fuel">1000</span></div>
        <div class="stat">ALTITUDE: <span id="altitude">0000</span></div>
        <div class="stat">ROTATION: <span id="rotation">0°</span></div>
        <div class="stat">HORIZ SPD: <span id="hSpeed">0</span></div>
        <div class="stat">VERT SPD: <span id="vSpeed">0</span></div>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="overlay">
            <h2 id="statusTitle">TOUCHDOWN!</h2>
            <p id="statusDesc">Safe landing achieved.</p>
            <button onclick="resetGame()">NEXT ATTEMPT</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('score');
        const fuelEl = document.getElementById('fuel');
        const altEl = document.getElementById('altitude');
        const rotEl = document.getElementById('rotation');
        const hSpeedEl = document.getElementById('hSpeed');
        const vSpeedEl = document.getElementById('vSpeed');
        const overlay = document.getElementById('overlay');
        const statusTitle = document.getElementById('statusTitle');
        const statusDesc = document.getElementById('statusDesc');

        // Physics Configurations
        const GRAVITY = 0.04;
        const THRUST_POWER = 0.12;
        const ROTATION_SPEED = 0.06;
        const SAFE_V_SPEED = 1.2;    
        const SAFE_H_SPEED = 0.5;    

        let score = 0;
        let gameActive = true;
        let keys = {};

        // FIXED: pad flag now sits on the FIRST point of each flat run, since collision/height
        // lookups test p1.pad for the segment from p1 -> p2. Previously the flag was on the
        // second point, which made it describe the *next* (sloped) segment instead of the pad.
        const terrainPoints = [
            {x: 0, y: 480}, 
            {x: 100, y: 450, pad: true, mult: 2}, {x: 180, y: 450}, // Flat 2x Pad at y=450
            {x: 240, y: 490}, 
            {x: 350, y: 390, pad: true, mult: 5}, {x: 390, y: 390}, // Flat 5x Pad at y=390
            {x: 450, y: 470}, 
            {x: 560, y: 420, pad: true, mult: 2}, {x: 640, y: 420}, // Flat 2x Pad at y=420
            {x: 700, y: 490}, 
            {x: 800, y: 460}
        ];

        let lander = {
            x: 400,
            y: 40,
            vx: 0,
            vy: 0,
            angle: -Math.PI / 2, 
            fuel: 1000,
            thrusting: false,
            width: 16,
            height: 18
        };

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);
        window.addEventListener('keydown', e => {
            if(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                e.preventDefault();
            }
        });

        function init() {
            lander.x = 100 + Math.random() * 600;
            lander.y = 40;
            lander.vx = (Math.random() - 0.5) * 2;
            lander.vy = 0.5;
            lander.angle = -Math.PI / 2;
            lander.thrusting = false;
            
            gameActive = true;
            overlay.style.display = "none";
            animate();
        }

        function mechanicsStep() {
            if (!gameActive) return;

            if (keys['ArrowLeft'] || keys['KeyA']) lander.angle -= ROTATION_SPEED;
            if (keys['ArrowRight'] || keys['KeyD']) lander.angle += ROTATION_SPEED;

            if ((keys['ArrowUp'] || keys['KeyW']) && lander.fuel > 0) {
                lander.thrusting = true;
                lander.fuel -= 1.5;
                lander.vx += Math.cos(lander.angle) * THRUST_POWER;
                lander.vy += Math.sin(lander.angle) * THRUST_POWER;
            } else {
                lander.thrusting = false;
            }

            lander.vy += GRAVITY;
            lander.x += lander.vx;
            lander.y += lander.vy;

            if (lander.x < 0) lander.x = canvas.width;
            if (lander.x > canvas.width) lander.x = 0;

            updateDashboard();
            checkCollisions();
        }

        function updateDashboard() {
            scoreEl.innerText = String(Math.floor(score)).padStart(4, '0');
            fuelEl.innerText = String(Math.max(0, Math.floor(lander.fuel))).padStart(4, '0');
            
            if (lander.fuel < 200) fuelEl.className = "danger";
            else fuelEl.className = "";

            let groundY = getTerrainHeightAt(lander.x);
            let altitude = Math.max(0, Math.floor(groundY - lander.y - lander.height));
            altEl.innerText = String(altitude).padStart(4, '0');

            let degrees = Math.floor((lander.angle + Math.PI/2) * (180/Math.PI)) % 360;
            if (degrees > 180) degrees -= 360;
            if (degrees < -180) degrees += 360;
            rotEl.innerText = `${degrees}°`;

            let dispV = (lander.vy * 20).toFixed(1);
            let dispH = (lander.vx * 20).toFixed(1);
            
            vSpeedEl.innerText = dispV;
            hSpeedEl.innerText = dispH;

            if (Math.abs(lander.vy) > SAFE_V_SPEED) vSpeedEl.className = "danger";
            else vSpeedEl.className = "";

            if (Math.abs(lander.vx) > SAFE_H_SPEED) hSpeedEl.className = "danger";
            else hSpeedEl.className = "";
        }

        // FIXED: Improved interpolation so it correctly detects flat steps on landing pads
        function getTerrainHeightAt(x) {
            for (let i = 0; i < terrainPoints.length - 1; i++) {
                let p1 = terrainPoints[i];
                let p2 = terrainPoints[i+1];
                if (x >= p1.x && x <= p2.x) {
                    if (p1.pad) {
                        return p1.y; // If it's a pad, it is perfectly flat.
                    }
                    let ratio = (x - p1.x) / (p2.x - p1.x);
                    return p1.y + ratio * (p2.y - p1.y);
                }
            }
            return canvas.height;
        }

        function checkCollisions() {
            let groundY = getTerrainHeightAt(lander.x);
            
            if (lander.y + lander.height >= groundY) {
                lander.y = groundY - lander.height; 
                gameActive = false;

                let landedPad = null;
                for (let i = 0; i < terrainPoints.length - 1; i++) {
                    let p1 = terrainPoints[i];
                    let p2 = terrainPoints[i+1];
                    // Verify the lander is completely within the left and right bounds of a pad
                    if (p1.pad && lander.x >= p1.x && lander.x <= p2.x) {
                        landedPad = p1;
                        break;
                    }
                }

                let degrees = Math.abs(Math.floor((lander.angle + Math.PI/2) * (180/Math.PI)));
                let angleSafe = (degrees <= 8 || degrees >= 352); // Safe within ~8 degrees of upright

                let verticalSafe = lander.vy <= SAFE_V_SPEED;
                let horizontalSafe = Math.abs(lander.vx) <= SAFE_H_SPEED;

                if (landedPad && angleSafe && verticalSafe && horizontalSafe) {
                    let pointsEarned = 50 * landedPad.mult;
                    score += pointsEarned;
                    statusTitle.innerText = "TOUCHDOWN!";
                    statusTitle.style.color = "#00ff55";
                    statusDesc.innerText = `Successful landing! Pad multiplier x${landedPad.mult}. +${pointsEarned} Points.`;
                } else {
                    statusTitle.innerText = "CRASH DEMOLISHED";
                    statusTitle.style.color = "#ff3333";
                    
                    if (!landedPad) statusDesc.innerText = "Fatal: You missed the flat landing pads!";
                    else if (!angleSafe) statusDesc.innerText = "Fatal: Capsule tipped over on touchdown!";
                    else statusDesc.innerText = "Fatal Impact: Touchdown speed was way too fast!";
                }
                overlay.style.display = "flex";
            }
        }

        function resetGame() {
            init();
        }

        function draw() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Mountain Terrain
            ctx.strokeStyle = '#00ff55';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(terrainPoints[0].x, terrainPoints[0].y);
            
            for (let i = 1; i < terrainPoints.length; i++) {
                ctx.lineTo(terrainPoints[i].x, terrainPoints[i].y);
            }
            ctx.stroke();

            // Draw Flat White Landing Pads
            for (let i = 0; i < terrainPoints.length - 1; i++) {
                let p1 = terrainPoints[i];
                let p2 = terrainPoints[i+1];
                if (p1.pad) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '12px Courier New';
                    ctx.fillText(`${p1.mult}X`, p1.x + (p2.x - p1.x)/2 - 8, p1.y - 10);
                }
            }

            // Draw Lunar Module
            ctx.save();
            ctx.translate(lander.x, lander.y + lander.height/2);
            ctx.rotate(lander.angle + Math.PI/2); 

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            // Capsule
            ctx.moveTo(-6, -6);
            ctx.lineTo(6, -6);
            ctx.lineTo(9, 2);
            ctx.lineTo(-9, 2);
            ctx.closePath();
            
            // Legs
            ctx.moveTo(-7, 2);  ctx.lineTo(-11, 10); 
            ctx.moveTo(-13, 10); ctx.lineTo(-9, 10);  
            
            ctx.moveTo(7, 2);   ctx.lineTo(11, 10);  
            ctx.moveTo(9, 10);  ctx.lineTo(13, 10);  

            // Thruster
            ctx.moveTo(-3, 2);
            ctx.lineTo(-5, 5);
            ctx.lineTo(5, 5);
            ctx.lineTo(3, 2);

            ctx.stroke();

            if (lander.thrusting && gameActive) {
                ctx.strokeStyle = '#ffaa00';
                ctx.beginPath();
                ctx.moveTo(-4, 6);
                ctx.lineTo(0, 14 + Math.random() * 6);
                ctx.lineTo(4, 6);
                ctx.stroke();
            }
            ctx.restore();
        }

        function animate() {
            mechanicsStep();
            draw();
            if (gameActive) {
                requestAnimationFrame(animate);
            }
        }

        init();
    </script>
</body>
</html>
