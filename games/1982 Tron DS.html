<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tron: Light Cycles (vs AI)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        .game-wrapper {
            background: #12121f;
            padding: 20px 30px 25px;
            border-radius: 16px;
            border: 2px solid #2a2a5a;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border: 3px solid #2a2a5a;
            border-radius: 8px;
            background: #0d0d1a;
            width: 600px;
            height: 600px;
        }
        .info {
            display: flex;
            justify-content: space-between;
            color: #aac0ff;
            font-size: 18px;
            font-weight: bold;
            margin-top: 14px;
            padding: 0 10px;
        }
        .info .p1 {
            color: #66ddff;
        }
        .info .ai {
            color: #ff66aa;
        }
        .controls {
            color: #6688aa;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            border-top: 1px solid #1a1a3a;
            padding-top: 10px;
        }
        .controls kbd {
            background: #1a1a3a;
            padding: 2px 10px;
            border-radius: 4px;
            border: 1px solid #3a3a6a;
            color: #cce;
        }
        .controls .p1 {
            color: #66ddff;
        }
        .controls .ai {
            color: #ff66aa;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="info">
            <div class="p1">🔵 YOU <span id="score1">0</span></div>
            <div>🏆 TRON</div>
            <div class="ai">🔴 AI <span id="score2">0</span></div>
        </div>
        <div class="controls">
            <span class="p1"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</span> &nbsp;|&nbsp;
            <span class="ai">🤖 AI Opponent</span> &nbsp;|&nbsp;
            <kbd>Space</kbd> restart
        </div>
    </div>
    <script>
        // ----- SETUP -----
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const score1El = document.getElementById('score1');
        const score2El = document.getElementById('score2');

        const SIZE = 600;
        const COLS = 30;
        const ROWS = 30;
        const CELL = SIZE / COLS; // 20px

        // ----- GAME STATE -----
        let score1 = 0;
        let score2 = 0;
        let gameOver = false;
        let winner = '';
        let roundOver = false;
        let frameCount = 0;

        // ----- GRID (trails) -----
        let grid = [];

        function initGrid() {
            grid = [];
            for (let r = 0; r < ROWS; r++) {
                grid[r] = [];
                for (let c = 0; c < COLS; c++) {
                    grid[r][c] = 0;
                }
            }
        }

        // ----- PLAYERS -----
        const players = {
            p1: {
                x: 5,
                y: 15,
                dir: { dx: 1, dy: 0 },
                nextDir: { dx: 1, dy: 0 },
                color: '#66ddff',
                trailColor: 'rgba(102, 221, 255, 0.6)',
                alive: true,
                moveTimer: 0,
                isAI: false,
            },
            p2: {
                x: 24,
                y: 15,
                dir: { dx: -1, dy: 0 },
                nextDir: { dx: -1, dy: 0 },
                color: '#ff66aa',
                trailColor: 'rgba(255, 102, 170, 0.6)',
                alive: true,
                moveTimer: 0,
                isAI: true,
                // AI state
                aiTimer: 0,
                aiThinkInterval: 6, // frames between AI decisions
            },
        };

        // ----- INPUT -----
        const keys = {
            w: false,
            a: false,
            s: false,
            d: false,
            space: false,
        };

        // ----- AUDIO -----
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBeep(freq, duration) {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.start(now);
                osc.stop(now + duration);
            } catch (e) { /* ignore */ }
        }

        // ----- AI FUNCTIONS -----
        function isWall(col, row) {
            if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return true;
            return grid[row][col] !== 0;
        }

        function isSafe(col, row) {
            return !isWall(col, row);
        }

        function getValidDirections(x, y) {
            const dirs = [
                { dx: 0, dy: -1 },
                { dx: 0, dy: 1 },
                { dx: -1, dy: 0 },
                { dx: 1, dy: 0 },
            ];
            const valid = [];
            for (const d of dirs) {
                const nx = x + d.dx;
                const ny = y + d.dy;
                if (isSafe(nx, ny)) {
                    valid.push(d);
                }
            }
            return valid;
        }

        function getAIMove(ai, player) {
            const x = ai.x;
            const y = ai.y;
            const validDirs = getValidDirections(x, y);

            // If no valid moves, return current direction (will crash)
            if (validDirs.length === 0) {
                return ai.dir;
            }

            // Don't reverse direction (can't go back into your own trail)
            const reverse = { dx: -ai.dir.dx, dy: -ai.dir.dy };
            const forwardDirs = validDirs.filter(d =>
                !(d.dx === reverse.dx && d.dy === reverse.dy)
            );

            if (forwardDirs.length === 0) {
                // Only reverse is available – take it and hope
                return reverse;
            }

            // Strategy 1: Try to chase the player (cut them off)
            const dx = player.x - x;
            const dy = player.y - y;

            // Sort directions by how well they chase the player
            const scored = forwardDirs.map(d => {
                const nx = x + d.dx;
                const ny = y + d.dy;
                // Distance to player after this move
                const distToPlayer = Math.hypot(nx - player.x, ny - player.y);
                // Bonus for directions that are "toward" player
                const towardBonus = (d.dx * dx + d.dy * dy) / Math.max(1, Math.hypot(dx, dy));
                // Check how many moves we can make from this position (look ahead)
                const futureValid = getValidDirections(nx, ny);
                const futureScore = futureValid.length;

                // Score: closer to player + more options + toward player
                let score = 100 - distToPlayer * 5 + futureScore * 3 + towardBonus * 20;

                // Add some randomness so AI isn't perfect (difficulty slider)
                // Make AI harder (more predictable, smarter)
score += (Math.random() - 0.5) * 5;   // Less randomness


                return { dir: d, score: score };
            });

            // Sort by score descending
            scored.sort((a, b) => b.score - a.score);

            // 20% chance to pick 2nd best instead of best (adds unpredictability)
if (Math.random() < 0.05 && scored.length > 1) { // Only 5% chance for 2nd best
                return scored[1].dir;
            }

            return scored[0].dir;
        }

        // ----- RESET -----
        function resetRound() {
            initGrid();
            players.p1.x = 5;
            players.p1.y = 15;
            players.p1.dir = { dx: 1, dy: 0 };
            players.p1.nextDir = { dx: 1, dy: 0 };
            players.p1.alive = true;
            players.p1.moveTimer = 0;

            players.p2.x = 24;
            players.p2.y = 15;
            players.p2.dir = { dx: -1, dy: 0 };
            players.p2.nextDir = { dx: -1, dy: 0 };
            players.p2.alive = true;
            players.p2.moveTimer = 0;
            players.p2.aiTimer = 0;

            roundOver = false;
            gameOver = false;
            winner = '';
        }

        function resetGame() {
            score1 = 0;
            score2 = 0;
            resetRound();
            updateUI();
        }

        function updateUI() {
            score1El.textContent = score1;
            score2El.textContent = score2;
        }

        // ----- UPDATE -----
        function update() {
            if (gameOver || roundOver) {
                if (keys.space) {
                    if (gameOver) resetGame();
                    else resetRound();
                    keys.space = false;
                }
                return;
            }

            frameCount++;

            // ---- Player 1 input ----
            if (keys.w) players.p1.nextDir = { dx: 0, dy: -1 };
            else if (keys.s) players.p1.nextDir = { dx: 0, dy: 1 };
            else if (keys.a) players.p1.nextDir = { dx: -1, dy: 0 };
            else if (keys.d) players.p1.nextDir = { dx: 1, dy: 0 };

            // ---- AI logic ----
            const ai = players.p2;
            ai.aiTimer++;
            if (ai.aiTimer >= ai.aiThinkInterval) {
                ai.aiTimer = 0;
                if (ai.alive) {
                    const nextDir = getAIMove(ai, players.p1);
                    ai.nextDir = nextDir;
                }
            }

            // ---- Move players ----
            for (const p of [players.p1, players.p2]) {
                if (!p.alive) continue;

                p.moveTimer++;
                if (p.moveTimer % 6 === 0) {
                    // Apply next direction if valid
                    const nx = p.x + p.nextDir.dx;
                    const ny = p.y + p.nextDir.dy;
                    if (!isWall(nx, ny)) {
                        p.dir = { dx: p.nextDir.dx, dy: p.nextDir.dy };
                    }

                    // Move
                    const newX = p.x + p.dir.dx;
                    const newY = p.y + p.dir.dy;

                    // Check crash
                    if (isWall(newX, newY)) {
                        p.alive = false;
                        playBeep(200, 0.3);
                        continue;
                    }

                    // Place trail at current position
                    const trailId = p === players.p1 ? 1 : 2;
                    grid[p.y][p.x] = trailId;

                    // Move to new position
                    p.x = newX;
                    p.y = newY;
                }
            }

            // ---- Check if both dead ----
            if (!players.p1.alive && !players.p2.alive) {
                roundOver = true;
                winner = 'Draw!';
                playBeep(440, 0.3);
                return;
            }

            // ---- Check if one dead ----
            if (!players.p1.alive) {
                score2++;
                roundOver = true;
                winner = 'AI Wins!';
                playBeep(880, 0.2);
                updateUI();
                if (score2 >= 5) {
                    gameOver = true;
                    winner = '🤖 AI Wins the Game!';
                    playBeep(880, 0.4);
                }
                return;
            }

            if (!players.p2.alive) {
                score1++;
                roundOver = true;
                winner = 'You Win!';
                playBeep(880, 0.2);
                updateUI();
                if (score1 >= 5) {
                    gameOver = true;
                    winner = '🏆 You Win the Game!';
                    playBeep(880, 0.4);
                }
                return;
            }
        }

        // ----- DRAW -----
        function draw() {
            ctx.clearRect(0, 0, SIZE, SIZE);

            // ---- Grid background ----
            ctx.fillStyle = '#0d0d1a';
            ctx.fillRect(0, 0, SIZE, SIZE);

            // ---- Grid lines ----
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL, 0);
                ctx.lineTo(i * CELL, SIZE);
                ctx.stroke();
            }
            for (let i = 0; i <= ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * CELL);
                ctx.lineTo(SIZE, i * CELL);
                ctx.stroke();
            }

            // ---- Trails ----
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const val = grid[r][c];
                    if (val === 0) continue;
                    const x = c * CELL;
                    const y = r * CELL;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = val === 1 ? '#66ddff' : '#ff66aa';
                    ctx.fillStyle = val === 1 ? 'rgba(102, 221, 255, 0.5)' : 'rgba(255, 102, 170, 0.5)';
                    ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
                    ctx.shadowBlur = 0;
                }
            }

            // ---- Players ----
            for (const p of [players.p1, players.p2]) {
                if (!p.alive) continue;
                const x = p.x * CELL;
                const y = p.y * CELL;
                ctx.shadowBlur = 20;
                ctx.shadowColor = p.color;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(x + CELL / 2, y + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.arc(x + CELL / 2, y + CELL / 2, CELL / 4, 0, Math.PI * 2);
                ctx.fill();

                // Direction indicator
                const dx = p.dir.dx * 4;
                const dy = p.dir.dy * 4;
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.beginPath();
                ctx.arc(x + CELL / 2 + dx, y + CELL / 2 + dy, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // ---- AI label ----
            if (players.p2.alive) {
                ctx.fillStyle = 'rgba(255, 102, 170, 0.15)';
                ctx.font = '10px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('🤖 AI', players.p2.x * CELL + CELL / 2, players.p2.y * CELL - 2);
            }

            // ---- Round Over / Game Over ----
            if (roundOver || gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, SIZE, SIZE);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#ffdd44';
                ctx.fillStyle = '#ffdd44';
                ctx.font = 'bold 48px "Courier New", monospace';
                ctx.fillText(winner, SIZE / 2, SIZE / 2 - 20);

                if (gameOver) {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#aaccee';
                    ctx.font = '18px "Courier New", monospace';
                    ctx.fillText('Press SPACE to restart', SIZE / 2, SIZE / 2 + 40);
                } else {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#aaccee';
                    ctx.font = '18px "Courier New", monospace';
                    ctx.fillText('Press SPACE for next round', SIZE / 2, SIZE / 2 + 40);
                }
                ctx.shadowBlur = 0;
            }

            // ---- Score on canvas ----
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillStyle = 'rgba(102, 221, 255, 0.2)';
            ctx.font = '20px monospace';
            ctx.fillText('YOU: ' + score1, 10, 10);
            ctx.textAlign = 'right';
            ctx.fillStyle = 'rgba(255, 102, 170, 0.2)';
            ctx.fillText('AI: ' + score2, SIZE - 10, 10);
        }

        // ----- GAME LOOP -----
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ----- EVENT LISTENERS -----
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') { keys.w = true;
                e.preventDefault(); }
            if (key === 'a') { keys.a = true;
                e.preventDefault(); }
            if (key === 's') { keys.s = true;
                e.preventDefault(); }
            if (key === 'd') { keys.d = true;
                e.preventDefault(); }
            if (key === ' ') { keys.space = true;
                e.preventDefault(); }
            initAudio();
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = false;
            if (key === 'a') keys.a = false;
            if (key === 's') keys.s = false;
            if (key === 'd') keys.d = false;
            if (key === ' ') keys.space = false;
            e.preventDefault();
        });

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });

        // ----- START -----
        resetGame();
        gameLoop();
    </script>
</body>
</html>
