<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lunar Lander</title>
<style>
  body {
    background: black;
    color: white;
    font-family: monospace;
    text-align: center;
    margin: 0;
    overflow: hidden;
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 16px;
  }
  canvas {
    background: #000;
    display: block;
    margin: 0 auto;
  }
</style>
</head>
<body>

<div id="hud">
  Level: <span id="level">1</span><br>
  Fuel: <span id="fuel">1000</span><br>
  Vertical Speed: <span id="vs">0</span><br>
  Horizontal Speed: <span id="hs">0</span>
</div>

<canvas id="game" width="600" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let level = 0;

// LEVEL DATA — terrain + landing pads
const levels = [
  {
    terrain: [500,520,540,530,550,520,500],
    pads: [{ x: 250, width: 80 }]
  },
  {
    terrain: [520,540,560,530,510,530,560,540,520],
    pads: [{ x: 100, width: 60 }, { x: 420, width: 60 }]
  },
  {
    terrain: [540,560,580,550,520,500,520,550,580,560,540],
    pads: [{ x: 300, width: 50 }]
  }
];

let lander = {
  x: 300,
  y: 50,
  vx: 0,
  vy: 0,
  angle: 0,
  fuel: 1000,
  thrust: 0.04,
  rotateSpeed: 0.05
};

const gravity = 0.015;
let keys = {};

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

function resetLander() {
  lander.x = 300;
  lander.y = 50;
  lander.vx = 0;
  lander.vy = 0;
  lander.angle = 0;
  lander.fuel = 1000;
}

function drawTerrain() {
  const t = levels[level].terrain;

  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.moveTo(0, t[0]);

  const step = canvas.width / (t.length - 1);
  for (let i = 1; i < t.length; i++) {
    ctx.lineTo(i * step, t[i]);
  }

  ctx.lineTo(canvas.width, canvas.height);
  ctx.lineTo(0, canvas.height);
  ctx.closePath();
  ctx.fill();

  // landing pads
  ctx.fillStyle = "yellow";
  levels[level].pads.forEach(p => {
    ctx.fillRect(p.x, getTerrainHeight(p.x), p.width, 5);
  });
}

function getTerrainHeight(x) {
  const t = levels[level].terrain;
  const step = canvas.width / (t.length - 1);

  const i = Math.floor(x / step);
  const frac = (x % step) / step;

  const h1 = t[i];
  const h2 = t[Math.min(i + 1, t.length - 1)];

  return h1 + (h2 - h1) * frac;
}

function drawLander() {
  ctx.save();
  ctx.translate(lander.x, lander.y);
  ctx.rotate(lander.angle);

  ctx.strokeStyle = "white";
  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.moveTo(-10, 10);
  ctx.lineTo(10, 10);
  ctx.lineTo(0, -10);
  ctx.closePath();
  ctx.stroke();

  if (keys["ArrowUp"] && lander.fuel > 0) {
    ctx.fillStyle = "orange";
    ctx.beginPath();
    ctx.moveTo(-5, 12);
    ctx.lineTo(5, 12);
    ctx.lineTo(0, 20);
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();
}

function updatePhysics() {
  if (keys["ArrowLeft"]) lander.angle -= lander.rotateSpeed;
  if (keys["ArrowRight"]) lander.angle += lander.rotateSpeed;

  if (keys["ArrowUp"] && lander.fuel > 0) {
    lander.vx += Math.sin(lander.angle) * lander.thrust;
    lander.vy -= Math.cos(lander.angle) * lander.thrust;
    lander.fuel -= 1;
  }

  lander.vy += gravity;

  lander.x += lander.vx;
  lander.y += lander.vy;

  document.getElementById("fuel").textContent = lander.fuel;
  document.getElementById("vs").textContent = lander.vy.toFixed(2);
  document.getElementById("hs").textContent = lander.vx.toFixed(2);
}

function checkCollision() {
  const groundY = getTerrainHeight(lander.x);

  if (lander.y < groundY - 12) return;

  const speed = Math.abs(lander.vy) + Math.abs(lander.vx);
  const onPad = levels[level].pads.some(p =>
    lander.x > p.x && lander.x < p.x + p.width
  );

  if (onPad && speed < 1.2 && Math.abs(lander.angle) < 0.3) {
    nextLevel();
  } else {
    crash();
  }
}

function nextLevel() {
  level++;
  if (level >= levels.length) {
    winGame();
    return;
  }

  document.getElementById("level").textContent = level + 1;

  resetLander();
}

function crash() {
  ctx.fillStyle = "white";
  ctx.font = "40px monospace";
  ctx.fillText("CRASH!", 220, 300);
  cancelAnimationFrame(loopID);
}

function winGame() {
  ctx.fillStyle = "white";
  ctx.font = "40px monospace";
  ctx.fillText("MISSION COMPLETE!", 120, 300);
  cancelAnimationFrame(loopID);
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawTerrain();
  updatePhysics();
  drawLander();
  checkCollision();

  loopID = requestAnimationFrame(loop);
}

let loopID = requestAnimationFrame(loop);
</script>

</body>
</html>
