<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pengo (1982) – Final</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        .game-wrapper {
            background: #0f0f2a;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 60px rgba(0, 150, 255, 0.15);
        }
        canvas {
            display: block;
            background: #1a2a4a;
            border: 3px solid #2a5a8a;
            border-radius: 4px;
            width: 600px;
            height: 800px;
            image-rendering: pixelated;
        }
        .info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            color: #7a9acf;
            font-size: 16px;
            padding: 0 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .info span {
            color: #ffd700;
            font-weight: bold;
        }
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        button {
            background: #2a3a6e;
            border: none;
            color: #fff;
            padding: 6px 18px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #3a5a9e;
        }
        .key-hint {
            color: #4a6a9a;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
        }
        .key-hint kbd {
            background: #1a1a3a;
            padding: 2px 8px;
            border-radius: 3px;
            border: 1px solid #3a3a5a;
            color: #8a9aba;
        }
        .status-msg {
            color: #ff8844;
            font-size: 14px;
            text-align: center;
            margin-top: 6px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="600" height="800"></canvas>
        <div class="info">
            <div>🏆 Score: <span id="scoreDisplay">0</span></div>
            <div>❤️ Lives: <span id="livesDisplay">3</span></div>
            <div>📈 Round: <span id="roundDisplay">1</span></div>
            <div>🐝 Enemies: <span id="enemyDisplay">0</span></div>
            <div class="controls">
                <button id="restartBtn">↻ Restart</button>
            </div>
        </div>
        <div class="key-hint">
            <kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> Move &nbsp;·&nbsp; <kbd>R</kbd> Restart
        </div>
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <script>
        // ============================================================
        //  P E N G O   –   F I N A L
        //  - Improved enemy AI: weighted movement, avoids getting stuck
        //  - Blocks slide all the way, crushing enemies
        //  - Enemies kill on contact
        // ============================================================

        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600,
                H = 800;

            const scoreDisplay = document.getElementById('scoreDisplay');
            const livesDisplay = document.getElementById('livesDisplay');
            const roundDisplay = document.getElementById('roundDisplay');
            const enemyDisplay = document.getElementById('enemyDisplay');
            const statusMsg = document.getElementById('statusMsg');

            const COLS = 15;
            const ROWS = 20;
            const CELL = W / COLS;
            const HALF = CELL / 2;

            const EMPTY = 0;
            const ICE = 1;
            const WALL = 2;

            // ---------- game state ----------
            const game = {
                grid: [],
                score: 0,
                lives: 3,
                round: 1,
                phase: 'playing',
                frame: 0,
                spawnTimer: 0,
                maxEnemies: 3,
                enemyMoveDelay: 20,
                player: null,
                enemies: [],
                diamonds: [],
                slideData: null,
                locked: false,
                roundCompleteTimer: 0,
                deathFlash: 0,
                statusMessage: '',
                statusTimer: 0,
            };

            // ---------- grid helpers ----------
            function isWalkable(r, c) {
                if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
                return game.grid[r][c] === EMPTY;
            }

            function isIce(r, c) {
                if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
                return game.grid[r][c] === ICE;
            }

            function isWall(r, c) {
                if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return true;
                return game.grid[r][c] === WALL;
            }

            function isOccupied(r, c) {
                if (!game.player) return false;
                if (game.player.row === r && game.player.col === c) return true;
                for (const e of game.enemies) {
                    if (!e.alive) continue;
                    if (e.row === r && e.col === c) return true;
                }
                for (const d of game.diamonds) {
                    if (!d.alive) continue;
                    if (d.row === r && d.col === c) return true;
                }
                return false;
            }

            function isOccupiedByOther(r, c, skipEnemy) {
                for (const e of game.enemies) {
                    if (!e.alive) continue;
                    if (e === skipEnemy) continue;
                    if (e.row === r && e.col === c) return true;
                }
                for (const d of game.diamonds) {
                    if (!d.alive) continue;
                    if (d.row === r && d.col === c) return true;
                }
                return false;
            }

            function isBlocked(r, c) {
                if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return true;
                if (game.grid[r][c] === WALL) return true;
                if (game.grid[r][c] === ICE) return true;
                return false;
            }

            // ---------- level generation ----------
            function buildLevel(round) {
                const g = [];
                for (let r = 0; r < ROWS; r++) {
                    g[r] = [];
                    for (let c = 0; c < COLS; c++) {
                        g[r][c] = (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) ? WALL : EMPTY;
                    }
                }

                const blocks = [];
                for (let r = 2; r < ROWS - 2; r += 2) {
                    for (let c = 2; c < COLS - 2; c += 2) {
                        if (Math.random() < 0.6) {
                            blocks.push([r, c]);
                            if (Math.random() < 0.4 && r + 1 < ROWS - 2) blocks.push([r + 1, c]);
                            if (Math.random() < 0.4 && c + 1 < COLS - 2) blocks.push([r, c + 1]);
                            if (Math.random() < 0.3 && r + 1 < ROWS - 2 && c + 1 < COLS - 2) blocks.push([r + 1, c + 1]);
                        }
                    }
                }

                const removeCount = Math.min(Math.floor((round - 1) * 1.5), blocks.length - 10);
                const shuffled = [...blocks].sort(() => Math.random() - 0.5);
                const toPlace = shuffled.slice(removeCount);

                for (const [r, c] of toPlace) {
                    if (r > 0 && r < ROWS - 1 && c > 0 && c < COLS - 1) {
                        g[r][c] = ICE;
                    }
                }

                g[1][1] = EMPTY;
                g[ROWS - 2][COLS - 2] = EMPTY;
                g[ROWS - 2][1] = EMPTY;
                g[1][COLS - 2] = EMPTY;

                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (r < ROWS && c < COLS) g[r][c] = EMPTY;
                    }
                }

                return g;
            }

            // ---------- spawn enemies ----------
            function spawnEnemies() {
                const spawns = [
                    [ROWS - 2, COLS - 2],
                    [ROWS - 2, 1],
                    [1, COLS - 2]
                ];
                const count = Math.min(game.maxEnemies, spawns.length);
                const shuffled = spawns.sort(() => Math.random() - 0.5);
                for (let i = 0; i < count; i++) {
                    const [r, c] = shuffled[i];
                    if (isWalkable(r, c) && !isOccupied(r, c)) {
                        game.enemies.push({
                            row: r,
                            col: c,
                            alive: true,
                            moveTimer: Math.floor(Math.random() * game.enemyMoveDelay),
                            dir: 'down',
                            stunned: 0,
                            stuckCounter: 0, // track if enemy is stuck
                        });
                    }
                }
            }

            // ---------- spawn diamond (15% chance) ----------
            function spawnDiamond() {
                if (Math.random() > 0.15) return;

                const empty = [];
                for (let r = 1; r < ROWS - 1; r++) {
                    for (let c = 1; c < COLS - 1; c++) {
                        if (game.grid[r][c] === EMPTY && !isOccupied(r, c)) {
                            empty.push([r, c]);
                        }
                    }
                }
                if (empty.length === 0) return;
                const [r, c] = empty[Math.floor(Math.random() * empty.length)];
                game.diamonds.push({ row: r, col: c, alive: true, bob: Math.random() * Math.PI * 2 });
            }

            // ---------- push logic ----------
            function startSlide(blockRow, blockCol, dr, dc) {
                if (!isIce(blockRow, blockCol)) return false;

                const path = [];
                let r = blockRow + dr;
                let c = blockCol + dc;

                while (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                    const cell = game.grid[r][c];
                    if (cell === WALL || cell === ICE) break;

                    let hasDiamond = false;
                    for (const d of game.diamonds) {
                        if (d.alive && d.row === r && d.col === c) {
                            hasDiamond = true;
                            break;
                        }
                    }
                    if (hasDiamond) break;

                    path.push({ row: r, col: c });
                    r += dr;
                    c += dc;
                }

                if (path.length === 0) return false;

                game.slideData = {
                    path: path,
                    currentIndex: 0,
                    progress: 0,
                    currentRow: blockRow,
                    currentCol: blockCol,
                    dr: dr,
                    dc: dc,
                };

                game.player.row = blockRow;
                game.player.col = blockCol;
                game.locked = true;

                return true;
            }

            // ---------- player ----------
            function makePlayer() {
                return { row: 1, col: 1, dir: 'down' };
            }

            function movePlayer(dr, dc, dir) {
                if (game.phase !== 'playing') return;
                if (game.locked) return;
                if (game.slideData) return;
                if (game.deathFlash > 0) return;

                const p = game.player;
                const nr = p.row + dr;
                const nc = p.col + dc;

                if (isWalkable(nr, nc) && !isOccupied(nr, nc)) {
                    p.row = nr;
                    p.col = nc;
                    p.dir = dir;
                    checkEnemyCollision();
                    collectDiamonds();
                    return;
                }

                if (isIce(nr, nc)) {
                    const pushed = startSlide(nr, nc, dr, dc);
                    if (pushed) {
                        p.dir = dir;
                    }
                    return;
                }
            }

            // ---------- improved enemy AI ----------
            function updateEnemy(enemy) {
                if (!enemy.alive) return;
                if (enemy.stunned > 0) {
                    enemy.stunned--;
                    return;
                }
                if (game.slideData) return;

                enemy.moveTimer--;
                if (enemy.moveTimer > 0) return;

                enemy.moveTimer = game.enemyMoveDelay;

                const p = game.player;
                if (!p) return;

                // Get all four directions
                const dirs = [
                    { dr: -1, dc: 0, name: 'up' },
                    { dr: 1, dc: 0, name: 'down' },
                    { dr: 0, dc: -1, name: 'left' },
                    { dr: 0, dc: 1, name: 'right' },
                ];

                // Calculate distance to player for each direction
                const scored = dirs.map(d => {
                    const nr = enemy.row + d.dr;
                    const nc = enemy.col + d.dc;
                    const dist = Math.abs(nr - p.row) + Math.abs(nc - p.col);
                    const isPlayerCell = (nr === p.row && nc === p.col);
                    const isWalkableCell = isWalkable(nr, nc);
                    const notOccupied = !isOccupiedByOther(nr, nc, enemy);

                    // Score: lower is better
                    let score = dist * 10;
                    if (!isWalkableCell && !isPlayerCell) score += 1000;
                    if (isPlayerCell) score -= 50; // strongly prefer moving onto player
                    if (notOccupied) score -= 10;
                    if (isBlocked(nr, nc)) score += 500;

                    // Add some randomness to prevent getting stuck
                    score += Math.random() * 20;

                    return { ...d, nr, nc, score, isPlayerCell, isWalkableCell, notOccupied };
                });

                // Sort by score (lowest first)
                scored.sort((a, b) => a.score - b.score);

                // Try the best direction first
                for (const d of scored) {
                    const canMove = (d.isWalkableCell || d.isPlayerCell) && d.notOccupied;
                    if (canMove) {
                        enemy.row = d.nr;
                        enemy.col = d.nc;
                        enemy.dir = d.name;
                        enemy.stuckCounter = 0;

                        if (enemy.row === p.row && enemy.col === p.col) {
                            loseLife();
                        }
                        return;
                    }
                }

                // If all directions are blocked, try to push a block
                for (const d of scored) {
                    if (isIce(d.nr, d.nc)) {
                        const br = d.nr + d.dr;
                        const bc = d.nc + d.dc;
                        if (isWalkable(br, bc) && !isOccupied(br, bc)) {
                            const pushed = startSlide(d.nr, d.nc, d.dr, d.dc);
                            if (pushed) {
                                enemy.row = d.nr;
                                enemy.col = d.nc;
                                enemy.dir = d.name;
                                if (enemy.row === p.row && enemy.col === p.col) {
                                    loseLife();
                                }
                                return;
                            }
                        }
                    }
                }

                // Absolutely stuck - increment counter and try to move randomly
                enemy.stuckCounter++;
                if (enemy.stuckCounter > 3) {
                    // Try a completely random direction
                    const shuffled = dirs.sort(() => Math.random() - 0.5);
                    for (const d of shuffled) {
                        const nr = enemy.row + d.dr;
                        const nc = enemy.col + d.dc;
                        if ((isWalkable(nr, nc) || (nr === p.row && nc === p.col)) &&
                            !isOccupiedByOther(nr, nc, enemy)) {
                            enemy.row = nr;
                            enemy.col = nc;
                            enemy.dir = d.name;
                            enemy.stuckCounter = 0;
                            if (enemy.row === p.row && enemy.col === p.col) {
                                loseLife();
                            }
                            return;
                        }
                    }
                    enemy.stuckCounter = 0;
                }
            }

            // ---------- collision & collection ----------
            function checkEnemyCollision() {
                const p = game.player;
                if (!p) return;
                if (game.deathFlash > 0) return;

                for (const e of game.enemies) {
                    if (!e.alive) continue;
                    if (e.row === p.row && e.col === p.col) {
                        loseLife();
                        return;
                    }
                }
            }

            function collectDiamonds() {
                const p = game.player;
                if (!p) return;
                for (const d of game.diamonds) {
                    if (!d.alive) continue;
                    if (d.row === p.row && d.col === p.col) {
                        d.alive = false;
                        game.score += 200;
                        setStatus('💎 Diamond collected! +200');
                        updateDisplay();
                    }
                }
            }

            function countAliveEnemies() {
                return game.enemies.filter(e => e.alive).length;
            }

            // ---------- status messages ----------
            function setStatus(msg) {
                game.statusMessage = msg;
                game.statusTimer = 60;
                statusMsg.textContent = msg;
            }

            // ---------- lose life ----------
            function loseLife() {
                if (game.phase === 'gameOver') return;
                if (game.deathFlash > 0) return;

                game.lives--;
                game.deathFlash = 30;
                setStatus('💀 You died!');

                if (game.lives <= 0) {
                    game.phase = 'gameOver';
                    updateDisplay();
                    return;
                }

                setTimeout(() => {
                    game.player.row = 1;
                    game.player.col = 1;
                    game.enemies = [];
                    game.diamonds = [];
                    game.slideData = null;
                    game.locked = false;
                    game.deathFlash = 0;
                    spawnEnemies();
                    updateDisplay();
                    setStatus('🔄 Respawned');
                }, 600);
            }

            // ---------- round progression ----------
            function checkRoundComplete() {
                if (game.phase !== 'playing') return;
                if (game.slideData) return;
                if (countAliveEnemies() === 0) {
                    game.phase = 'roundComplete';
                    game.roundCompleteTimer = 60;
                    game.score += 500;
                    setStatus('🎉 Round Complete! +500');
                    updateDisplay();
                }
            }

            function nextRound() {
                game.round++;
                game.maxEnemies = Math.min(3 + Math.floor((game.round - 1) / 2), 8);
                game.enemyMoveDelay = Math.max(10, 20 - Math.floor((game.round - 1) / 2));
                game.enemies = [];
                game.diamonds = [];
                game.slideData = null;
                game.locked = false;
                game.grid = buildLevel(game.round);
                game.player.row = 1;
                game.player.col = 1;
                game.phase = 'playing';
                spawnEnemies();
                setStatus(`⚔️ Round ${game.round} started!`);
                updateDisplay();
            }

            // ---------- update ----------
            function update() {
                game.frame++;

                if (game.deathFlash > 0) {
                    game.deathFlash--;
                }

                if (game.statusTimer > 0) {
                    game.statusTimer--;
                    if (game.statusTimer === 0) {
                        statusMsg.textContent = '';
                    }
                }

                if (game.slideData) {
                    const sd = game.slideData;
                    sd.progress += 0.1;
                    if (sd.progress >= 1) {
                        sd.progress = 0;
                        const step = sd.path[sd.currentIndex];
                        const oldRow = sd.currentRow;
                        const oldCol = sd.currentCol;

                        game.grid[oldRow][oldCol] = EMPTY;
                        game.grid[step.row][step.col] = ICE;

                        let crushed = false;
                        for (const enemy of game.enemies) {
                            if (!enemy.alive) continue;
                            if (enemy.row === step.row && enemy.col === step.col) {
                                enemy.alive = false;
                                game.score += 100;
                                crushed = true;
                                spawnDiamond();
                            }
                        }
                        if (crushed) {
                            setStatus('💥 Crushed an enemy! +100');
                        }

                        sd.currentRow = step.row;
                        sd.currentCol = step.col;
                        sd.currentIndex++;

                        if (sd.currentIndex >= sd.path.length) {
                            game.slideData = null;
                            game.locked = false;
                            checkEnemyCollision();
                            collectDiamonds();
                            checkRoundComplete();
                        }
                    }
                }

                if (!game.slideData && game.deathFlash === 0) {
                    for (const e of game.enemies) {
                        updateEnemy(e);
                    }
                }

                game.spawnTimer++;
                if (game.spawnTimer > 300 && game.diamonds.filter(d => d.alive).length < 3) {
                    spawnDiamond();
                    game.spawnTimer = 0;
                }

                checkRoundComplete();

                if (game.phase === 'roundComplete') {
                    game.roundCompleteTimer--;
                    if (game.roundCompleteTimer <= 0) {
                        nextRound();
                    }
                }

                updateDisplay();
            }

            // ---------- render ----------
            function draw() {
                ctx.clearRect(0, 0, W, H);

                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const x = c * CELL;
                        const y = r * CELL;

                        if (game.grid[r][c] === WALL) {
                            ctx.fillStyle = '#2a3a5a';
                            ctx.fillRect(x, y, CELL, CELL);
                            ctx.strokeStyle = '#3a4a6a';
                            ctx.lineWidth = 1;
                            ctx.strokeRect(x, y, CELL, CELL);
                        } else if (game.grid[r][c] === ICE) {
                            drawIceBlock(ctx, x, y, CELL);
                        } else {
                            ctx.fillStyle = '#1a3a5a';
                            ctx.fillRect(x, y, CELL, CELL);
                            ctx.strokeStyle = 'rgba(42,90,138,0.15)';
                            ctx.lineWidth = 0.5;
                            ctx.strokeRect(x, y, CELL, CELL);
                        }
                    }
                }

                if (game.slideData) {
                    const sd = game.slideData;
                    const fromRow = sd.currentRow;
                    const fromCol = sd.currentCol;
                    const toRow = sd.path[sd.currentIndex].row;
                    const toCol = sd.path[sd.currentIndex].col;
                    const t = sd.progress;
                    const sx = (fromCol + (toCol - fromCol) * t) * CELL;
                    const sy = (fromRow + (toRow - fromRow) * t) * CELL;
                    drawIceBlock(ctx, sx, sy, CELL);
                }

                for (const d of game.diamonds) {
                    if (!d.alive) continue;
                    const x = d.col * CELL + HALF;
                    const y = d.row * CELL + HALF + Math.sin(game.frame / 20 + d.bob) * 3;
                    const s = CELL * 0.35;
                    ctx.save();
                    ctx.shadowColor = '#00ddff';
                    ctx.shadowBlur = 18;
                    ctx.fillStyle = '#00ddff';
                    ctx.strokeStyle = '#00aacc';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x, y - s);
                    ctx.lineTo(x + s, y);
                    ctx.lineTo(x, y + s);
                    ctx.lineTo(x - s, y);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    ctx.beginPath();
                    ctx.moveTo(x - s * 0.3, y - s * 0.3);
                    ctx.lineTo(x, y - s * 0.5);
                    ctx.lineTo(x + s * 0.3, y - s * 0.2);
                    ctx.fill();
                    ctx.restore();
                }

                for (const e of game.enemies) {
                    if (!e.alive) continue;
                    const x = e.col * CELL + HALF;
                    const y = e.row * CELL + HALF;
                    drawEnemy(ctx, x, y, CELL, e.stunned > 0);
                }

                if (game.player && game.deathFlash % 6 < 3) {
                    const p = game.player;
                    const x = p.col * CELL + HALF;
                    const y = p.row * CELL + HALF;
                    drawPengo(ctx, x, y, CELL, p.dir);
                }

                if (game.phase === 'roundComplete') {
                    ctx.fillStyle = 'rgba(0,0,0,0.35)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = '#4f4';
                    ctx.font = 'bold 48px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.shadowColor = '#4f4';
                    ctx.shadowBlur = 30;
                    ctx.fillText('ROUND COMPLETE!', W / 2, H / 2);
                    ctx.shadowBlur = 0;
                }

                if (game.phase === 'gameOver') {
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = '#f44';
                    ctx.font = 'bold 48px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.shadowColor = '#f44';
                    ctx.shadowBlur = 40;
                    ctx.fillText('GAME OVER', W / 2, H / 2 - 20);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ffd700';
                    ctx.font = '24px "Courier New", monospace';
                    ctx.fillText(`Score: ${game.score}`, W / 2, H / 2 + 40);
                    ctx.fillStyle = '#4a6a9a';
                    ctx.font = '16px "Courier New", monospace';
                    ctx.fillText('Press RESTART or R', W / 2, H / 2 + 80);
                }

                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(0, 0, W, 22);
                ctx.fillStyle = '#7a9acf';
                ctx.font = '13px monospace';
                ctx.textAlign = 'left';
                ctx.fillText(`Round ${game.round}`, 8, 16);
                const alive = game.enemies.filter(e => e.alive).length;
                ctx.textAlign = 'right';
                ctx.fillText(`Enemies: ${alive}`, W - 8, 16);

                if (game.slideData) {
                    ctx.fillStyle = 'rgba(255,255,100,0.5)';
                    ctx.font = '11px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('⏳ sliding...', W / 2, H - 8);
                }
            }

            // ---- drawing helpers ----
            function drawIceBlock(ctx, x, y, size) {
                const grad = ctx.createLinearGradient(x, y, x + size, y + size);
                grad.addColorStop(0, '#4a8ab5');
                grad.addColorStop(0.5, '#5a9ac5');
                grad.addColorStop(1, '#3a7aa5');
                ctx.fillStyle = grad;
                ctx.fillRect(x, y, size, size);
                ctx.fillStyle = 'rgba(255,255,255,0.12)';
                ctx.fillRect(x + 2, y + 2, size - 4, 3);
                ctx.fillRect(x + 2, y + 2, 3, size - 4);
                ctx.strokeStyle = '#2a6a8a';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, size, size);
            }

            function drawPengo(ctx, x, y, size, dir) {
                const s = size * 0.7;
                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 10;

                ctx.fillStyle = '#222';
                ctx.beginPath();
                ctx.ellipse(x, y + s * 0.2, s * 0.5, s * 0.45, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.ellipse(x, y + s * 0.2, s * 0.35, s * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#222';
                ctx.beginPath();
                ctx.arc(x, y - s * 0.3, s * 0.35, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(x - s * 0.15, y - s * 0.38, s * 0.14, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + s * 0.15, y - s * 0.38, s * 0.14, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#222';
                ctx.beginPath();
                ctx.arc(x - s * 0.12, y - s * 0.36, s * 0.07, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + s * 0.18, y - s * 0.36, s * 0.07, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ff8800';
                ctx.beginPath();
                ctx.moveTo(x, y - s * 0.22);
                ctx.lineTo(x - s * 0.12, y - s * 0.15);
                ctx.lineTo(x + s * 0.12, y - s * 0.15);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#222';
                ctx.beginPath();
                ctx.ellipse(x - s * 0.5, y + s * 0.1, s * 0.12, s * 0.25, -0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(x + s * 0.5, y + s * 0.1, s * 0.12, s * 0.25, 0.4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ff8800';
                ctx.beginPath();
                ctx.ellipse(x - s * 0.2, y + s * 0.5, s * 0.15, s * 0.08, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(x + s * 0.2, y + s * 0.5, s * 0.15, s * 0.08, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            function drawEnemy(ctx, x, y, size, stunned) {
                const s = size * 0.65;
                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.25)';
                ctx.shadowBlur = 8;

                const col = stunned ? '#ffaa44' : '#ffcc00';
                const stroke = stunned ? '#cc8833' : '#cc9900';

                ctx.fillStyle = col;
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(x, y, s * 0.5, s * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.strokeStyle = stunned ? '#aa7733' : '#aa7700';
                ctx.lineWidth = 2;
                for (let i = -2; i <= 2; i++) {
                    const sy = y + (i * s * 0.18);
                    ctx.beginPath();
                    ctx.moveTo(x - s * 0.4, sy);
                    ctx.lineTo(x + s * 0.4, sy);
                    ctx.stroke();
                }

                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(x - s * 0.2, y - s * 0.1, s * 0.16, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + s * 0.2, y - s * 0.1, s * 0.16, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#222';
                ctx.beginPath();
                ctx.arc(x - s * 0.16, y - s * 0.08, s * 0.08, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + s * 0.24, y - s * 0.08, s * 0.08, 0, Math.PI * 2);
                ctx.fill();

                if (!stunned) {
                    ctx.strokeStyle = '#222';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x - s * 0.3, y - s * 0.25);
                    ctx.lineTo(x - s * 0.1, y - s * 0.2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x + s * 0.3, y - s * 0.25);
                    ctx.lineTo(x + s * 0.1, y - s * 0.2);
                    ctx.stroke();
                }

                ctx.restore();
            }

            // ---------- display ----------
            function updateDisplay() {
                scoreDisplay.textContent = game.score;
                livesDisplay.textContent = game.lives;
                roundDisplay.textContent = game.round;
                const alive = game.enemies.filter(e => e.alive).length;
                enemyDisplay.textContent = alive;
            }

            // ---------- reset ----------
            function resetGame() {
                game.score = 0;
                game.lives = 3;
                game.round = 1;
                game.phase = 'playing';
                game.frame = 0;
                game.spawnTimer = 0;
                game.maxEnemies = 3;
                game.enemyMoveDelay = 20;
                game.enemies = [];
                game.diamonds = [];
                game.slideData = null;
                game.locked = false;
                game.deathFlash = 0;
                game.statusMessage = '';
                game.statusTimer = 0;
                game.grid = buildLevel(1);
                game.player = makePlayer();
                game.roundCompleteTimer = 0;
                spawnEnemies();
                statusMsg.textContent = '🎮 Game started!';
                updateDisplay();
            }

            // ---------- input ----------
            document.addEventListener('keydown', (e) => {
                const key = e.key;
                if (key === 'r' || key === 'R') {
                    resetGame();
                    return;
                }
                if (game.phase === 'gameOver' || game.phase === 'roundComplete') return;
                if (game.deathFlash > 0) return;
                if (game.slideData) return;

                switch (key) {
                    case 'ArrowUp':
                        e.preventDefault();
                        movePlayer(-1, 0, 'up');
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        movePlayer(1, 0, 'down');
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        movePlayer(0, -1, 'left');
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        movePlayer(0, 1, 'right');
                        break;
                }
            });

            document.getElementById('restartBtn').addEventListener('click', resetGame);

            // ---------- game loop ----------
            function gameLoop() {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }

            resetGame();
            gameLoop();

            console.log('🐧 Pengo – Final: improved enemy AI, blocks slide all the way');
        })();
    </script>
</body>
</html>
