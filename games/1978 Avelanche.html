<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avalanche (1978)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        .game-wrapper {
            background: #16213e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 150, 255, 0.2);
        }
        canvas {
            display: block;
            background: #0a0a1a;
            border: 2px solid #2a3a6e;
            border-radius: 4px;
            cursor: none;
            width: 600px;
            height: 600px;
        }
        .info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            color: #7a9acf;
            font-size: 18px;
            padding: 0 10px;
        }
        .info span {
            color: #ffd700;
            font-weight: bold;
            font-size: 22px;
        }
        .controls {
            color: #4a6a9a;
            font-size: 14px;
            text-align: center;
            margin-top: 8px;
        }
        button {
            background: #2a3a6e;
            border: none;
            color: #fff;
            padding: 8px 24px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #3a5a9e;
        }
        .status {
            color: #ff6b6b;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="info">
            <div>💎 Score: <span id="scoreDisplay">0</span></div>
            <div>❤️ Lives: <span id="livesDisplay">3</span></div>
            <div>⏱️ Level: <span id="levelDisplay">1</span></div>
            <button id="restartBtn">↻ Restart</button>
        </div>
        <div class="controls">🖱️ Move mouse to control paddle • Catch all boulders!</div>
    </div>

    <script>
        // ============================================================
        //  AVALANCHE (1978) – Pure HTML/JS Implementation
        //  Inspired by the classic Exidy arcade game
        // ============================================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const livesSpan = document.getElementById('livesDisplay');
        const levelSpan = document.getElementById('levelDisplay');

        // ---------- GAME STATE ----------
        const GAME = {
            running: false,
            over: false,
            score: 0,
            lives: 3,
            level: 1,
            maxLives: 5,
        };

        // ---------- PADDLE ----------
        const paddle = {
            width: 80,
            height: 14,
            x: 0,
            y: 570,
            speed: 8,
            color: '#4af',
            glowColor: 'rgba(68, 170, 255, 0.3)',
        };

        // ---------- BOULDERS ----------
        let boulders = [];
        const BOULDER = {
            minRadius: 8,
            maxRadius: 18,
            baseSpeed: 1.2,
            speedIncrement: 0.15,
            spawnInterval: 40, // frames between spawns
            maxOnScreen: 35,
        };

        // ---------- PARTICLES (for catch/break effects) ----------
        let particles = [];

        // ---------- FRAME TIMING ----------
        let frameCount = 0;
        let spawnCounter = 0;

        // ---------- INPUT ----------
        let mouseX = 300;

        // ============================================================
        //  INIT / RESET
        // ============================================================
        function resetGame() {
            GAME.running = true;
            GAME.over = false;
            GAME.score = 0;
            GAME.lives = 3;
            GAME.level = 1;
            boulders = [];
            particles = [];
            paddle.x = 300 - paddle.width / 2;
            frameCount = 0;
            spawnCounter = 0;
            updateDisplay();
        }

        function resetLevel() {
            boulders = [];
            particles = [];
            spawnCounter = 0;
            // Increase difficulty with level
            const speedMult = 1 + (GAME.level - 1) * 0.2;
            BOULDER.baseSpeed = 1.2 * speedMult;
            // More boulders per level
            BOULDER.maxOnScreen = Math.min(35 + GAME.level * 2, 60);
            // Slightly faster spawn
            BOULDER.spawnInterval = Math.max(20, 40 - GAME.level * 1.5);
        }

        // ============================================================
        //  BOULDER SPAWNING
        // ============================================================
        function spawnBoulder() {
            if (boulders.length >= BOULDER.maxOnScreen) return;
            if (!GAME.running || GAME.over) return;

            const radius = BOULDER.minRadius + Math.random() * (BOULDER.maxRadius - BOULDER.minRadius);
            // Random x position, keeping boulders away from extreme edges
            const x = radius + Math.random() * (canvas.width - radius * 2);
            const y = -radius - Math.random() * 20;

            // Slight horizontal drift – adds variety
            const drift = (Math.random() - 0.5) * 0.6;

            // Randomize color slightly – all in the gray/stone family
            const brightness = 120 + Math.floor(Math.random() * 80);
            const color = `rgb(${brightness}, ${brightness - 20}, ${brightness - 40})`;
            const highlight = `rgb(${brightness + 40}, ${brightness + 20}, ${brightness})`;

            boulders.push({
                x: x,
                y: y,
                radius: radius,
                speed: BOULDER.baseSpeed + (Math.random() - 0.5) * 0.4,
                drift: drift,
                color: color,
                highlight: highlight,
                // Slight rotation visual effect
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.03,
            });
        }

        // ============================================================
        //  PARTICLES
        // ============================================================
        function createBurst(x, y, color, count = 20) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 4;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    radius: 2 + Math.random() * 4,
                    life: 1.0,
                    decay: 0.008 + Math.random() * 0.015,
                    color: color,
                });
            }
        }

        // ============================================================
        //  UPDATE
        // ============================================================
        function update() {
            if (!GAME.running || GAME.over) return;

            frameCount++;

            // --- Spawn boulders ---
            spawnCounter++;
            if (spawnCounter >= BOULDER.spawnInterval) {
                spawnCounter = 0;
                spawnBoulder();
                // Sometimes spawn an extra one at higher levels
                if (GAME.level > 3 && Math.random() < 0.3) {
                    spawnBoulder();
                }
            }

            // --- Update boulders ---
            const paddleLeft = paddle.x;
            const paddleRight = paddle.x + paddle.width;
            const paddleTop = paddle.y;
            const paddleBottom = paddle.y + paddle.height;

            for (let i = boulders.length - 1; i >= 0; i--) {
                const b = boulders[i];

                // Move
                b.y += b.speed;
                b.x += b.drift;
                b.rotation += b.rotSpeed;

                // Wrap horizontal (with a little bounce-off at edges)
                if (b.x - b.radius < 0) {
                    b.x = b.radius;
                    b.drift *= -0.5;
                } else if (b.x + b.radius > canvas.width) {
                    b.x = canvas.width - b.radius;
                    b.drift *= -0.5;
                }

                // --- Collision with paddle ---
                const bx = b.x;
                const by = b.y;
                const r = b.radius;

                // Simple AABB vs circle collision
                const closestX = Math.max(paddleLeft, Math.min(bx, paddleRight));
                const closestY = Math.max(paddleTop, Math.min(by, paddleBottom));
                const distX = bx - closestX;
                const distY = by - closestY;
                const dist = Math.sqrt(distX * distX + distY * distY);

                if (dist < r) {
                    // CAUGHT!
                    createBurst(bx, by, b.color, 15);
                    GAME.score += Math.floor(10 + GAME.level * 2);
                    boulders.splice(i, 1);
                    updateDisplay();

                    // Score-based level up
                    const newLevel = Math.floor(GAME.score / 100) + 1;
                    if (newLevel > GAME.level) {
                        GAME.level = newLevel;
                        resetLevel();
                        updateDisplay();
                        // Bonus particles for leveling up!
                        for (let j = 0; j < 10; j++) {
                            createBurst(
                                Math.random() * canvas.width,
                                Math.random() * canvas.height * 0.5,
                                '#ffd700', 10
                            );
                        }
                    }
                    continue;
                }

                // --- Missed (hit bottom) ---
                if (b.y - b.radius > canvas.height) {
                    // Miss!
                    GAME.lives--;
                    if (GAME.lives <= 0) {
                        GAME.over = true;
                        GAME.running = false;
                    } else {
                        // Shake effect: just remove the boulder and continue
                        createBurst(b.x, canvas.height - 10, '#ff4444', 25);
                    }
                    boulders.splice(i, 1);
                    updateDisplay();
                    continue;
                }
            }

            // --- Update particles ---
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05; // gravity
                p.life -= p.decay;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // --- Slowly increase difficulty over time within a level ---
            if (frameCount % 600 === 0 && GAME.level < 10) {
                // Every ~10 seconds, slightly increase spawn rate
                BOULDER.spawnInterval = Math.max(15, BOULDER.spawnInterval - 0.5);
            }
        }

        // ============================================================
        //  DRAW
        // ============================================================
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- Background "night sky" subtle gradient ---
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#0a0a1a');
            grad.addColorStop(0.5, '#0f0f2a');
            grad.addColorStop(1, '#050510');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // --- Ground line ---
            ctx.strokeStyle = 'rgba(40, 80, 160, 0.3)';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 8]);
            ctx.beginPath();
            ctx.moveTo(0, paddle.y + 20);
            ctx.lineTo(canvas.width, paddle.y + 20);
            ctx.stroke();
            ctx.setLineDash([]);

            // --- Draw boulders ---
            for (const b of boulders) {
                // Glow
                const glow = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.radius * 2);
                glow.addColorStop(0, 'rgba(100, 150, 255, 0.08)');
                glow.addColorStop(1, 'rgba(100, 150, 255, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius * 2, 0, Math.PI * 2);
                ctx.fill();

                // Main rock body with slight 3D shading
                const grad2 = ctx.createRadialGradient(
                    b.x - b.radius * 0.3, b.y - b.radius * 0.3, 0,
                    b.x, b.y, b.radius
                );
                grad2.addColorStop(0, b.highlight);
                grad2.addColorStop(0.7, b.color);
                grad2.addColorStop(1, '#1a1a2a');
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();

                // Edge highlight
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(b.x - 2, b.y - 3, b.radius * 0.7, 0, Math.PI * 2);
                ctx.stroke();

                // Subtle crack line for texture
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(b.x - b.radius * 0.5, b.y - b.radius * 0.2);
                ctx.lineTo(b.x + b.radius * 0.3, b.y + b.radius * 0.4);
                ctx.stroke();
            }

            // --- Draw paddle ---
            // Glow
            const paddleGlow = ctx.createRadialGradient(
                paddle.x + paddle.width / 2, paddle.y + paddle.height / 2, 0,
                paddle.x + paddle.width / 2, paddle.y + paddle.height / 2, paddle.width * 0.8
            );
            paddleGlow.addColorStop(0, 'rgba(68, 170, 255, 0.2)');
            paddleGlow.addColorStop(1, 'rgba(68, 170, 255, 0)');
            ctx.fillStyle = paddleGlow;
            ctx.beginPath();
            ctx.ellipse(paddle.x + paddle.width / 2, paddle.y + paddle.height / 2, paddle.width * 0.8, 20, 0, 0, Math.PI * 2);
            ctx.fill();

            // Main paddle body
            const pGrad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.height);
            pGrad.addColorStop(0, '#6af');
            pGrad.addColorStop(0.5, '#4af');
            pGrad.addColorStop(1, '#28a');
            ctx.fillStyle = pGrad;
            ctx.shadowColor = 'rgba(68, 170, 255, 0.5)';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 6);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Paddle highlight
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.beginPath();
            ctx.roundRect(paddle.x + 8, paddle.y + 2, paddle.width - 16, 4, 2);
            ctx.fill();

            // --- Draw particles ---
            for (const p of particles) {
                const alpha = p.life;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            // --- Game Over overlay ---
            if (GAME.over) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 48px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 30;
                ctx.fillText('💀 GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#7a9acf';
                ctx.font = '20px "Courier New", monospace';
                ctx.fillText(`Final Score: ${GAME.score}  •  Level: ${GAME.level}`, canvas.width / 2, canvas.height / 2 + 40);
                ctx.fillStyle = '#4a6a9a';
                ctx.font = '16px "Courier New", monospace';
                ctx.fillText('Press RESTART to play again', canvas.width / 2, canvas.height / 2 + 80);
            }

            // --- Instructions when game starts ---
            if (!GAME.running && !GAME.over) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#7a9acf';
                ctx.font = 'bold 32px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('❄️ AVALANCHE', canvas.width / 2, canvas.height / 2 - 40);
                ctx.font = '18px "Courier New", monospace';
                ctx.fillStyle = '#4a6a9a';
                ctx.fillText('Move mouse to catch boulders', canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText('Press RESTART to begin', canvas.width / 2, canvas.height / 2 + 60);
            }
        }

        // ============================================================
        //  DISPLAY UPDATE
        // ============================================================
        function updateDisplay() {
            scoreSpan.textContent = GAME.score;
            livesSpan.textContent = GAME.lives;
            levelSpan.textContent = GAME.level;
        }

        // ============================================================
        //  GAME LOOP
        // ============================================================
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ============================================================
        //  POLYFILL FOR roundRect (for older browsers)
        // ============================================================
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }

        // ============================================================
        //  EVENT LISTENERS
        // ============================================================
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            mouseX = (e.clientX - rect.left) * scaleX;
            // Clamp
            mouseX = Math.max(0, Math.min(canvas.width, mouseX));
            paddle.x = mouseX - paddle.width / 2;
            // Keep paddle on screen
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));
        });

        // Touch support for mobile
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const touch = e.touches[0];
            mouseX = (touch.clientX - rect.left) * scaleX;
            mouseX = Math.max(0, Math.min(canvas.width, mouseX));
            paddle.x = mouseX - paddle.width / 2;
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));
        }, { passive: false });

        // Restart
        document.getElementById('restartBtn').addEventListener('click', () => {
            resetGame();
            resetLevel();
            updateDisplay();
        });

        // ============================================================
        //  START
        // ============================================================
        resetGame();
        resetLevel();
        updateDisplay();
        // Start the loop
        gameLoop();

        console.log('❄️ Avalanche (1978) – Loaded and ready!');
        console.log('🎯 Move mouse to catch boulders. Good luck!');
    </script>
</body>
</html>
